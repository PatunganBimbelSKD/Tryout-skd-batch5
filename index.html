si komunikasi antaranggota yang belum merata sehingga kontribusinya terhadap penguatanjejaring kerja menjadi palingkecil","source":"AyoCPNS"},{"n":88,"section":"TKP","topic":"Jejaring Kerja","prompt":"Aca memiliki rekan kerja yang tidak menggunakan media sosial sehingga beberapa informasi pekerjaan sering diterimanya lebih lambat dibanding anggota tim lainnya. Meskipun demikian, rekan tersebut selalu menyelesaikan pekerjaannya dengan baik. Sikap Aca sebaiknya...","options":["Memastikan informasi penting tetap diterima melalui media komunikasi yang disepakati.","Menyesuaikan cara berkomunikasi sesuai kebiasaan rekan tersebut saat bekerja.","Mengingatkan rekan tersebut untuk lebih rutin memeriksa saluran komunikasi kerja.","Membantu meneruskan informasi apabila dibutuhkan dalam pelaksanaan pekerjaan.","Menyarankan penggunaan media komunikasi yang lebih mudah dijangkau seluruh anggota."],"answer":"A","points":[5,4,3,2,1],"explanation":"A (5 poin) ini merupakan pilihan terbaik karena Aca memastikan informasi penting tetap diterima melalui media komunikasi yang telah disepakati bersama. Langkah ini menjaga kelancaran koordinasi tanpa mempersoalkan pilihan pribadi rekan kerja dalam menggunakan media sosial. Pendekatan tersebut mencerminkan nilai Kolaboratif dengan memastikan setiap anggota memperoleh informasi yang sama serta Adaptif melalui pemanfaatan saluran komunikasi yang sesuai dengan kebutuhan tim. B (4 poin) Opsi ini sudah baik karena Aca berusaha menyesuaikan cara berkomunikasi dengan kebiasaan rekan kerja sehingga koordinasi tetap berjalan efektif. Pendekatan tersebut menunjukkan penghargaan terhadap perbedaan setiap anggota tim. Namun, pilihan ini belum secara eksplisit memastikan bahwa informasi penting benar-benartersampaikan secara konsisten. (3 Poin) Opsi ini cukup tepat karena mengingatkan rekan kerja agar lebih rutin memeriksa saluran komunikasi yang digunakan dalam pekerjaan dapat membantu mengurangi keterlambatan informasi. Akan tetapi, fokus penyelesaiannya lebih banyak dibebankan kepada rekan tersebut, sementara efektivitas komunikasi merupakan tanggung jawab bersama dalam tim. D (2 poin) Opsi ini memiliki nilai positif karena Aca bersedia membantu meneruskan informasi ketika diperlukan. Namun, tindakan tersebut lebih bersifat insidental dan bergantung pada kondisi tertentu sehingga belum memberikan solusi yang konsisten terhadap kendala komunikasi yang terjadi E (1 poin) Opsiini bertujuan meningkatkan kemudahan komunikasi bagi seluruh anggota tim melalui penggunaan media yang sama. Namun sebagai rekan kerja, Aca tidak memiliki kewenangan untuk mengarahkan perubahan pola komunikasi tim. Selain itu, persoalanutama bukan terletak pada pilihan media, melainkan bagaimana memastikan informasi pekerjaan tetap diterima oleh seluruh anggota secara efektif.","source":"AyoCPNS"},{"n":89,"section":"TKP","topic":"Jejaring Kerja","prompt":"Aca memiliki rekan kerja yang cukup sering menawarkan bantuan saat menyelesaikan pekerjaan. Sebagian rekan menilai sikap tersebut dilakukan untuk mencari perhatian atasan, tetapi Aca belum pernah melihat adanya dampak negatif terhadap pekerjaan tim. Sikap Aca sebaiknya...","options":["Menghargai bantuan yang diberikan selama mendukung penyelesaian pekerjaan bersama.","Menilai rekan tersebut berdasarkan perilaku dan hasil kerjanya secara langsung.","Tetap bekerja sama secara profesional tanpa terpengaruh penilaian rekan lain.","Menerima bantuan sesuai kebutuhan sambil menjaga pembagian tugas tetap proporsional.","Memastikan setiap anggota memperoleh kesempatan berkontribusi secara seimbang."],"answer":"C","points":[2,3,5,4,1],"explanation":"C (5 poin) Ini merupakan pilihan terbaik karena Aca tetap menjalin kerja sama secara profesional tanpa terpengaruh oleh penilaian atau persepsi rekan lain yang belum tentu benar. Penilaian terhadap seseorang sebaiknya didasarkan pada pengalaman dan fakta yang dapat dipertanggung jawabkan, bukan pada opini yang berkembang di lingkungan kerja. Sikap ini mencerminkan nilai Harmonis dengan menghindari prasangka serta Kolaboratif melalui kemauan bekerja sama secara objektif demi kepentingan tim D (4 poin) Opsi ini sudah baik karena Aca tetap menerima bantuan sesuai kebutuhan sambil menjaga agar pembagian tugas tetap proporsional. Pendekatan ini memungkinkan kerja sama tetap berlangsung tanpa menimbulkan ketergantungan atau kesan bahwa beban kerja tidak dibagi secara adil. Namun, fokus utamanya lebih pada pengelolaan pekerjaan daripada menjaga objektivitas terhadap persepsi yangberedar. B (3 poin) Opsi ini cukup tepat karena Aca memilih menilai rekan kerja berdasarkan perilaku dan hasil kerjanya secara langsung. Sikap tersebut menunjukkan objektivitas dalam membangun hubungan kerja, Akan tetapi, pilihan ini belum secara nyata menunjukkan bagairnana Aca tetap membangun kolaborasi ketika bantuan tersebut memang dibutuhkan A (2 poin) Opsi ini memiliki nilai positif karena Aca menghargai niat baik rekan yang menawarkan bantuan selama pekerjaan dapat diselesaikan dengan baik. Namun, hanya berfokus pada penerimaan bantuan belum menunjukkan sikap objektif terhadap persepsi yang berkembang maupun pengelolaan hubungan kerja secara lebih menyeluruh, E (1 poin) Opsiiini bertujuan menjaga kesempatan berkontribusi bagi seluruh anggota tim sehingga mencerminkan semangat kebersamaan. Namun, sebagai rekan kerja, Aca tidak memiliki kewenangan untuk mengatur porsi kontribusi setiap anggota. Selain itu, tindakan tersebut belum menjawab persoalan utama, yaitu bagaimana menyikapi persepsi terhadap rekan kerja secara profesional. d","source":"AyoCPNS"},{"n":90,"section":"TKP","topic":"Sosial Budaya","prompt":"Damar baru bergabung dalam sebuah tim kerja yang beranggotakan orang-orang dari latar belakang yang beragam. Ia terbiasa menolak berjabat tangan dengan lawan jenis karena keyakinan yang dianutnya. Suatu hari, salah seorang rekan kerja perempuan tampak sedikit terkejut ketika Damar menolak uluran tangannya saat perkenalan pertama. Sikap Damar sebaiknya...","options":["Menjelaskan secara sopan alasan dirinya tidak berjabat tangan sambil tetap menunjukkan sikap hormat kepada rekan kerja tersebut.","Menghindari situasi perkenalan yang berpotensi menimbulkan kondisi serupa di kemudian hari.","Tetap mempertahankan kebiasaannya dengan memberikan penjelasan karena hal tersebut merupakan bagian dari keyakinan pribadi.","Meminta rekan kerja lain membantu menjelaskan kebiasaannya kepada anggota tim yang belum memahaminya.","Menyesuaikan kebiasaannya dengan lingkungan kerja agar tidak menimbulkan kesalahpahaman dengan rekan-rekan yang lain"],"answer":"A","points":[5,1,4,2,3],"explanation":"A (Poin 5) Hal ini karena Damar tetap mempertahankan keyakinan yang dianutnya tanpa mengabaikan perasaan dan kenyamanan rekan kerja. Dengan memberikan penjelasan secara sopan, potensi kesalahpahaman dapat diminimalkan dan hubungan kerja tetap terjaga dengan baik Pendekatan ini menunjukkan bahwa perbedaan keyakinan dapat disikapi secara terbuka dan saling menghormati. Selain itu, Damar tetap menunjukkan penghargaan kepada rekan kerja meskipun memiliki kebiasaan yang berbeda. Sikap ini mencerminkan nilai Harmonis dan Adaptif dalam BerAKHLAK. € (Poin 4) Damar tetap mempertahankan keyakinannya sekaligus memberikan penjelasan kepada rekan kerja mengenaialasan dibalik kebiasaan tersebut. Langkah ini membantu mengurangi kemungkinan munculnya salah persepsi terhadap dirinya. Namun, fokusnya masih lebih menekankan pada penjelasan mengenai keyakinan pribadi dibanding upaya menjaga kenyamanan interaksi sebagaimana pada opsi A E (Poin 3) Damar berusaha menyesuaikan diri dengan lingkungan kerja agar hubungan sosial dapat berjalan lebih lancar. Pendekatan ini menunjukkan kemampuan beradaptasi dalam lingkungan yang beragam. Namun, opsi ini mengharuskan Damar mengubah kebiasaan yang berkaitan dengan keyakinan pribadinya sehingga kurang mencerminkan keseimbangan antara penghormatan terhadap diri sendiri dan orang lain. D (Poin 2) Damar berupaya membangun pemahaman melalui bantuan rekan kerja lain yang lebih mengenalllingkungan tim. Langkah ini dapat membantu mengurangi kesalahpahaman yang muncul. Namun, penjelasan mengenai kebiasaan pribadi sebaiknya disampaikan langsung oleh Damar agar komunikasi berlangsung lebih jelas dan tidak menimbulkan interpretasi yang berbeda. B (Poin 1) Opsi ini paling tidak tepat karena Damar memilih menghindari situasi yang berpotensi menimbulkan kondisi serupa. Meskipun bertujuan mencegah kesalahpahaman, pendekatan inijustru dapat membatasi interaksi sosial yang diperlukan dalam lingkungan kerja yang beragam. Dibandingkan pilihan lain, opsi ini paling sedikit membantu membangun pemahaman dan hubungan kerja yang harmonis","source":"AyoCPNS"},{"n":91,"section":"TKP","topic":"Sosial Budaya","prompt":"Menjelang pelaksanaan kegiatan penting yang melibatkan banyak pihak, salah satu anggota tim, Bima, menyampaikan bahwa dirinya tidak dapat hadir secara langsung karena harus mengikuti rangkaian persiapan adat keluarga yang telah dijadwalkan jauh hari","options":["Menjelaskan kepada anggota tim bahwa Bima tetap menunjukkan tanggung jawabnya dengan bersedia membantu meskipun tidak dapat hadir secara langsung.","Meminta Bima untuk mengutamakan kegiatan tim mengingat agenda yang akan dilaksanakan memiliki tingkat urgensi yang tinggi.","Membantu mengoordinasikan pembagian tugas dengan memanfaatkan dukungan yang masih dapat diberikan Bima dari jarak jauh.","Menyarankan kepada tim agar mencari pengganti sementara untuk seluruh tugas Bima selama kegiatan berlangsung.","Mengingatkan anggota tim bahwa setiap orang memiliki tanggung jawab pribadi yang perlu dihormati sehingga ketidakhadiran Bima tidak perlu dipersoalkan."],"answer":"C","points":[4,1,5,3,2],"explanation":"C (Poin 5) Hal ini karena Danu berupaya menjaga kelancaran kegiatan tanpa mengabaikan kewajiban adat yang sedang dijalani Bima. Dengan mengoordinasikan pembagian tugas dan memanfaatkan bantuan yang masih dapat diberikan dari jarak jauh, kebutuhan tim tetap dapat terpenuhi secara optimal. Pendekatan ini menunjukkan penghormatan terhadap keberagaman budaya sekaligus menjaga komitmen terhadap pekerjaan. Selain menyelesaikan kebutuhan organisasi, langkah ini juga membantu menjaga hubungan baik antaranggota tim. Sikap ini mencerminkannilai Harmonis dan Kolaboratif dalam BerAKHLAK. AA (Poin 4) Danu berusaha meluruskan anggapan bahwa Bima tidak berkomitmen terhadap pekerjaan. Langkah ini membantu anggota tim memahami bahwa Bima tetap menunjukkan tanggung jawab melalui kontribusi yang dapat diberikan dari jarak jauh. Namun, pendekatan ini lebih berfokus pada persepsi anggota tim dan belum secara langsung membantu pelaksanaan pekerjaan yang sedang berlangsung D (Poin 3) Danu berusaha memastikan pekerjaan tetap berjalan dengan mencari alternatif pelaksana tugas selama Bima berhalangan hadir. Langkah ini cukup membantu dalam menjaga kelancaran kegiatan. Namun, opsi ini belum memanfaatkan kontribusi yang masih dapat diberikan oleh Bima sehingga kurang optimal dibandingkan opsi C. E (Poin 2) Danu menunjukkan penghormatan terhadap tanggung jawab pribadi dan budaya yang dimiliki Bima. Sikap ini membantu membangun lingkungan yang menghargai keberagaman. Namun, pendekatan tersebut belum memberikan solusi terhadap kebutuhan tim dan pekerjaan yang harus tetap diselesaikan. B (Poin 1) Opsi ini paling tidak tepat karena Danu langsung meminta Bima mengesampingkan agenda adat yang telah dijadwalkan jauh hari","source":"AyoCPNS"},{"n":92,"section":"TKP","topic":"Sosial Budaya","prompt":"Sebagai ketua tim pelaksana kegiatan lingkungan, Rendi menyadari bahwa dua kelompok warga di wilayahnya jarang berinteraksi karena sudah lama memiliki hubungan yang kurang harmonis. Akibatnya, koordinasi kegiatan sering berjalan kurang efektif karena masing-masing kelompok lebih memilih bekerja sendiri-sendiri. Sikap Rendi sebaiknya...","options":["Membagi tugas kegiatan secara seimbang kepada kedua kelompok agar seluruh warga tetap dapat berkontribusi sesuai perannya masing-masing.","Melibatkan perwakilan dari kedua kelompok dalam kepanitiaan inti sehingga mereka memiliki tanggung jawab bersama terhadap keberhasilan kegiatan.","Menugaskan kedua kelompok untuk mengerjakan bagian pekerjaan yang berbeda agar potensi gesekan dapat diminimalkan.","Menunjukkan sikap yang netral terhadap kedua kelompok dan berfokus pada penyelesaian target kegiatan yang telah ditetapkan.","Membentuk kelompok kerja yang beranggotakan warga dari kedua kelompok dalam beberapa tugas yang memiliki tujuan yang sama."],"answer":"E","points":[3,4,1,2,5],"explanation":"E (Poin 5) Hal ini karena Rendi berupaya mengurangi sekat yang ada dengan menciptakan kesempatan bagi kedua kelompok untuk bekerja bersama dalam tujuan yang sama. Interaksi yang terbangun melalui kerja sama nyata cenderung lebih efektif dalam menumbuhkan kepercayaan dibanding sekadar menghindari konflik. Selain membantu kelancaran kegiatan, pendekatan ini juga mendorong terbentuknya hubungan sosial yang lebih baik antarwarga secara alami. Dengan demikian, perbedaan yang selama ini menjadi penghalang dapat perlahan berkurang melalui pengalaman positif yang dirasakan bersama. Sikap ini mencerminkan nilai Harmonis dan Kolaboratif dalam BerAKHLAK B (Poin 4) Rendi memberikan tanggung jawab yang sama kepada perwakilan kedua kelompok dalam kepanitiaan inti. Langkah ini dapat menumbuhkan rasa memiliki terhadap kegiatan yang sedang dilaksanakan dan mendorong kerja sama yang lebih baik. Namun, keterlibatan hanya terbatas pada beberapa perwakilan sehingga dampaknya tidak seluas opsi E yang melibatkan lebih banyak warga secara langsung. AA (Poin 3) Rendi berusaha bersikap adil dengan memberikan kesempatan yang seimbang kepada kedua kelompok untuk berkontribusi Pendekatan ini membantu menjaga partisipasi seluruh warga dalam kegiatan yang dilaksanakan. Namun, masing-masing kelompok masih berpotensi bekerja secara terpisah sehingga hubungan sosial yang kurang harmonis belum banyak berubah. D (Poin 2) Rendi menunjukkan sikap netral dan tetap berfokus pada pencapaian tujuan kegiatan. Sikap tersebut penting untuk menjaga profesionalitas sebagai ketua tim. Namun, pendekatan ini belum memberikan upaya yang cukup untuk memperbaiki hubungan antarwarga yang menjadi salah satu penyebab kurang efektifnya koordinasi C (Poin 1) Opsi ini paling tidak tepat karena Rendi justru memisahkan kedua kelompok dalam pelaksanaan pekerjaan. Meskipun berpotensi mengurangi gesekan dalam jangka pendek, langkah ini tidak membantu memperbaiki hubungan yang kurang harmonis di antara mereka. Dibandingkan pilihan lain, opsi ini paling sedikit berkontribusi terhadap penguatan kohesi sosial di lingkungan masyarakat.","source":"AyoCPNS"},{"n":93,"section":"TKP","topic":"Sosial Budaya","prompt":"Saat bertugas di daerah baru, Arman mengetahui bahwa masyarakat setempat terbiasa mengawali kegiatan kemasyarakatan dengan tradisi lokal yang belum pernah ditemuinya","options":["Mengikuti tradisi tersebut sebagai bentuk penghormatan terhadap masyarakat setempat sambil mempelajari makna yang terkandung di dalamnya.","Menghormati pelaksanaan tradisi tersebut tanpa perlu terlibat secara langsung karena dirinya belum memahami maknanya secara utuh.","Menanyakan kepada tokoh masyarakat mengenai tujuan dan nilai yang terkandung dalam tradisi tersebut sebelum memutuskan keterlibatannya.","Menyesuaikan diri dengan kegiatan yang berlangsung selama tidak mengganggu pelaksanaan tugas yang menjadi tanggung jawabnya.","Mengikuti tradisi yang dilakukan masyarakat agar proses adaptasi dengan lingkungan sekitar dapat berlangsung lebih cepat."],"answer":"A","points":[5,1,2,3,4],"explanation":"A (Poin 5) Hal ini karena Arman tidak hanya menghormati tradisi yang berlaku, tetapi juga menunjukkan ketertarikan untuk memahami nilai dan makna yang terkandung di dalamnya. Sikap ini membantu membangun hubungan yang lebih baik dengan masyarakat sekaligus meningkatkan pemahaman terhadap budaya lokal. Dengan terlibat secara langsung, Arman dapat beradaptasi dengan lingkungan tanpa mengabaikan identitas maupun tugas yang dimilikinya. Pendekatan ini menunjukkan penghargaan terhadap keberagaman budaya yangada dimasyarakat. Sikap ini mencerminkan nilai Harmonis dan Adaptif dalam BerAKHLAK E (Poin 4) Arman menunjukkan keterbukaan dengan ikut berpartisipasi dalam tradisi yang berlaku di lingkungan masyarakat. Langkah ini dapat membantu mempercepat proses penerimaan dan adaptasi dirinya di daerah penugasan yang baru. Namun, fokus utamanya masih pada proses adaptasi diri dan belum menunjukkan upaya memahami nilai budaya yang mendasarinya. D (Poin 3) Arman berusaha menyesuaikan diri dengan lingkungan sekitar tanpa mengabaikan tugas dan tanggung jawab yang dimiliki. Pendekatan ini menunjukkan kemampuan beradaptasi yang cukup baik. Namun, keterlibatannya masih bersifat umum dan belum menunjukkan ketertarikan untuk memahami budaya lokal secara lebih mendalam. C (Poin 2) Arman berusaha mencari informasi mengenai tradisi yang ada melalui tokoh masyarakat setempat. Langkah ini menunjukkan rasa ingin tahu dan penghargaan terhadap budaya yang berbeda. Namun, pada kondisi soal tidak terdapat indikasi bahwa tradisi tersebut bermasalah atau bertentangan dengan aturan sehingga sikap yang lebih tepat adalah berpartisipasi dan belajar secara langsung. B (Poin 1) Opsi ini paling tidak tepat karena Arman memilih menjaga jarak dari tradisi yang berlangsung meskipun tidak terdapat hambatan untuk ikut berpartisipasi. Meskipun tetap menunjukkan rasa hormat, pendekatan ini membatasi kesempatan Arman untuk membangun kedekatan dan memahami budaya masyarakat setempat. Dibandingkan pilihan lain, opsi ini paling sedikit menunjukkan kemampuan adaptasi sosialbudaya.","source":"AyoCPNS"},{"n":94,"section":"TKP","topic":"Sosial Budaya","prompt":"Dalam sebuah kegiatan kantor, panitia lebih sering memberikan tugas lapangan kepada pegawai lain dan jarang melibatkan seorang rekan penyandang disabilitas. Alasannya, panitia khawatir tugas tersebut akan terlalu menyulitkan baginya. Padahal rekan tersebut belum pernah menyatakan keberatan dan memiliki kompetensi yang sesuai. Sikap Dimas sebaiknya...","options":["Memberikan kesempatan kepada rekan tersebut untuk menentukan sendiri bentuk tugas yang ingin diambil sesuai kemampuannya.","Mengusulkan agar pembagian tugas didasarkan pada kompetensi dan kebutuhan kegiatan tanpa membedakan kondisi fisik pegawai.","Membantu rekan tersebut ketika menghadapi tugas yang dianggap lebih menantang agar pekerjaannya tetap berjalan lancar.","Menjelaskan kepada panitia bahwa kekhawatiran yang mereka miliki belum tentu sesuai dengan kemampuan yang dimiliki rekan tersebut.","Mendorong panitia untuk melibatkan rekan tersebut dalam berbagai tugas yang relevan sehingga kemampuannya dapat dinilai secara objektif."],"answer":"E","points":[3,4,1,2,5],"explanation":"E (Poin 5) Hal ini karena Dimas mendorong terciptanya kesempatan yang setara bagi rekan penyandang disabilitas untuk menunjukkan kemampuan yang dimilikinya. Pendekatan ini membantu menghilangkan penilaian yang didasarkan pada asumsi dan menggantinya dengan penilaian berdasarkan kinerja yang nyata. Selain menghargai kompetensi individu, langkah ini juga menciptakan lingkungan kerja yang lebih inklusif. Dengan keterlibatan yang setara, setiap pegawai memiliki kesempatan yang sama untuk berkontribusi sesuai kapasitasnya. Sikap ini mencerminkan nilai Harmonis dan Kolaboratif dalam BerAKHLAK. B (Poin 4) Hal ini karena Dimas berusaha mendorong pembagian tugas yang objektif berdasarkan kompetensi dan kebutuhan pekerjaan. Pendekatan ini membantu mengurangi perlakuan yang berbeda akibat asumsi terhadap kondisi fisik seseorang. Namun, langkahini masih berfokus pada prinsip umum dan belum secara langsung membuka kesempatannyata seperti pada opsi £ AA (Poin 3) Hal ini karena Dimas menghormati hak rekan tersebut untuk menentukan bentuk kontribusi yang ingin diberikan. Langkah ini menunjukkan penghargaan terhadap kemandirian dan kemampuan individu. Namun, pendekatan ini belum menyentuh akar masalah berupa kecenderungan panitia yang membatasi kesempatan berdasarkan asumsi tertentu D (Poin 2) Hal ini karena Dimas berusaha meluruskan persepsi panitia mengenai kemampuan rekan penyandang disabilitas. Langkah ini dapat membantu mengurangi prasangka yang muncul dalam pembagian tugas. Namun, pendekatan ini masih sebatas penyampaian pendapat dan belum mendorong perubahan yanglebih nyata. € (Poin1) Opsi ini paling tidak tepat karena Dimas langsung berfokus pada pemberian bantuan sebelum diketahui apakah bantuan tersebut memang diperlukan. Meskipun niatnya baik, pendekatan ini dapat memperkuat anggapan bahwa rekan tersebut selalu membutuhkan bantuan khusus. Dibandingkan pilihan lain, opsi ini paling sedikit mendukung kesetaraan kesempatan dalam lingkungan kerja.","source":"AyoCPNS"},{"n":95,"section":"TKP","topic":"Sosial Budaya","prompt":"Dalam grup WhatsApp lingkungan tempat tinggalnya, Aldi melihat beberapa warga mulai membagikan informasi mengenai pendatang baru yang belum jelas kebenarannya. Akibatnya, sebagian warga mulai memberikan penilaian negatif meskipun belum pernah berinteraksi langsung dengan orang tersebut. Sikap Aldi sebaiknya...","options":["Mengingatkan warga agar tidak terburu-buru memberikan penilaian terhadap seseorang berdasarkan informasi yang belum terverifikasi.","Tetap memperlakukan pendatang tersebut sebagaimana warga lainnya sambil membangun interaksi secara langsung ketika ada kesempatan.","Menunggu informasi yang lebih jelas mengenai pendatang tersebut sebelum membentuk pendapat pribadi mengenai dirinya.","Menyampaikan kepada warga bahwa setiap orang berhak memperoleh kesempatan yang sama untuk diterima di lingkungan baru.","Memberikan contoh kepada warga dengan melibatkan pendatang tersebut dalam kegiatan lingkungan yang diikutinya."],"answer":"E","points":[3,4,1,2,5],"explanation":"E (Poin 5) Hal ini karena Aldi tidak hanya menghindari prasangka terhadap pendatang baru, tetapi juga mengambil langkah nyata untuk membantu proses penerimaan sosial di lingkungan tempat tinggalnya. Dengan melibatkan pendatang tersebut dalam kegiatan lingkungan, Aldi menciptakan kesempatan bagi warga untuk saling mengenal secara langsung dan membentuk penilaian berdasarkan interaksi yang nyata. Pendekatan ini membantu mengurangi pengaruh informasi yang belum jelas kebenarannya sekaligus memperkuat hubungan sosial antarwarga. Selain bersikap objektif, Aldijuga berkontribusi membangun lingkungan yang inklusif dan harmonis. Sikap ini mencerminkan nilai Harmonis dan Kolaboratif dalam BerAKHLAK. B (Poin 4) Hal ini karena Aldi memilih menilai pendatang tersebut berdasarkan interaksi dan pengalaman langsung, bukan berdasarkan informasi yang belum terverifikasi. Pendekatan ini menunjukkan sikap objektif dan menghindari prasangka terhadap orang lain. Namun tindakan yang dilakukan masih berfokus pada sikap pribadi Aldi dan belum memberikan dampak sosial yang lebih luas sebagaimana pada opsiE. A (Poin 3) Hal ini karena Aldi berusaha mengingatkan warga agar tidak terburu-buru memberikan penilaian terhadap seseorang. Langkah ini dapat membantu mengurangi penyebaran prasangka yang berkembang di lingkungan masyarakat. Namun, pendekatan tersebut masih berupa penyampaian pendapat dan belum secara langsung membantu proses penerimaan pendatang baru di lingkungan tersebut D (Poin 2) Hal ini karena Aldi menegaskan pentingnya memberikan kesempatan yang sama kepada setiap orang untuk diterima dalam lingkungan sosial yang baru. Pernyataan tersebut menunjukkan penghargaan terhadap keberagaman dan keadilan sosial. Namun, langkahini masih bersifat normatif dan belum diwujudkan melalui tindakan yang konkret. C (Poin 1) Opsi ini paling tidak tepat karena Aldi hanya berfokus menjaga objektivitas dirinya sendiri dengan menunggu informasi yang lebih jelas. Meskipun tidak ikut menyebarkan prasangka merupakan sikap yang baik, pendekatan ini tidak membantu mengurangi penilaian negatif yang sudah berkembang di lingkungan sekitar. Dibandingkan pilihan lain, kontribusinya paling kecil dalam membangun hubungan sosial yang harmonis dan inklusif.","source":"AyoCPNS"},{"n":96,"section":"TKP","topic":"Sosial Budaya","prompt":"Dalam kegiatan musyawarah warga, Hendra memperhatikan bahwa sebagian besar peserta lebih sering meminta pendapat seorang pengusaha sukses daripada warga lainnya. Akibatnya, beberapa warga yang sebenarnya memiliki gagasan yang baik menjadi jarang menyampaikan pendapat karena merasa suaranya kurang diperhatikan. Sikap Hendra sebaiknya...","options":["Tetap mempertimbangkan setiap usulan berdasarkan manfaatnya tanpa memandang latar belakang orang yang menyampaikannya.","Memberikan perhatian yang sama terhadap setiap pendapat yang disampaikan selama pembahasan berlangsung.","Mendorong warga yang jarang menyampaikan pendapat untuk ikut memberikan pandangan ketika ada kesempatan.","Mengingatkan peserta musyawarah bahwa setiap warga memiliki pengalaman yang dapat menjadi bahan pertimbangan dalam pengambilan keputusan bersama.","Mencoba mengajak warga yang jarang didengar agar berbagai sudut pandang dapat ikut dipertimbangkan dalam pembahasan."],"answer":"C","points":[3,4,5,2,1],"explanation":"C (Poin 5) Hal ini karena Hendra mengambil tindakan yang secara langsung mendorong warga yang selama ini pasif untuk ikut menyampaikan pandangannya. Langkah ini membantu mengurangi dominasi pendapat dari kelompok tertentu dan membuka ruang bagi munculnya gagasan yang beragam. Dengan meningkatnya partisipasi warga, keputusan yang dihasilkanjuga berpotensi menjadi lebih representatif dan mempertimbangkan lebih banyak sudut pandang. Pendekatan ini tidak hanya menghargai setiap individu, tetapi juga memperkuat keterlibatan masyarakat dalam proses musyawarah. Sikap ini mencerminkan nilai Harmonis dan Kolaboratif dalam BerAKHLAK. B (Poin 4) Hal ini karena Hendra berusaha menunjukkan penghargaan yang sama terhadap setiap pendapat yang disampaikan selama musyawarah berlangsung. Sikap ini membantu menciptakan suasana yang lebih terbuka dan menghargai keberagaman pandangan. Namun tindakan tersebut masih lebih berfokus pada perilaku pribadi Hendra dan belum secara aktif mendorong warga lain untuk berpartisipasi AA (Poin 3) Hal ini karena Hendra tetap berusaha bersikap objektif dengan menilai setiap usulan berdasarkan manfaatnya, bukan berdasarkan status sosial orang yang menyampaikannya. Sikap ini penting untuk menjaga keadilan dalam proses pengambilan keputusan. Namun, pendekatan ini hanya memengaruhi cara pandang Hendra sendiri dan belum membantu warga yang mulai enggan menyampaikan pendapat. D (Poin 2) Hal ini karena Hendra berusaha mengingatkan peserta musyawarah bahwa setiap warga memiliki pengalaman dan perspektif yang dapat menjadi bahan pertimbangan bersama. Langkah ini dapat meningkatkan kesadaran mengenai pentingnya menghargai setiap pendapat. Namun, pendekatan tersebut masih berupa imbauan dan belum memberikan tindakan yang secara langsung meningkatkan partisipasi warga E (Poin 1) Opsiini paling tidak tepat karena Hendra hanya mencoba mengajak warga yang jarang didengar tanpa menunjukkan tindakan yang lebih jelas dan terarah. Dibandingkan pilihan lain, pendekatan ini masih bersifat umum dan belum tentu menghasilkan keterlibatan yang nyata dalam musyawarah. Kontribusinya paling kecil dalam mengatasi masalah rendahnya partisipasi warga yang sebenarnya menjadi inti persoalan,","source":"AyoCPNS"},{"n":97,"section":"TKP","topic":"Teknologi Informasi dan Komunikasi","prompt":"Rusdi dikenal sebagai salah satu pegawai yang paling memahami aplikasi pengelolaan kinerja yang baru diterapkan di instansinya. Beberapa hari setelah peluncuran, banyak rekan kerja meminta bantuan kepadanya karena masih mengalami kesulitan menggunakan fitur-fitur tertentu. Namun, pada saat yang sama Rusdi sedang menyelesaikan pekerjaan prioritas dengan tenggat yang cukup ketat. Sikap Rusdi adalah...","options":["Menyusun panduan singkat atau media pembelajaran yang dapat diakses rekan kerja sehingga kebutuhan bantuan tetap dapat terlayani secara lebih efisien.","Meluangkan waktu membantu rekan kerja satu per satu di sela-sela pekerjaan agar seluruh pertanyaan dapat dijawab secara langsung.","Mengumpulkan pertanyaan yang paling sering muncul kemudian menyusun daftar solusi yang dapat dibagikan kepada seluruh pengguna aplikasi.","Memanfaatkan fitur forum diskusi atau kanal kolaborasi internal agar rekan kerja dapat saling berbagi solusi dan pengalaman penggunaan aplikasi.","Mengusulkan sesi diskusi bersama pada waktu tertentu agar seluruh pertanyaan dapat dibahas secara bersamaan."],"answer":"A","points":[5,1,4,3,2],"explanation":"A (5 poin) Hal ini karena Rusdi tidak hanya menyelesaikan kebutuhan bantuan saat ini, tetapi juga menciptakan solusi yang dapat dimanfaatkan oleh banyak rekan kerja secara berulang. Panduan atau media pembelajaran yang disusun dapat diakses kapan saja sehingga proses adaptasi terhadap aplikasi baru menjadi lebih cepat dan tidak bergantung pada kehadiran satu orang. Sikap ini mencerminkannilai BerAKHLAK, yaitu Adaptif karena mendukung transformasi digital melalui pemanfaatan teknologi pembelajaran dan Kolaboratif karena membanturekan kerja memperoleh pemahaman yang sama. Selain itu, solusi ini tetap memungkinkan Rusdi menyelesaikan pekerjaan prioritasnya tanpa mengabaikan kebutuhan organisasi. C (4 poin) Opsi ini menunjukkan kemampuan mengidentifikasi masalah yang paling sering dihadapi pengguna dan menyusun solusi yang dapat digunakan secara luas. Langkah tersebut juga membantu mengurangi pertanyaan yang berulang kepada Rusdi. Namun, terdapat celah yang membuatnya berada di bawah opsi A, yaitu cakupaninformasi yang diberikan umumnya terbatas pada permasalahan yang telah muncul dan belum tentu membantu pengguna memahami aplikasi secara menyeluruh. D (3 poin) Opsi ini menunjukkan pemanfaatan teknologi kolaboratif untuk membangun budaya saling berbagi pengetahuan di lingkungan kerja. Rekan kerja dapat saling membantu tanpa harus selalu bergantung pada Rusdi. Akan tetapi, kualitas informasi yang beredar belum tentu konsisten sehingga tetap diperlukan sumberrujukan yang lebih terstruktur. E (2 poin) Opsi ini menunjukkan upaya mengelola kebutuhan bantuan secara lebih efisien dibanding menjawab pertanyaan satuper satu Diskusi bersama juga memungkinkan beberapa kendala dibahas dalam waktu yang sama. Namun, solusi ini masih bergantung pada ketersediaan waktu tertentu dan tidak dapat diakses kembali dengan mudah oleh pengguna yang membutuhkan di kemudian hari B (1 poin) Opsiini menunjukkan kepedulian dan kemauan membantu rekan kerja secara langsung. Namun, cara tersebut kurang efisien ketika jumlah pengguna yang membutuhkan bantuan cukup banyak dan Rusdi sedang menghadapi pekerjaan dengan prioritas tinggi.","source":"AyoCPNS"},{"n":98,"section":"TKP","topic":"Teknologi Informasi dan Komunikasi","prompt":"Instansi Anda baru menerapkan dashboard kinerja yang menampilkan capaian pekerjaan setiap bidang secara real-time. Suatu hari, Anda melihat capaian bidang Anda pada dashboard jauh lebih rendah dibanding laporan yang selama ini digunakan tim. Beberapa rekan mulai mempertanyakan kinerja bidang tersebut berdasarkan data yang tampil. Sikap Anda adalah...","options":["Membandingkan sumber data dashboard dengan laporan yang digunakan tim untuk mengidentifikasi penyebab perbedaan informasi tersebut","Tetap menggunakan laporan yang selalu digunakan karena telah menjadi acuan kerja bidang selama ini sambil tetap memperhatikan data pada sistem.","Menyampaikan kepada rekan kerja bahwa data dashboard kemungkinan belum diperbarui sehingga tidak perlu terlalu dipermasalahkan.","Mengumpulkan data pendukung dari berbagai sumber sebelum memberikan tanggapan mengenai capaian yang ditampilkan.","Menghubungi tim IT sambil memberikan data manual yang sudah direkap sambil melakukan pemeriksaan lebih lanjut terhadap perbedaan data yang muncul."],"answer":"E","points":[4,2,1,3,5],"explanation":"E (5 poin) Hal ini karena E menunjukkan pendekatan yang paling komprehensif dalam menyikapi perbedaan data. Anda tidak hanya melakukan verifikasi terhadap data manual yang dimiliki, tetapi juga melibatkan pihak yang memahami sistem untuk membantu menelusuri kemungkinan perbedaan sumber data, proses sinkronisasi, atau kesalahan teknis yang terjadi. Sikap ini mencerminkan nilai BerAKHLAK, yaitu Kompeten karena mengedepankan analisis berbasis data dan Kolaboratif karena melibatkan pihak yang memiliki kewenangan serta kompetensi yang relevan. Selain itu, langkah ini membantu memastikan bahwa keputusan yang diambil didasarkan pada data yang akurat, bukan asumsi mengenai pihak mana yang benar atau salah. AA(4 poin) Opsi ini menunjukkan kemampuan berpikir analitis dengan membandingkan sumber data yang berbeda sebelum menarik kesimpulan. Langkah tersebut dapat membantu menemukan penyebab terjadinya selisih capaian yang muncul. Namun, terdapat celah yang membuatnya berada di bawah opsi E, yaitu proses verifikasi masih dilakukan secara internal tanpa melibatkan pihak yang memahami mekanisme teknis dashboard secara lebih mendalam. D (3 poin) Opsi ini menunjukkan kehati-hatian dengan mengumpulkan berbagai informasi pendukung sebelum memberikan tanggapan Sikap tersebut membantu menghindari kesimpulan yang terburu-buru terhadap data yang ditampilkan. Akan tetapi, arah verifikasi masih cukup umum dan belum secara spesifik menyentuh sumber perbedaan antara data dashboard dan laporan kerja B (2 poin) Opsi ini menunjukkan penghargaan terhadap laporan yang selamaini digunakan sebagai acuan kerja. Namun, langsung memberikan bobot lebih besar pada laporan lama berpotensi menghambat proses evaluasi terhadap sistem baru yang sedang diterapkan C (Tpoin) Opsi ini merupakan pilihan yang paling kurang tepat karena langsung mengasumsikan bahwa dashboard belum diperbarui tanpa melakukan pemeriksaan terhadap data yang tersedia. Dalam lingkungan kerja berbasis data, asumsi tanpa verifikasi berisiko menimbulkan kesimpulan yang tidak akurat.","source":"AyoCPNS"},{"n":99,"section":"TKP","topic":"Teknologi Informasi dan Komunikasi","prompt":"Saat menggunakan aplikasi perkantoran baru, Anda menemukan fitur otomatis yang dapat menyelesaikan pekerjaan lebih cepat. Namun, fitur tersebut belum pernah digunakan pada jenis data yang dikelola unit kerja Anda. Sikap Anda adalah...","options":["Menggunakan fitur tersebut pada pekerjaan yang memiliki risiko kesalahan paling rendah sambil memantau hasil yang dihasilkan.","Mendiskusikan potensi pemanfaatan fitur tersebut dengan rekan kerja yang sering menggunakan data serupa sebelum diterapkan lebih luas.","Mengumpulkan informasi mengenai pengalaman pengguna lain terhadap fitur tersebut sebagai bahan pertimbangan penggunaan.","Menguji fitur tersebut pada sebagian data yang representatif kemudian membandingkan hasilnya dengan metode yang selama ini digunakan.","Tetap menggunakan metode yang selama ini digunakan sampai tersedia pedoman resmi mengenai pemanfaatan fitur tersebut."],"answer":"D","points":[4,3,2,5,1],"explanation":"D (5 poin) Hal ini karena D menunjukkan keseimbangan terbaik antara inovasi dan kehati-hatian dalam pemanfaatan teknologi baru. Dengan menguji fitur pada sebagian data yang representatif dan membandingkannya dengan metode yang selama ini digunakan, Anda dapat menilai akurasi, konsistensi, serta dampak fitur tersebut sebelum diterapkan secara lebih luas. Sikap ini mencerminkannilai BerAKHLAK, yaitu Adaptif karenaterbuka terhadap pemanfaatan teknologi baru dan Kompeten karena melakukanvalidasi terlebih dahulu sebelum mengambil keputusan. Selain itu, langkah ini menghasilkan bukti nyata mengenai efektivitas fitur sehingga keputusan yang diambil tidak hanya berdasarkan asumsi atau pengalaman pihak lain. AA(4 poin) Opsi ini menunjukkan keberanian mencoba inovasi dengan tetap mempertimbangkan risiko yang mungkin timbul. Penggunaan pada pekerjaan yang berisiko rendah juga dapat meminimalkan dampak apabila terjadi kesalahan, Namun, terdapat celah yang membuatnya berada di bawah opsi D. yaitu belum adanya proses pembandingan yang sistematis dengan metode yang selamaini digunakan. B (3 poin) Opsi ini menunjukkan semangat kolaborasi dan pemanfaatan pengalaman rekan kerja sebelum menerapkan teknologi baru. Diskusi tersebut dapat membantu mengidentifikasi manfaat maupun potensi kendala yang mungkin muncul. Akan tetapi, keputusan masih banyak bergantung pada pendapat pengguna lain dan belum didukung pengujian langsung terhadap data yang dikelola unit kerja sendiri C (2 poin) Opsiini menunjukkan inisiatif untuk mencari referensi dan pengalaman pengguna lain sebagai bahan pertimbangan. Informasi tersebut dapat membantu memahamikkarakteristik fituryang akan digunakan. Namun, pengalaman pihak lain belum tentu sepenuhnya sesuai dengan kebutuhan dan kondisi data pada unit kerja Anda. E (1 poin) Opsi ini merupakan pilihan yang paling kurang tepat karena terlalu menunggu kepastian formal meskipun terdapat kesempatan untuk melakukan pengujian secara terukur dan aman. Sikap tersebut berpotensi menghambat pemanfaatan inovasi yang sebenarnya dapat membantu meningkatkan efektivitas pekerjaan.","source":"AyoCPNS"},{"n":100,"section":"TKP","topic":"Teknologi Informasi dan Komunikasi","prompt":"Sistem pelayanan digital pada unit Anda tiba-tiba tidak dapat diakses saat jumlah pemohon sedang tinggi. Pada hari yang sama, seluruh tim TIK instansi sedang mengikuti kegiatan pemeliharaan jaringan di lokasi lain. Sikap Anda adalah...","options":["Menggunakan mekanisme pelayanan manual yang masih sesuai prosedur sambil mendokumentasikan data untuk diinput kembali ke sistem setelah layanan pulih.","Mencoba melakukan konfigurasi ulang pada perangkat pelayanan berdasarkan pengalaman penggunaan sistem","Meminta bantuan rekan kerja yang memiliki kemampuan teknologi informasi lebih baik untuk melakukan pemeriksaan terhadap sistem yang mengalami gangguan.","Menghubungi penyedia layanan teknologi eksternal yang pernah bekerja sama dengan instansi agar gangguan dapat segera diatasi.","Melaporkan kejadian hari ini pada tim IT dan meminta saran serta masukan instan yang dapat dilakukan dengan panduan dari mereka."],"answer":"A","points":[5,1,3,2,4],"explanation":"A (5 poin) Hal ini karena A mampu menjaga keberlangsungan pelayanan kepada masyarakat tanpa menunggu sistem pulih terlebih dahulu. Penggunaan mekanisme pelayanan manual yang memang telah disiapkan sebagai alternatif saat terjadi gangguan menunjukkan pemahaman bahwa teknologi merupakan alat bantu pelayanan, bukan satu-satunya cara memberikan layanan. Sikap ini mencerminkan nilai BerAKHLAK, yaitu Berorientasi Pelayanan karena memastikan masyarakat tetap memperoleh layanan dan Adaptif karena mampu menyesuaikan proses kerja ketika terjadi gangguan teknologi. Selain itu, dokumentasi data untuk diinput kembali setelah sistem pulih membantu menjaga akurasi dankesinambungan data layanan. E (4 poin) Opsi ini menunjukkan pemanfaatan sumber daya TIK yang masih tersedia dengan tetap berkoordinasi kepada tim yang berwenang Arahan dari tim TIK juga dapat membantu mencegah kesalahan penanganan yang berpotensi memperburuk gangguan sistem. Namun, terdapat celah yang membuatnya berada dibawah opsi A, yaitu fokus utama masih pada upaya memperoleh solusi teknis sementara kebutuhan pelayanan masyarakat yang sedang berlangsung belum langsung terakomodasi. €(3 poin) Opsi ini menunjukkan inisiatif memanfaatkan kompetensi rekan kerja yang memiliki pemahaman teknologi lebih baik. Langkah tersebut dapat membantu memperoleh gambaran awal mengenai gangguan yang terjadi. Akan tetapi, rekan kerja tersebut belum tentu memiliki kewenangan maupun akses yang cukup untuk melakukan penanganan terhadap sistem yang bermasalah. D (2 poin) Opsi ini menunjukkan keinginan mempercepat penyelesaian gangguan melalui pihak yang memiliki kompetensi teknis. Namun, sebagai pegawai biasa, menghubungi penyedia layanan eksternal secara langsung berpotensi melampaui mekanisme koordinasi dan kewenangan yang berlaku di instansi. B (1 poin) Opsiini merupakan pilihan yang paling kurang tepat karena mencoba melakukan konfigurasi ulang sistem berdasarkan pengalaman pribadi tanpa mengetahui penyebab pasti gangguan yang terjadi. Selain berisiko memperparah masalah, tindakan tersebut juga berada di luar kapasitas dan kewenangan pegawai yang bukan bagian dari tim TIK.","source":"AyoCPNS"},{"n":101,"section":"TKP","topic":"Teknologi Informasi dan Komunikasi","prompt":"Anda sedang mengolah data yang akan digunakan pimpinan dalam rapat penting siang ini. Saat proses hampir selesai, laptop kantor yang digunakan tiba-tiba mengalami gangguan dan tidak dapat menjalankan aplikasi pengolahan data sebagaimana mestinya. Sikap Anda adalah...","options":["Melanjutkan pekerjaan Anda menggunakan gadget pribadi dengan memanfaatkan data yang telah tersimpan sambil melaporkan gangguan perangkat.","Menghubungi tim TIK untuk meminta arahan penanganan sambil mendokumentasikan pesan kesalahan yang muncul pada perangkat.","Meminta rekan kerja yang memiliki perangkat serupa membantu membuka dan memeriksa file yang sedang dikerjakan.","Mencoba berbagai langkah perbaikan berdasarkan pengalaman pribadi agar pekerjaan dapat segera diselesaikan tanpa menunggu bantuan pihak lain.","Menyusun ulang data yang paling dibutuhkan secara manual menggunakan perangkat atau aplikasi lain yang masih dapat digunakan."],"answer":"C","points":[2,4,5,1,3],"explanation":"C (5 poin) Hal ini karena C menunjukkan kemampuan menjaga keberlangsungan pekerjaan dengan memanfaatkan sumber daya yang tersedia di lingkungan kerja tanpa mengabaikan keamanan data dan tata kelola teknologi informasi. Meminta bantuan rekan kerja yang memiliki perangkat serupa memungkinkan file tetap dapat diakses dan pekerjaan dapat dilanjutkan untuk memenuhi kebutuhan pimpinan yang bersifat mendesak. Sikap ini mencerminkan nilai BerAKHLAK, yaitu Kolaboratif karena melibatkan rekan kerja dalam penyelesaian masalah dan Adaptif karena mampu mencari alternatif yang tetap berada dalam lingkungan kerja yang terkontrol. Selain itu, solusi ini menjaga keseimbangan antara produktivitas, keamanan data, dan kepatuhan terhadap penggunaan sarana kerja resmi. B (4 poin) Opsi ini menunjukkan pemanfaatan jalur yang tepat dengan melibatkan tim TIK dan mendokumentasikaninformasiyang dapat membantu proses penanganan gangguan. Langkah tersebut juga mengurangi risiko terjadinya kesalahan akibat tindakan yang tidak sesuai prosedur. Namun, terdapat celah yang membuatnya berada di bawah opsi C, yaitu fokus utamanya masih pada penanganan gangguan perangkat sementara kebutuhan penyelesaian pekerjaan yang mendesak belum langsung teratasi. E (3 poin) Opsi ini menunjukkan upaya menjaga pekerjaan tetap berjalan meskipun perangkat utama mengalami gangguan. Langkah tersebut dapat membantu memastikan informasi penting tetap tersedia untuk kebutuhan rapat. Akan tetapi, proses penyusunan ulang data berpotensi memerlukan waktu tambahan dan meningkatkan risiko kesalahan dibanding memanfaatkan data yang sudah tersedia. AA(2 poin) Opsi ini menunjukkan orientasi pada penyelesaian pekerjaan dan pemanfaatan teknologi yang tersedia. Namun, penggunaan gadget pribadi untuk mengolah data pekerjaan berpotensi menimbulkanrisiko keamanan informasi, terutama apabila data yang digunakan merupakan data kedinasan yang seharusnya dikelola melalui perangkat kerja resmi. D (Ipoin) Opsiini merupakan pilihan yang paling kurang tepat karena mencoba melakukan perbaikan berdasarkan pengalaman pribadi tanpa mengetahui penyebab gangguan yang sebenarnya. Selain berpotensi memperparah kondisi perangkat, tindakan tersebut dapat menghabiskan waktu yang seharusnya digunakan untuk memastikan pekerjaan prioritas tetap dapat diselesaikan","source":"AyoCPNS"},{"n":102,"section":"TKP","topic":"Teknologi Informasi dan Komunikasi","prompt":"Beberapa menit sebelum rapat pimpinan dimulai, Anda perlu memperbarui file presentasi yang tersimpan di laptop kantor. Namun, laptop tersebut tiba-tiba tidak dapat dinyalakan, sementara file belum tersimpan pada penyimpanan bersama dan perangkat dilindungi kata sandi. Sikap Anda adalah...","options":["Meminta bantuan rekan kerja yang ada di kantor untuk mencoba mengakses file menggunakan akun miliknya agar pekerjaan dapat segera diselesaikan.","Menghubungi tim TIK untuk memperoleh arahan terkait akses file dan alternatif penyelesaian pekerjaan yang masih memungkinkan dilakukan.","Menyusun kembali bagian materi yang paling penting menggunakan data dan dokumen pendukung yang masih tersedia pada perangkat lain.","Menggunakan akun penyimpanan pribadi untuk mencari versi file lebih lama yang mungkin pernah dicadangkan","Menggunakan bahan presentasi seadanya yang tersedia karena perubahan yang akan dilakukan belum tentu bersifat krusial."],"answer":"B","points":[1,5,4,2,3],"explanation":"B (5 poin) Hal ini karena B menunjukkan keseimbangan terbaik antara penyelesaian pekerjaan yang mendesak dan tata kelola teknologi informasi yang benar. Dengan menghubungi tim TIK, Anda memperoleh arahan yang sesuai terkait akses file maupun penanganan perangkat yang bermasalah, sekaligus membuka peluang untuk menemukan alternatif penyelesaian pekerjaan yang tetap aman dan dapat dipertanggung jawabkan. Sikap ini mencerminkan nilai BerAKHLAK, yaitu Kompeten karena memanfaatkan pihak yang memiliki kewenangan dan keahlian yang relevan serta Akuntabel karena menjaga keamanan akses terhadap data dan perangkat kantor. Selain itu, langkah ini menghindari tindakan yang berpotensi melanggarkeamanan informasi hanya demi mengejar kecepatan penyelesaian pekerjaan. C (4 poin) Opsiini menunjukkan kemampuan beradaptasi dan menjaga keberlangsungan pekerjaan ketika terjadi kendala teknologi. Menyusun kembali materi dari data yang masih tersedia juga membantu memastikan rapat tetap dapat berjalan. Namun, terdapat celah yang membuatnya berada di bawah opsi B. yaitu belum ada upaya untuk memperoleh solusi terhadap file utama yang masih tersimpan pada perangkat yang bermasalah. E (3 poin) Opsi ini menunjukkan kemampuan menentukan prioritas dengan tetap memastikan rapat dapat berlangsung menggunakan materi yang tersedia. Dalam kondisi tertentu, pendekatan ini dapat menjadi solusi sementara yang cukup efektif. Akan tetapi, keputusan bahwa perubahan tersebut tidak krusial masih bersifat asumsi dan belum didasarkan pada informasi yang memadai D (2 poin) Opsiini menunjukkan inisiatif mencari alternatif sumber data agar pekerjaan tetap dapat diselesaikan. Namun, penggunaanakun penyimpanan pribadi untuk mengakses atau mengelola dokumen kedinasan berpotensi menimbulkan risiko keamanan dan tata kelola informasi. A(Tpoin) Opsi ini merupakan pilihan yang paling kurang tepat karena mencoba mengakses perangkat menggunakan akun milik oranglain berpotensi melanggar prinsip keamanan informasi dan pengelolaan akses. Meskipun bertujuan mempercepat pekerjaan, tindakan tersebut tidak menjamin fle dapat diakses dan dapat menimbulkan masalah baru terkait akuntabilitas penggunaan akun","source":"AyoCPNS"},{"n":103,"section":"TKP","topic":"Teknologi Informasi dan Komunikasi","prompt":"Di grup keluarga, beredar pesan berantai yang mengatasnamakan instansi pemerintah dan menyebutkan bahwa masyarakat harus segera melakukan pembaruan data melalui tautan tertentu agar bantuan sosial tidak dihentikan. Beberapa anggota keluarga mulai meminta pendapat Anda karena dianggap lebih memahami teknologi. Sikap Anda adalah...","options":["Memeriksa kesesuaian informasi tersebut dengan kanal resmi instansi yang disebutkan sebelum memberikan penjelasan kepada anggota keluarga.","Mengingatkan anggota keluarga agar tidak terburu-buru mengakses tautan tersebut sampai terdapat kepastian mengenai kebenaran informasi yang beredar.","Menelusuri pemberitaan dan informasi dari berbagai sumber digital untuk memperoleh gambaran yang lebih lengkap mengenai informasi tersebut.","Menyarankan anggota keluarga menunggu pengumuman resmi berikutnya sebelum mengambil tindakan apa pun terkait informasi tersebut.","Menyimpan pesan tersebut terlebih dahulu sebagai bahan pembanding apabila informasi serupa muncul kembali di kemudian hari."],"answer":"A","points":[5,4,3,2,1],"explanation":"A (5 poin) Hal ini karena Amenunjukkan kemampuan literasi digital yang paling tepat. yaitu melakukanverifikasi langsung kepada sumber yang memiliki otoritas terhadap informasi yang beredar. Dalam era digital, informasi yang terlihat resmi belum tentu benar sehingga perlu dikonfirmasi melalui kanal resmi sebelum dijadikan dasar pengambilan keputusan. Sikap ini mencerminkan nilai BerAKHLAK, yaitu Kompeten karena mampu mengevaluasi kredibilitas informasi dan Akuntabel karena tidak memberikan saran berdasarkan informasi yang belum terbukti kebenarannya. Selain itu, langkah ini memungkinkan Anda memberikan penjelasan yang lebih akurat kepada anggota keluarga yang meminta pendapat. B (4 poin) Opsi ini menunjukkan kehati-hatian dengan mencegah anggota Keluarga mengambil tindakan tergesa-gesa terhadap informasi yang belum terverifikasi. Langkah tersebut juga dapat membantu mengurangi risiko penyalahgunaan data pribadi melalui tautan yang tidak jelas. Namun, terdapat celah yang membuatnya berada di bawah opsi A, yaitu belum ada upaya langsung untuk memastikan kebenaran informasi tersebut. C (3 poin) Opsi ini menunjukkan inisiatif untuk mencari informasi tambahan dari berbagai sumber digital. Cara tersebut dapat membantu memperoleh gambaran yang lebih luas mengenai isu yang sedang beredar. Akan tetapi, sumber-sumber tersebut belum tentu memiliki tingkat kredibilitas yang sama dengan kanal resmiinstansi yang disebutkan dalam pesan. D (2 poin) Opsi ini menunjukkan sikap hati-hati dengan tidak mendorong anggota keluarga mengambil tindakan berdasarkan informasi yang belum jelas. Namun, pendekatan ini cenderung pasif karena hanya menunggu informasi berikutnya tanpa melakukan upaya verifikasi terhadap informasi yang sedang beredar. E (1 poin) Opsiini merupakan pilihan yang paling kurang tepat karena tidak memberikan solusi terhadap kebutuhan anggota keluarga yang sedang meminta penjelasan mengenai informasi tersebut. Menyimpan pesan hanya bermanfaat sebagai dokumentasi, tetapi tidak membantu memastikan apakah informasi tersebut benar atau tidak.","source":"AyoCPNS"},{"n":104,"section":"TKP","topic":"Anti Radikalisme","prompt":"Adnan menyadari anaknya yang duduk di bangku SMA mulai sering menyatakan bahwa Indonesia tidak memiliki masa depan dan tidak layak diperjuangkan. Setelah berdiskusi, ia mengetahui bahwa pandangan tersebut sering disampaikan oleh salah satu gurunya dan mulai dipercaya oleh beberapa siswa lain. Sikap Adnan sebaiknya...","options":["Mengajak anak berdiskusi mengenai berbagai tantangan dan peluang yang dimiliki Indonesia agar memperoleh sudut pandang yang lebih utuh.","Mendorong anak untuk menguji setiap pandangan berdasarkan fakta dan sumber yang dapat dipertanggung jawabkan sebelum mempercayai dan mengungkapkannya.","Berkomunikasi dengan pihak sekolah untuk memperoleh penjelasan mengenai materi yang berkembang di lingkungan belajar.","Mengajak anak mengikuti kegiatan yang dapat memperluas pemahamannya mengenai kontribusi masyarakat terhadap pembangunan bangsa.","Membimbing anak menelaah kembali pandangan tersebut melalui berbagai perspektif dan sumber yang kredibel agar mampu menyimpulkan secara objektif."],"answer":"E","points":[1,4,3,2,5],"explanation":"E (Poin 5) Hal ini karena Adnan tidak hanya berusaha meluruskan pandangan anaknya, tetapi juga membimbingnya untuk menelaah suatu informasi dari berbagai perspektif dan sumber yang kredibel. Pendekatan ini membantu anak mengembangkan kemampuan berpikir kritis sehingga tidak mudah menerima suatu pandangan sebagai kebenaran hanya karena disampaikan oleh figur yang dihormati. Sikap ini mencerminkan nilai BerAKHLAK, khususnya Kompeten karena mendorong pemahaman yang berbasis fakta serta Harmonis karena membangun cara pandang yang lebih terbuka dan objektif. B (Poin 4) Mendorong anak menguji setiap pandangan berdasarkan fakta dan sumber yang dapat dipertanggung jawabkan merupakan langkah yang sangat baik untuk membangun daya kritis. Namun, pilihan ini masih berfokus pada proses verifikasi informasi, sedangkan opsiE lebih komprehensif karena juga mengajak anak melihat suatu isu dari berbagai perspektif. C (Poin 3) Berkomunikasi dengan pihak sekolah merupakan langkah yang cukup baik untuk memperoleh penjelasan mengenai pandangan yang berkembang di lingkungan belajar. Namun, karena belum terdapat indikasi pelanggaran atau tindakan yang lebih jauh, pembinaan dan penguatan pola pikir anak tetap menjadi prioritas utama. D (Poin 2) Mengajak anak mengikuti kegiatan yang memperluas wawasan kebangsaan dapat memberikan pengalaman positif dan sudut pandang baru. Akan tetapi, langkah ini lebih bersifat pendukung dan belum secara langsung menyentuh akar permasalahanyang sedang dihadapi. A (Poin 1) Berdiskusi mengenai tantangan dan peluang Indonesia merupakan langkah yang baik untuk menambah wawasan anak. Namun, pendekatan ini masih cukup umum dan belum secara spesifik membantu anak menguji validitas pandangan yang telah diterimanya.","source":"AyoCPNS"},{"n":105,"section":"TKP","topic":"Anti Radikalisme","prompt":"Suatu hari, anak Anda yang masih duduk di bangku SD mengatakan bahwa Indonesia merupakan \"negara gelap\" yang tidak memiliki masa depan. Setelah ditelusuri, Anda mengetahui bahwa pandangan tersebut diperoleh dari salah satu kanal YouTube yang sering ditontonnya. Sikap Anda sebaiknya...","options":["Menanyakan kepada anak alasan ia mempercayai informasi tersebut sambil menjelaskan bahwa tidak semua informasi di internet selalu benar.","Membatasi akses anak terhadap kanal tersebut dan mengarahkannya pada konten yang lebih sesuai dengan usianya.","Mengajak anak mengenal berbagai hal positif dan tantangan yang ada di Indonesia melalui pengalaman dan contoh sehari-hari.","Mendampingi anak saat menonton konten serupa dan menunjukkan bahwa suatu informasi dapat memiliki penjelasan yang berbeda.","Membiasakan anak bercerita mengenai informasi yang diperolehnya dari internet serta mendampinginya memahami informasi tersebut."],"answer":"E","points":[3,1,2,4,5],"explanation":"E (Poin 5) Hal ini karena masalah utama dalam soal bukan hanya satu video atau satu kanal YouTube, melainkan bagaimana anak memahami informasi yang diperolehnya dari internet. Dengan membiasakan anak bercerita dan mendampinginya memahami informasi yang diterima orang tua dapat membangun kebiasaan berpikir yang lebih sehat sekaligus mencegah anak menerima suatu informasi secara mentah. Sikap ini mencerminkannilai BerAKHLAK, khususnya Kompeten karena mendorong pembelajaran yang berkelanjutan serta Harmonis karena membangun komunikasi yang baik antara orang tua dan anak. D (Poin 4) Mendampingi anak saat menonton konten serupa dan menunjukkan bahwa suatu informasi dapat memiliki penjelasan yang berbeda merupakan langkah yang sangat baik. Anak belajar bahwa tidak semua informasi harus diterima secara langsung. Namun, pilihan ini masih berfokus pada situasi tertentu, sedangkan opsi E membangun kebiasaan yang dapat diterapkan pada berbagai informasi yang diterima anak di kemudian hari. A(Poin3) Menanyakan alasan anak mempercayai informasi tersebut dan menjelaskan bahwa tidak semua informasi di internet selalu benar merupakan langkah yang baik untuk meluruskan pemahamannya. Akan tetapi, pendekatan ini lebih bersifat respons terhadap satu kejadian dan belum membentuk kebiasaanjangka panjang C (Poin 2) Mengenalkan berbagai hal positif dan tantangan yang ada di Indonesia dapat membantu anak memperoleh gambaran yang lebih seimbang. Namun, langkahini lebih berfokus padaisi informasi yang diterima anak dan belum secara langsung membangun kemampuan anak dalam menyikapi informasi dari internet. B (Poin 1) Membatasi akses terhadap kanal tersebut menunjukkan kepedulian orang tua terhadap konten yang dikonsumsi anak. Namun pendekatan ini cenderung berfokus pada pembatasan akses tanpa membantu anak memahami mengapa informasi tersebut perlu disikapi secara bijak. Oleh karenaitu, pilihan ini menjadi yang paling kurang tepat dibanding opsi lainnya.","source":"AyoCPNS"},{"n":106,"section":"TKP","topic":"Anti Radikalisme","prompt":"Saat melayani masyarakat di loket pelayanan, Anda mendengar seorang pengunjung mengatakan kepada beberapa orang bahwa perubahan hanya dapat dicapai melalui tindakan keras karena cara-cara yang sah tidak pernah membawa hasil. Beberapa pengunjung lain terlihat menyetujui pernyataan tersebut. Sebagai ASN frontdesk, sikap Anda sebaiknya...","options":["Tetap fokus memberikan pelayanan sambil memastikan pembicaraan tersebut tidak mengganggu ketertiban area pelayanan.","Mengamati perkembangan situasi dan mencatat hal-hal yang perlu menjadi perhatian apabila pembicaraan semakin memengaruhi pengunjung lain.","Berkoordinasi dengan petugas atau pihak yang berwenang di lingkungan kantor apabila situasi mulai mengganggu suasana pelayanan.","Menyampaikan informasi mengenai saluran penyampaian aspirasi yang tersedia apabila pembahasan mulai berkaitan dengan keluhan terhadap layanan publik.","Mengingatkan pengunjung agar menjaga suasana pelayanan tetap kondusif tanpa menanggapi substansi pendapat yang disampaikan."],"answer":"D","points":[1,2,3,5,4],"explanation":"D (Poin 5) Hal ini karena pernyataan yang disampaikan pengunjung mengandung anggapan bahwa cara-cara yang sah tidak efektif untuk menghasilkan perubahan. Sebagai ASN frontdesk, kewenangan yang paling relevan bukan berdebat atau membantah pendapat tersebut, melainkan memberikan informasi mengenai saluran aspirasi yang tersedia apabila pembahasan mulai berkaitan dengan pelayanan atau kebijakan publik. Langkah ini membantu menunjukkan bahwa masyarakat tetap memiliki mekanisme yang sah untuk menyampaikan pendapat dan keluhan. Sikap ini mencerminkan nilai BerAKHLAK, khususnya Pelayanan dan Kompeten, karena memberikan informasi yang relevan sesuai tugas dan kewenangan. E (Poin4) Mengingatkan pengunjung agar menjaga suasana pelayanan tetap kondusif merupakan langkah yang baik untuk menjaga ketertiban area pelayanan. Namun, pilihan ini hanya berfokus pada suasana pelayanan dan belum memberikan alternatif yang konstruktif terhadap pandangan yang berkembang. C (Poin 3) Berkoordinasi dengan petugas atau pihak yang berwenang merupakan langkah yang tepat apabila situasi mulai mengganggu pelayanan atau berpotensi menimbulkan gangguan yang lebih besar. Namun, pada kondisi dalam soal, pembicaraan masih berupa opini dan belum menunjukkan adanya gangguan nyata sehingga langkah ini masih belum menjadi prioritas. B (Poin 2) Mengamati perkembangan situasi dan mencatat hal-hal yang perlu menjadi perhatian menunjukkan kewaspadaan terhadap kondisi sekitar. Akan tetapi, langkah ini masih bersifat pasif dan belum memberikan kontribusi nyata terhadap penyelesaian situasi AA (Poin 1) Tetap fokus memberikan pelayanan merupakan hal yang penting bagi ASN. Namun, mengabaikan sepenuhnya percakapanyang mulai memengaruhi pengunjung lain membuat potensi permasalahan tidak direspons secara proporsional sehingga menjadi pilihanyang palingkurang tepat:","source":"AyoCPNS"},{"n":107,"section":"TKP","topic":"Anti Radikalisme","prompt":"Anda bekerja di sebuah instansi yang memiliki petugas keamanan senior yang sangat dihormati pegawai lain. Dalam berbagai kesempatan, ia sering menyampaikan bahwa kebijakan instansi selalu benar dan pegawai yang mengkritiknya tidak layak didengarkan. Beberapa pegawai baru mulai mengikuti pandangan tersebut. Sikap Anda sebaiknya...","options":["Mengajak pegawai lain melihat setiap kebijakan secara lebih objektif dengan mempertimbangkan berbagai sudut pandang.","Berdiskusi dengan petugas keamanan tersebut untuk memahami alasan yang mendasari pandangannya.","Mendorong budaya kerja yang terbuka terhadap masukan dan perbedaan pendapat yang disampaikan secara bertanggung jawab.","Mengingatkan pegawai baru bahwa perbedaan pendapat merupakan hal yang wajar dalam lingkungan kerja profesional.","Mengamati perkembangan situasi untuk mengetahui sejauh mana pengaruh pandangan tersebut terhadap lingkungan kerja."],"answer":"C","points":[4,2,5,3,1],"explanation":"C (Poin 5) Mendorong budaya kerja yang terbuka terhadap masukan dan perbedaan pendapat yang disampaikan secara bertanggung jawab merupakan langkah paling tepat. Permasalahan dalam soal bukan hanya berasal dari satu individu, tetapi sudah mulai memengaruhi pegawai baru. Oleh karena itu, pendekatan yang menyasar lingkungan kerja secara lebih luas akan lebih efektif untuk mencegah berkembangnya pola pikir yang menolak kritik dan keberagaman pandangan. Sikap ini mencerminkan nilai BerAKHLAK, khususnya Kolaboratif dan Harmonis, karena mendorong terciptanya lingkungan kerja yang sehat, terbuka, dan saling menghargai. AA (Poin 4) Mengajak pegawailain melihat kebijakan secara objektif merupakan langkah yang baik karena membantu mereka memahami bahwa suatu kebijakan dapat dinilai dari berbagai sudut pandang. Namun, pilihan ini masih berfokus pada cara pandang individu pegawai, sedangkan opsi C berupaya membangun budaya kerja yang lebih luas dan berkelanjutan. D (Poin 3) Mengingatkan pegawai baru bahwa perbedaan pendapat merupakan hal yang wajar dalam lingkungan profesional juga merupakan langkah positif. Akan tetapi, tindakan ini masih terbatas pada kelompok tertentu dan belum menyentuh lingkungan kerja secara keseluruhan B (Poin 2) Berdiskusi dengan petugas keamanan tersebut dapat membantu memahami alasan yang mendasari pandangannya. Namun, masalah yang dihadapi bukan hanya pandangan pribadi petugas keamanan, melainkan pengaruh yang mulai berkembang di lingkungan kerja Oleh karena itu, langkah ini belum menjadi prioritas utama. E (Poin 1) Mengamati perkembangan situasi menunjukkan kehati-hatian dalam memahami kondisi yang terjadi. Namun, informasi pada soal sudah cukup menunjukkan adanya pengaruh terhadap pegawai lain sehingga diperlukan langkah yang lebih aktif daripada sekadar melakukan pengamatan","source":"AyoCPNS"},{"n":108,"section":"TKP","topic":"Anti Radikalisme","prompt":"Dalam rapat organisasi pemuda, seorang anggota yang cukup berpengaruh sering menyampaikan bahwa keputusan sebaiknya ditentukan oleh segelintir orang yang dianggap paling memahami keadaan. Menurutnya, melibatkan terlalu banyak pendapat hanya akan menghambat kemajuan organisasi. Sikap yang sebaiknya dilakukan Yudhist adalah...","options":["Menjelaskan bahwa setiap anggota berhak menyampaikan pendapat sebagai bagian dari proses pengambilan keputusan yang sehat.","Menelaah alasan yang mendasari pandangan tersebut sebelum menentukan sikap terhadap usulan yang disampaikan.","Mendorong organisasi tetap menggunakan mekanisme musyawarah yang memberi ruang bagi berbagai pandangan secara proporsional.","Mengajak anggota lain mempertimbangkan manfaat keterlibatan berbagai pihak dalam menghasilkan keputusan yang lebih baik.","Mengingatkan anggota organisasi agar tidak mudah menerima suatu gagasan tanpa mempertimbangkan dampaknya terhadap organisasi."],"answer":"C","points":[3,2,5,4,1],"explanation":"C (Poin 5) Mendorong organisasi tetap menggunakan mekanisme musyawarah yang memberi ruang bagi berbagai pandangan secara proporsional merupakan langkah paling tepat. Permasalahan dalam soal tidak lagi sebatas pendapat pribadi seorang anggota, melainkan mulai memengaruhi cara organisasi mengambil keputusan. Oleh karena itu, menjaga mekanisme musyawarah yang inklusif menjadi langkah yang paling efektif untuk mencegah berkembangnya pola pikir yang menolak partisipasi anggota lain. Sikap ini mencerminkan nilai BerAKHLAK, khususnya Kolaboratif dan Harmonis, karena menghargai kontribusi berbagai pihak dalam proses pengambilan keputusan. D (Poin 4) Mengajak anggota lain mempertimbangkan manfaat keterlibatan berbagai pihak dalam pengambilan keputusan merupakan langkah yang baik. Pilihan ini membantu anggota memahami nilai partisipasi dan keberagaman pandangan. Namun, pendekatan ini masih berfokus pada individu anggota, sedangkan opsi C berupaya menjaga mekanisme organisasi secara langsung. AA (Poin 3) Menjelaskan bahwa setiap anggota berhak menyampaikan pendapat juga merupakan langkah yang positif. Akan tetapi, pilihan ini lebih menekankan hak individu untuk berpendapat dan belum secara langsung menyentuh pentingnya menjaga proses pengambilan keputusan yang partisipatif. B (Poin 2) Menelaah alasan yang mendasari pandangan tersebut menunjukkan sikap terbuka dan tidak tergesa-gesa dalam menilai suatu gagasan. Namun, informasi pada soal sudah cukup jelas menunjukkan adanya kecenderungan membatasi partisipasi anggota lain sehingga langkah yang lebih aktif diperlukan. E (Poin 1) Mengingatkan anggota agar tidak mudah menerima suatu gagasan tanpa mempertimbangkan dampaknya merupakan tindakan yang baik. Namun, pendekatan ini masih bersifat umum dan belum secara langsung merespons isu utama, yaitu mekanisme pengambilan keputusan dalam organisasi.","source":"AyoCPNS"},{"n":109,"section":"TKP","topic":"Anti Radikalisme","prompt":"Dalam sebuah komunitas, ketua kelompok sering mengatakan bahwa kritik terhadap keputusan pimpinan hanya akan memecah persatuan sehingga anggota sebaiknya mendukung setiap keputusan yang telah ditetapkan. Sejumlah anggota mulai enggan menyampaikan pendapat yang berbeda. Sikap Anda sebaiknya...","options":["Menjelaskan bahwa masukan yang konstruktif dapat mendukung kemajuan organisasi.","Mendorong anggota tetap menyampaikan pandangan secara santun dan bertanggung jawab.","Mengupayakan agar proses diskusi tetap memberi ruang bagi berbagai pandangan.","Mengingatkan bahwa perbedaan pendapat tidak selalu bertentangan dengan semangat persatuan.","Menelaah pertimbangan yang mendasari pandangan tersebut sebelum mengambil sikap."],"answer":"C","points":[1,4,5,3,2],"explanation":"C (Poin 5) merupakan pilihan terbaik karena permasalahan utama dalam soal bukan sekadar adanya pendapat ketua yang anti-kritik, melainkan dampaknya terhadap iklim organisasi. Terlihat bahwa sejumlah anggota mulai enggan menyampaikan pandangan yang berbeda Dalam kondisi seperti ini, langkah yang paling kuat adalah menjaga agar proses diskusi tetap memberikan ruang bagi berbagai pandangan sehingga organisasi tidak bergantung pada satu suara saja. Pilihan ini berorientasi pada perbaikan sistem dan budaya organisasi, bukan hanya individu tertentu B (Poin 4) merupakan pilihan yang sangat baik karena mendorong anggota tetap berani menyampaikan pandangan secara santun dan bertanggung jawab. Namun, fokusnya masih pada perilaku anggota. Jika ruang diskusi organisasi sudah tidak sehat, keberanian anggota saja belum tentu cukup. Karena itu, B masih sedikit di bawah C. D (Poin 3) juga tepat karena meluruskan pemahaman bahwa persatuan tidak harus diartikan sebagai kesamaan pendapat. Organisasi yang sehat tetap dapat menjaga kebersamaan meskipun terdapat perbedaan pandangan. Namun, pilihanini lebih bersifat edukatif dan belum menyentuh mekanisme organisasi secara langsung E (Poin 2) menunjukkan sikap terbuka dengan berusaha memahamialasan yang mendasari pandangan ketua sebelum menentukan sikap Langkah ini baik untuk menghindari kesimpulan yang tergesa-gesa. Akan tetapi, soal sudah menunjukkan adanya dampak nyata terhadap anggota sehingga diperlukan tindakan yang lebih aktif. AA (Poin 1) menjelaskan bahwa masukan yang konstruktif dapat mendukung kemajuan organisasi. Pernyataan ini benar dan positif, tetapi cakupannya paling sempit dibanding pilihan lain karena hanya menyoroti manfaat kritik tanpa menyentuh masalah utama, yaitu mulai hilangnya ruang bagi perbedaan pendapat. 8 | Petaan","source":"AyoCPNS"},{"n":110,"section":"TKP","topic":"Anti Radikalisme","prompt":"Dalam sesi wawancara yang disiarkan langsung, seorang wartawan bertanya kepada Kepala Badan, \"Bukankah masyarakat sebenarnya sudah tidak memiliki alasan untuk mempercayai lembaga negara karena berbagai masalah yang terus terjadi?\" Beberapa peserta tampak menyetujui pertanyaan tersebut. Sikap Kepala Badan sebaiknya...","options":["Menjelaskan bahwa setiap lembaga negara memiliki tantangan sekaligus mekanisme perbaikan yang perlu dipahami secara objektif.","Menegaskan bahwa masyarakat tetap wajib mempercayai lembaga negara sebagai bagian dari kehidupan berbangsa dan bernegara.","Menyampaikan berbagai capaian lembaga yang dipimpinnya sebagai bukti bahwa lembaga negara masih bekerja untuk masyarakat.","Mengajak peserta melihat isu tersebut secara utuh dengan mempertimbangkan fakta, capaian, tantangan, dan upaya perbaikan yang sedang dilakukan.","Mengingatkan bahwa pertanyaan tersebut berpotensi menimbulkan persepsi yang kurang tepat terhadap lembaga negara."],"answer":"D","points":[4,1,3,5,2],"explanation":"D (Poin 5) Mengajak peserta melihat isu tersebut secara utuh dengan mempertimbangkan fakta, capaian, tantangan, dan upaya perbaikan yang sedang dilakukan merupakan langkah paling tepat karena mampu membangun pemahaman publik secara objektif tanpa terjebak pada sikap defensif maupun pembelaan yang berlebihan terhadap lembaga negara. Sebagai Kepala Badan, tindakan ini mencerminkan nilai Akuntabel karena menyampaikan kondisi lembaga secara terbuka dan dapat dipertanggung jawabkan, Kompeten karena menggunakan fakta serta sudut pandang yang menyeluruh dalam menjawab pertanyaan publik, dan Loyal karena menjaga kepercayaan terhadap institusi negara melalui komunikasi yang profesional serta berorientasi pada kepentingan masyarakat, bukan sekadar membela lembaga secara sepihak AA (Poin 4) juga sangat baik karena menjelaskan bahwa lembaga negara memiliki tantangan sekaligus mekanisme perbaikan. Pilihan ini membantu masyarakat memahami bahwa keberadaan masalah tidak serta-merta menghilangkan fungsi dan peran lembaga negara. Namun cakupannya masih lebih sempit dibanding D yang memberikan perspektif yang lebih menyeluruh. C (Poin 3) merupakan langkah yang positif karena menunjukkan bukti konkret bahwa lembaga negara tetap bekerja untuk masyarakat. Akan tetapi, fokusnya masih cenderung pada pembelaan terhadap lembaga yang dipimpinnya sehingga belum sepenuhnya menjawab persoalan yang lebih luas mengenai kepercayaan terhadap institusi negara. E (Poin 2) menunjukkan kewaspadaan terhadap kemungkinan munculnya persepsi yang kurang tepat. Namun, pilihan ini berisiko membuat tanggapan terkesan defensif dan tidak menyentuh substansi pertanyaan yang diajukan B (Poin 1) merupakan pilihan yang paling kurang tepat karena menekankan kewajiban masyarakat untuk mempercayai lembaga negara tanpa memberikan penjelasan yang memadai. Kepercayaan publik tidak dibangun melalui tuntutan untuk percaya, melainkan melalui keterbukaan, akuntabilitas, dan kinerja yang dapat dipertanggung jawabkan","source":"AyoCPNS"}];
const LETTERS=['A','B','C','D','E'];
const DURATION=100*60;
const PASS={TWK:65,TIU:80,TKP:166};
const MAX={TWK:150,TIU:175,TKP:225};
const app=document.getElementById('app');
let page='login',current=1,filter='ALL',reviewIndex=1,timerHandle=null;
let state={answers:{},marked:[],startAt:null,submitted:false};
const saved=localStorage.getItem('patungan_skd_state');
if(saved){try{state={...state,...JSON.parse(saved)}}catch(e){}}
function save(){localStorage.setItem('patungan_skd_state',JSON.stringify(state));}
function assetLogo(){return 'assets/logo-patungan-bimbel-skd.png'}
function sectionName(s){return s==='TWK'?'Tes Wawasan Kebangsaan':s==='TIU'?'Tes Intelegensia Umum':'Tes Karakteristik Pribadi'}
function sectionRange(s){return s==='TWK'?'1–30':s==='TIU'?'31–65':'66–110'}
function fmtTime(sec){sec=Math.max(0,sec);let h=Math.floor(sec/3600),m=Math.floor((sec%3600)/60),s=sec%60;return (h?String(h).padStart(2,'0')+':':'')+String(m).padStart(2,'0')+':'+String(s).padStart(2,'0')}
function remaining(){if(!state.startAt)return DURATION;return Math.max(0,DURATION-Math.floor((Date.now()-state.startAt)/1000))}
function answeredCount(){return Object.keys(state.answers).filter(k=>state.answers[k]).length}
function sectionQuestions(s){return QUESTIONS.filter(q=>q.section===s)}
function getPoints(q,choice){if(!choice)return 0;return q.points[LETTERS.indexOf(choice)]||0}
function calculate(){let out={TWK:0,TIU:0,TKP:0},answered=0,topChoices=0,details=[];for(const q of QUESTIONS){const choice=state.answers[q.n]||null; if(choice)answered++;const pts=getPoints(q,choice);out[q.section]+=pts;if(q.section==='TKP'&&pts===5)topChoices++;details.push({q,choice,points:pts,correct:choice===q.answer});}return {out,total:out.TWK+out.TIU+out.TKP,answered,unanswered:110-answered,topChoices,details}}

function escapeHTML(value){

}
function renderStimulus(q){

 if(q.table){
  out+=`<div class="native-table-wrap"><table class="native-stimulus-table">`;
  if(q.table.headers?.length) out+=`<thead><tr>${q.table.headers.map(h=>`<th>${escapeHTML(h)}</th>`).join('')}</tr></thead>`;
  out+=`<tbody>${q.table.rows.map(row=>`<tr>${row.map(cell=>`<td>${escapeHTML(cell)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
 }
 if(q.conditions?.length) out+=`<ul class="question-v4-conditions">${q.conditions.map(c=>`<li>${escapeHTML(c)}</li>`).join('')}</ul>`;

function renderStimulus(q){
 let out='<div class="question-v4-content">';

 if(q.table)out+=`<div class="native-table-wrap"><table class="native-stimulus-table">${q.table.headers?.length?`<thead><tr>${q.table.headers.map(h=>`<th>${escapeHTML(h)}</th>`).join('')}</tr></thead>`:''}<tbody>${q.table.rows.map(row=>`<tr>${row.map(cell=>`<td>${escapeHTML(cell)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
 if(q.conditions?.length)out+=`<ul class="question-v4-conditions">${q.conditions.map(c=>`<li>${escapeHTML(c)}</li>`).join('')}</ul>`;

function renderExplanation(text,q){
 const value=String(text||'');const pieces=value.split('[[TABLE]]');
 const renderBlocks=(str)=>str.split(/\n{2,}/).map(x=>x.trim()).filter(Boolean).map(block=>{
   const lines=block.split('\n').map(x=>x.trim()).filter(Boolean);
   if(lines.length>1&&lines.every(x=>/^(?:[•·▪-])\s*/.test(x)))return `<ul class="explanation-bullets">${lines.map(x=>`<li>${escapeHTML(x.replace(/^(?:[•·▪-])\s*/,''))}</li>`).join('')}</ul>`;
   return `<p>${escapeHTML(block).replace(/\n/g,'<br>')}</p>`;
 }).join('');
 let out=renderBlocks(pieces[0]||'');
 if(q?.explanationTable){const t=q.explanationTable;out+=`<div class="explanation-table-wrap"><table class="explanation-table"><thead><tr>${t.headers.map(h=>`<th>${escapeHTML(h)}</th>`).join('')}</tr></thead><tbody>${t.rows.map(row=>`<tr>${row.map(cell=>`<td>${escapeHTML(cell)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`}
 if(pieces.length>1)out+=renderBlocks(pieces.slice(1).join(' '));
 return out;
}

 if(!list.length){app.innerHTML=header()+`<main class="v3-page"><section class="empty-review"><h2>Tidak ada soal pada filter ini</h2><p>Coba pilih filter lain untuk melihat pembahasan.</p><button class="v3-primary" onclick="openReview('ALL')">Lihat semua pembahasan</button></section></main>`;return;}
 const q=QUESTIONS[reviewIndex-1],choice=state.answers[q.n]||'—',points=getPoints(q,choice==='—'?null:choice),isCorrect=choice===q.answer,idx=list.findIndex(x=>x.n===q.n);
 app.innerHTML=header()+`<main class="v3-page review-v3-page cat-review-page"><div class="cat-review-heading"><div><span class="v3-kicker">HASIL & EVALUASI</span><h1>Try Out Bimbel Batch 4 - 2026 #2</h1><p>Pelajari soal, opsi, skor, kunci jawaban, dan pembahasan dari sumber.</p></div><div class="cat-results-tabs"><button onclick="page='results';render()">Statistik</button><button class="active">Pembahasan</button><button onclick="openRecommendations()">Rekomendasi</button></div></div><div class="review-v3-layout"><aside class="review-v3-side"><div class="review-filter-title">Filter soal</div><div class="review-filter-v3">${[['ALL','Semua'],['WRONG','Belum tepat'],['MARKED','Ditandai'],['TWK','TWK'],['TIU','TIU'],['TKP','TKP']].map(([v,l])=>`<button class="${filter===v?'active':''}" onclick="openReview('${v}')">${l}</button>`).join('')}</div><div class="review-list-head"><b>Nomor soal</b><span>${list.length}</span></div><div class="review-nav-grid">${list.map(x=>`<button class="${reviewIndex===x.n?'current':''} ${state.answers[x.n]?'answered':''}" onclick="reviewIndex=${x.n};renderReview()">${x.n}</button>`).join('')}</div></aside><section class="review-v3-main review-v4-main"><div class="review-score-strip"><div class="review-number-v3"><span>NO.</span><b>${String(q.n).padStart(2,'0')}</b><small>${q.section}</small></div><div class="review-result-v3"><div><small>Jawaban Anda</small><b>${choice}</b></div><div><small>Kunci jawaban</small><b>${q.answer}</b></div><div><small>Skor</small><b>${points}/5</b></div></div><span class="review-state-v3 ${isCorrect?'correct':''}">${q.section==='TKP'?(points===5?'Skor tertinggi':'Skor '+points):(isCorrect?'Benar':'Belum tepat')}</span></div><article class="review-question-v4"><div class="review-question-head"><div><span class="review-topic">${escapeHTML(sectionTitle(q.section))}</span><h2>${escapeHTML(topicLabel(q.topic))}</h2></div><span class="source-mini">SUMBER AyoCPNS</span></div>${renderStimulus(q)}${renderReviewOptions(q,choice)}</article><article class="explanation-v4"><div class="explanation-v4-head"><span>PEMBAHASAN</span><h2>Penjelasan jawaban</h2></div><div class="explanation-v4-body">${renderExplanation(q.explanation,q)}</div><div class="explanation-v4-source">Sumber materi: AyoCPNS · Ditampilkan ulang sebagai teks dan komponen website.</div></article><div class="review-v3-pager"><button class="v3-outline" onclick="reviewMove(-1)" ${idx===0?'disabled':''}>← Sebelumnya</button><span>${idx+1} / ${list.length}</span><button class="v3-primary" onclick="reviewMove(1)" ${idx===list.length-1?'disabled':''}>Selanjutnya →</button></div></section></div></main>`;
}
function header(showLogout=true){const onResult=['results','review','recommendations'].includes(page);return `<header class="topbar"><div class="top-brand"><img src="${assetLogo()}" alt="Patungan Bimbel SKD"><div><strong>PATUNGAN BIMBEL SKD</strong><small>TRYOUT SKD</small></div></div>${showLogout?`<div class="top-actions"><nav class="top-nav" aria-label="Navigasi utama"><button class="top-nav-link ${onResult?'':'active'}" onclick="page='dashboard';render()">Tryout</button><button class="top-nav-link ${onResult?'active':''}" ${state.submitted?`onclick="page='results';render()"`:'disabled title="Selesaikan tryout untuk melihat hasil"'}>Hasil</button></nav><button class="logout-btn" onclick="logout()" aria-label="Keluar"><span>↗</span> Keluar</button></div>`:''}</header>`}
function render(){if(page==='login'){loginView();return}if(!sessionStorage.getItem('patungan_skd_login')){page='login';loginView();return}if(page==='dashboard')dashboard();else if(page==='exam'){renderExam();startTimer()}else if(page==='results')resultsView();else if(page==='review')reviewView();else if(page==='recommendations')recommendationsView()}

if(sessionStorage.getItem('patungan_skd_login')){page=state.submitted?'results':(state.startAt?'exam':'dashboard')}render();
</script>
