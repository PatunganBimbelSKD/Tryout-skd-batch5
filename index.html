function sectionName(s){return s==='TWK'?'Tes Wawasan Kebangsaan':s==='TIU'?'Tes Intelegensia Umum':'Tes Karakteristik Pribadi'}
function sectionRange(s){return s==='TWK'?'1–30':s==='TIU'?'31–65':'66–110'}
function fmtTime(sec){sec=Math.max(0,sec);let h=Math.floor(sec/3600),m=Math.floor((sec%3600)/60),s=sec%60;return (h?String(h).padStart(2,'0')+':':'')+String(m).padStart(2,'0')+':'+String(s).padStart(2,'0')}
function remaining(){if(!state.startAt)return DURATION;return Math.max(0,DURATION-Math.floor((Date.now()-state.startAt)/1000))}
function answeredCount(){return Object.keys(state.answers).filter(k=>state.answers[k]).length}
function sectionQuestions(s){return QUESTIONS.filter(q=>q.section===s)}
function getPoints(q,choice){if(!choice)return 0;return q.points[LETTERS.indexOf(choice)]||0}
function calculate(){let out={TWK:0,TIU:0,TKP:0},answered=0,topChoices=0,details=[];for(const q of QUESTIONS){const choice=state.answers[q.n]||null; if(choice)answered++;const pts=getPoints(q,choice);out[q.section]+=pts;if(q.section==='TKP'&&pts===5)topChoices++;details.push({q,choice,points:pts,correct:choice===q.answer});}return {out,total:out.TWK+out.TIU+out.TKP,answered,unanswered:110-answered,topChoices,details}}

function login(){const u=document.getElementById('username').value.trim(),p=document.getElementById('password').value; if(u==='yokcpns'&&p==='12345'){qaSession.setItem('patungan_skd_login','1');page='dashboard';homeHubTab='tryout';if(page==='exam'&&remaining()===0)finishExam(true);else render()}else{document.getElementById('loginError').textContent='Username atau password tidak sesuai. Silakan periksa kembali.'}}

const CATALOG_PACKS=[{id:'4-2',batch:'04',edition:'2026 · Seri 02',name:'Try Out Bimbel Batch 4 – 2026 #2',ready:true},{id:'4-1',batch:'04',edition:'2026 · Seri 01',name:'Try Out Bimbel Batch 4 – 2026 #1',ready:false},{id:'3-1',batch:'03',edition:'2026 · Seri 01',name:'Try Out Bimbel Batch 3 – 2026 #1',ready:false}];
let catalogFilter='all';
let homeHubTab='tryout';
function setCatalogFilter(v){catalogFilter=v;renderCatalog()}
function renderCatalog(){const el=document.getElementById('catalogCards');if(!el)return;const resume=state.startAt&&!state.submitted,done=answeredCount();document.querySelectorAll('[data-catalog-filter]').forEach(b=>{const active=b.dataset.catalogFilter===catalogFilter;b.classList.toggle('active',active);b.setAttribute('aria-pressed',String(active))});const entries=CATALOG_PACKS.filter(p=>catalogFilter==='all'||(catalogFilter==='ready'?p.ready:!p.ready));el.innerHTML=entries.map(p=>`<article class="catalog-card ${p.ready?'catalog-live':'catalog-upcoming'}"><div class="catalog-card-top"><div class="catalog-icon"><span>BATCH</span><b>${p.batch}</b></div><span class="catalog-status ${p.ready?'available':''}">${p.ready?(resume?'Sedang berlangsung':state.submitted?'Tersedia · Selesai':'Tersedia'):'Coming Soon'}</span></div><small class="catalog-edition">${p.edition}</small><h3>${p.name}</h3><div class="catalog-facts"><span>▤ &nbsp;110 soal</span><span>◷ &nbsp;100 menit</span></div>${p.ready&&resume?`<div class="catalog-progress"><span>${done}/110 terjawab</span><div class="v3-progress"><span style="width:${done/110*100}%"></span></div></div>`:''}<details class="catalog-detail"><summary>Detail paket</summary><p>${p.ready?'TWK, TIU, dan TKP. Penilaian otomatis, statistik, dan pembahasan setelah ujian.':'Paket belum dibuka. Materi dan tanggal pembukaan belum tersedia.'}</p></details><div class="catalog-actions">${p.ready?`<button class="v3-primary" onclick="showInstructions()">${resume?'Lanjutkan tryout':state.submitted?'Kerjakan lagi':'Mulai tryout'} <span>→</span></button>`:`<button class="catalog-locked" disabled aria-label="Paket belum tersedia">▣ &nbsp; Coming Soon</button>`}</div></article>`).join('');document.getElementById('catalogCount').textContent=entries.length+' paket';}

function homeIconSVG(){return `<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="4.5" width="12" height="15" rx="2"></rect><path d="M9 3.5h6"></path><path d="M9.5 9h5"></path><path d="M9.5 12h5"></path><path d="M9.5 15h3.5"></path><path d="M4.5 8.5h1.5a2 2 0 0 1 2 2v7a2 2 0 0 1-2 2H4.5z"></path></svg>`}
function homeFireSVG(){return `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3c1 2.4 3.8 3.4 3.8 6.4 0 1.5-.7 2.8-1.9 3.7.2-2.1-1-3.1-2-4.1-1.1 1.3-2.7 2.5-2.7 4.8 0 2.3 1.8 4.2 4 4.2 2.7 0 4.8-2.2 4.8-5 0-4.4-3.1-7.1-6-10z"></path><path d="M9.5 17.2c.3 1.9 1.6 3.3 3.5 3.3 1.8 0 3.2-1.4 3.2-3.2 0-1.4-.8-2.4-2-3.2.1 1.5-.8 2.3-1.7 2.9.1-1.1-.5-1.8-1.1-2.5-.9.9-1.9 1.6-1.9 2.7z"></path></svg>`}
function setHomeHubTab(tab){if(!['tryout','latihan','hasil'].includes(tab))return;ltStop();homeHubTab=tab;page='dashboard';render();}
function tryoutCardAction(id){if(id==='4-2')showInstructions()}
function openPackageData(id){const el=document.getElementById('pkg-'+id);if(!el)return;el.hidden=!el.hidden;document.querySelector('[data-pkg="'+id+'"]').setAttribute('aria-expanded',String(!el.hidden));}
function homeInfoMeta(n,minutes){return `<div class="home-meta"><span><svg viewBox="0 0 24 24"><path d="M6 3h8l4 4v14H6zM14 3v5h4M9 12h6M9 16h6"/></svg>${n} Soal</span><span><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l4 2"/></svg>${minutes} Menit</span></div>`}
function renderHomeTryoutCards(){const resume=state.startAt&&!state.submitted;return `<div class="home-grid">${CATALOG_PACKS.map(p=>`<article class="home-card ${p.ready?'':'locked'}"><span class="home-badge ${p.ready?'available':'soon'}">${p.ready?(resume?'Berlangsung':'Tersedia'):'COMING SOON'}</span><div class="home-card-top"><div class="home-card-icon">${homeIconSVG()}</div><div><h3>${p.name}</h3>${homeInfoMeta(110,100)}</div></div><div class="home-actions"><button class="home-btn primary" ${p.ready?`onclick="tryoutCardAction('${p.id}')"`:'disabled'}>${p.ready?(resume?'Lanjutkan':'Kerjakan'):'Coming Soon'}</button><button class="home-btn" data-pkg="${p.id}" aria-expanded="false" aria-controls="pkg-${p.id}" onclick="openPackageData('${p.id}')">Data ⌄</button></div><div class="home-detail" id="pkg-${p.id}" hidden>${p.ready?'30 TWK · 35 TIU · 45 TKP · Skor maksimum 550. Pembahasan setelah selesai.':'Paket belum tersedia. Jadwal pembukaan belum diumumkan.'}</div></article>`).join('')}</div>`}

function goQuestion(n){
 document.getElementById('questionNavModal')?.remove();
 current=Math.min(110,Math.max(1,n));save();renderExam();window.scrollTo(0,0);
}
function choose(letter){if(page!=='exam'||state.submitted)return;if(remaining()===0){finishExam(true);return}if(!LETTERS.includes(letter))return;state.answers[current]=letter;save();renderExam()}
function toggleMark(){const i=state.marked.indexOf(current);if(i>=0)state.marked.splice(i,1);else state.marked.push(current);save();renderExam()}
function navSection(sec){

 return `<div class="nav-section-v3"><div class="nav-section-title-v3"><b>${sec}</b><span>${count}/${arr.length}</span></div><div class="nav-grid-v3">${arr.map(q=>`<button aria-label="Soal ${q.n}" class="nav-num-v3 ${state.answers[q.n]?'answered':''} ${state.marked.includes(q.n)?'marked':''} ${current===q.n?'current':''}" onclick="goQuestion(${q.n})">${q.n}</button>`).join('')}</div></div>`;
}
function escapeHTML(value){
 return String(value??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
}
function renderStimulus(q){
 let out=`<div class="question-v4-content">`;
 if(q.prompt) out+=`<div class="question-v4-prompt">${escapeHTML(q.prompt).replace(/\n/g,'<br>')}</div>`;
 if(q.table){
  out+=`<div class="native-table-wrap"><table class="native-stimulus-table">`;
  if(q.table.headers?.length) out+=`<thead><tr>${q.table.headers.map(h=>`<th>${escapeHTML(h)}</th>`).join('')}</tr></thead>`;
  out+=`<tbody>${q.table.rows.map(row=>`<tr>${row.map(cell=>`<td>${escapeHTML(cell)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
 }
 if(q.conditions?.length) out+=`<ul class="question-v4-conditions">${q.conditions.map(c=>`<li>${escapeHTML(c)}</li>`).join('')}</ul>`;
 if(q.diagram) out+=`<figure class="question-v4-diagram"><img src="${q.diagram}" alt="Stimulus gambar soal ${q.n}"><figcaption>Stimulus gambar soal ${q.n}</figcaption></figure>`;
 out+=`</div>`;
 return out;
}
function renderExamOptions(q,choice){
 return `<div class="choice-v3-grid choice-v4-list">${q.options.map((opt,i)=>{const letter=LETTERS[i],selected=choice===letter;return `<button type="button" class="choice-v3 ${selected?'selected':''}" aria-pressed="${selected}" onclick="choose('${letter}')"><span class="choice-letter">${letter}</span><span class="choice-copy">${escapeHTML(opt)}</span>${selected?'<span class="choice-selected-tag">Dipilih</span>':''}</button>`}).join('')}</div>`;
}
function renderReviewOptions(q,choice){
 return `<div class="review-options-v4">${q.options.map((opt,i)=>{
  const letter=LETTERS[i],selected=choice===letter,correct=letter===q.answer,score=q.points?.[i]??0;
  const tag=q.section==='TKP'?`${score} poin`:correct?'Kunci jawaban':selected?'Jawaban kamu':'';
  return `<div class="review-option-v4 ${selected?'is-selected':''} ${correct?'is-correct':''}"><span class="choice-letter">${letter}</span><span class="choice-copy">${escapeHTML(opt)}</span>${tag?`<span class="review-option-tag">${escapeHTML(tag)}</span>`:''}</div>`;
 }).join('')}</div>`;
}
function renderExplanation(text){
 const blocks=String(text||'').split(/\n{2,}/).map(x=>x.trim()).filter(Boolean);
 return blocks.map(x=>`<p>${escapeHTML(x).replace(/\n/g,'<br>')}</p>`).join('');
}

function renderExam(){

 app.innerHTML=`<div class="exam-v3-shell">
  <header class="exam-v3-top"><div class="exam-v3-brand"><img src="${assetLogo()}" alt=""><div><b>Patungan Bimbel SKD</b><small>Tryout SKD</small></div></div><div class="exam-v3-center"><span class="live-pill"><i></i> UJIAN BERLANGSUNG</span><span class="exam-v3-name">Try Out Bimbel Batch 4 - 2026 #2</span></div><div class="exam-v3-right"><div class="timer-v3" id="timerBox"><span>◷</span><b id="timerText">${fmtTime(remaining())}</b></div><button class="finish-v3" onclick="finishConfirm()">Selesai</button></div></header>

  </section><aside class="question-nav-v3"><div class="nav-v3-head"><div><b>Daftar soal</b><small>${progress} dari 110 terjawab</small></div><span class="nav-v3-count">${Math.round(progress/110*100)}%</span></div><div class="v3-progress nav-progress"><span style="width:${progress/110*100}%"></span></div>${navSection('TWK')}${navSection('TIU')}${navSection('TKP')}<div class="nav-v3-legend"><span><i class="legend-answered"></i> Terjawab</span><span><i class="legend-marked"></i> Ditandai</span></div><button class="finish-v3 full-finish" onclick="finishConfirm()">Selesaikan tryout</button></aside></main>
  <div class="mobile-question-tools"><button onclick="openQuestionNav()">▦ &nbsp;Daftar soal <b>${progress}/110</b></button><span>${q.section}</span></div>
 </div>`;

function finishConfirm(){const unanswered=110-answeredCount();const backdrop=document.createElement('div');backdrop.className='modal-backdrop';backdrop.id='finishModal';backdrop.innerHTML=`<div class="modal"><h3>Akhiri tryout sekarang?</h3><p>Pastikan semua jawaban sudah diperiksa. Setelah dikirim, jawaban tidak dapat diubah dan pembahasan akan terbuka.</p><div class="instruction-list"><div class="instruction"><b>✓</b><span><b>${answeredCount()}</b> soal sudah dijawab.</span></div><div class="instruction"><b>!</b><span><b>${unanswered}</b> soal belum dijawab.</span></div><div class="instruction"><b>★</b><span><b>${state.marked.length}</b> soal ditandai untuk ditinjau.</span></div></div><div class="modal-actions"><button class="ghost" onclick="closeModal()">Kembali ke ujian</button><button class="primary" onclick="finishExam(false)">Kirim Jawaban</button></div></div>`;document.body.appendChild(backdrop)}

 </main>`;

function openReview(f){filter=f;reviewIndex=1;page='review';const first=filteredReviewQuestions()[0];if(first)reviewIndex=first.n;render()}

 const q=QUESTIONS[reviewIndex-1],choice=state.answers[q.n]||'—',points=getPoints(q,choice==='—'?null:choice),isCorrect=choice===q.answer,idx=list.findIndex(x=>x.n===q.n);

 <section class="review-v3-main review-v4-main"><div class="review-score-strip"><div class="review-number-v3"><span>SOAL</span><b>${String(q.n).padStart(2,'0')}</b><small>${q.section}</small></div><div class="review-result-v3"><div><small>Jawaban kamu</small><b>${choice}</b></div><div><small>Kunci jawaban</small><b>${q.answer}</b></div><div><small>Skor</small><b>${points}/5</b></div></div><span class="review-state-v3 ${isCorrect?'correct':''}">${q.section==='TKP'?(points===5?'Skor tertinggi':'Skor '+points):(isCorrect?'Benar':'Belum tepat')}</span></div>

document.addEventListener('keydown',function(e){
 if(e.key==='Escape'){closeImage();document.getElementById('questionNavModal')?.remove();return;}
 if(page!=='exam'||document.getElementById('imageViewer')||document.getElementById('questionNavModal')||document.querySelector('.modal-backdrop'))return;

function sectionTitle(sec){return sec==='TWK'?'Tes Wawasan Kebangsaan':sec==='TIU'?'Tes Intelegensia Umum':'Tes Karakteristik Pribadi'}
function topicLabel(topic){let t=String(topic||'').replace(/^(?:TWK|TIU|TKP)\s*[·:]\s*/,'');const m=t.match(/^(Verbal|Numerik|Figural)\s*[·:]\s*(.*)$/);return m?`${m[1]} (${m[2]})`:t}
function navSection(sec){
 const arr=sectionQuestions(sec),count=arr.filter(q=>!!state.answers[q.n]).length;
 return `<div class="nav-section-v3 cat-nav-section"><div class="nav-section-title-v3"><div><b>${sectionTitle(sec)}</b><small>No. ${arr[0].n}–${arr[arr.length-1].n}</small></div><span>${count}/${arr.length}</span></div><div class="nav-grid-v3">${arr.map(q=>`<button aria-label="Soal ${q.n}" class="nav-num-v3 ${state.answers[q.n]?'answered':''} ${state.marked.includes(q.n)?'marked':''} ${current===q.n?'current':''}" onclick="goQuestion(${q.n})">${q.n}</button>`).join('')}</div></div>`;
}
function renderStimulus(q){
 let out='<div class="question-v4-content">';
 if(q.prompt)out+=`<div class="question-v4-prompt">${escapeHTML(q.prompt).replace(/\n/g,'<br>')}</div>`;
 if(q.table)out+=`<div class="native-table-wrap"><table class="native-stimulus-table">${q.table.headers?.length?`<thead><tr>${q.table.headers.map(h=>`<th>${escapeHTML(h)}</th>`).join('')}</tr></thead>`:''}<tbody>${q.table.rows.map(row=>`<tr>${row.map(cell=>`<td>${escapeHTML(cell)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
 if(q.conditions?.length)out+=`<ul class="question-v4-conditions">${q.conditions.map(c=>`<li>${escapeHTML(c)}</li>`).join('')}</ul>`;
 if(q.diagram)out+=`<figure class="question-v4-diagram"><img src="${q.diagram}" alt="Stimulus figural soal ${q.n}" onclick="openImage('${q.diagram}','Stimulus soal ${q.n}')"></figure>`;
 return out+'</div>';
}
function renderExamOptions(q,choice){return `<div class="choice-v3-grid choice-v4-list">${q.options.map((opt,i)=>{const letter=LETTERS[i],selected=choice===letter;return `<button type="button" class="choice-v3 ${selected?'selected':''}" aria-pressed="${selected}" onclick="choose('${letter}')"><span class="choice-letter">${letter}</span><span class="choice-copy">${escapeHTML(opt)}</span>${selected?'<span class="choice-selected-tag">Dipilih</span>':''}</button>`}).join('')}</div>`}
function renderReviewOptions(q,choice){return `<div class="review-options-v4">${q.options.map((opt,i)=>{const letter=LETTERS[i],selected=choice===letter,correct=letter===q.answer,score=q.points?.[i]??0;return `<div class="review-option-v4 ${selected?'is-selected':''} ${correct?'is-correct':''}"><span class="choice-letter">${letter}</span><span class="choice-copy">${escapeHTML(opt)}</span><span class="review-option-tags">${correct?'<span class="review-correct-tag">✓ Benar</span>':''}${selected&&!correct?'<span class="review-selected-tag">Jawaban Anda</span>':''}<span class="review-option-tag">${score} poin</span></span></div>`}).join('')}</div>`}
function renderExplanation(text,q){
 const value=String(text||'');const pieces=value.split('[[TABLE]]');
 const renderBlocks=(str)=>str.split(/\n{2,}/).map(x=>x.trim()).filter(Boolean).map(block=>{
   const lines=block.split('\n').map(x=>x.trim()).filter(Boolean);
   if(lines.length>1&&lines.every(x=>/^(?:[•·▪-])\s*/.test(x)))return `<ul class="explanation-bullets">${lines.map(x=>`<li>${escapeHTML(x.replace(/^(?:[•·▪-])\s*/,''))}</li>`).join('')}</ul>`;
   return `<p>${escapeHTML(block).replace(/\n/g,'<br>')}</p>`;
 }).join('');
 let out=renderBlocks(pieces[0]||'');
 if(q?.explanationTable){const t=q.explanationTable;out+=`<div class="explanation-table-wrap"><table class="explanation-table"><thead><tr>${t.headers.map(h=>`<th>${escapeHTML(h)}</th>`).join('')}</tr></thead><tbody>${t.rows.map(row=>`<tr>${row.map(cell=>`<td>${escapeHTML(cell)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`}
 if(pieces.length>1)out+=renderBlocks(pieces.slice(1).join(' '));
 return out;
}

 app.innerHTML=header()+`<main class="v3-page cat-results-page"><div class="cat-results-heading"><div><span class="v3-kicker">HASIL & EVALUASI</span><h1>Try Out Bimbel Batch 4 - 2026 #2</h1><p>Ringkasan hasil pengerjaan simulasi CAT SKD.</p></div><div class="cat-results-tabs"><button class="active">Statistik</button><button onclick="openReview('ALL')">Pembahasan</button><button onclick="openRecommendations()">Rekomendasi</button></div></div><section class="cat-score-hero ${passed?'passed':'not-passed'}"><div><span class="cat-score-kicker">SKOR TOTAL</span><h2>${r.total}<small> / 550</small></h2><p>${passed?'Seluruh ambang nilai acuan tercapai.':'Masih ada ambang nilai yang perlu ditingkatkan.'}</p><div class="cat-score-meta"><span>${r.answered}/110 terjawab</span><span>${r.unanswered} belum dijawab</span><span>${state.marked.length} ditandai</span></div></div><div class="cat-score-status"><span>${passed?'✓':'!'}</span><b>${passed?'Memenuhi ambang':'Belum lulus ambang'}</b></div></section><div class="results-v3-grid">${['TWK','TIU','TKP'].map(sec=>`<article class="result-v3-card"><div class="result-v3-top"><b>${sectionTitle(sec)}</b><span>${r.out[sec]>=PASS[sec]?'Mencapai ambang':'Di bawah ambang'}</span></div><div class="result-v3-score">${r.out[sec]}<small> / ${MAX[sec]}</small></div><div class="v3-progress"><span style="width:${Math.min(100,r.out[sec]/MAX[sec]*100)}%"></span></div><small class="result-v3-pass">Ambang acuan: ${PASS[sec]}</small></article>`).join('')}</div><section class="cat-topic-analysis"><div class="cat-section-title"><div><span class="v3-kicker">ANALISIS PER MATERI</span><h2>Performa setiap materi</h2></div><span>Skor dibandingkan nilai maksimum</span></div><div class="cat-topic-grid">${topics.map(t=>`<article class="cat-topic-card"><div><b>${escapeHTML(topicLabel(t.topic))}</b><small>${sectionTitle(t.section)} · ${t.count} soal</small></div><strong>${t.score}/${t.max}</strong><div class="cat-topic-track"><span style="width:${t.max?100*t.score/ ead"><span>PEMBAHASAN</span><h2>Penjelasan jawaban</h2></div><div class="explanation-v4-body">${renderExplanation(q.explanation,q)}</div></article><div class="review-v3-pager"><button class="v3-outline" onclick="reviewMove(-1)" ${idx===0?'disabled':''}>← Sebelumnya</button><span>${idx+1} / ${list.length}</span><button class="v3-primary" onclick="reviewMove(1)" ${idx===list.length-1?'disabled':''}>Selanjutnya →</button></div></section></div></main>`;

function v29Dialog(o){v29Close();const token=++v29DialogToken;v29PreviousFocus=document.activeElement;v29OldOverflow=document.body.style.overflow;document.body.style.overflow='hidden';app.setAttribute('inert','');const el=document.createElement('div');el.id='v29Dialog';el.className='modal-backdrop v29-overlay';el.innerHTML=`<section class="v29-dialog" role="dialog" aria-modal="true" aria-labelledby="v29DialogTitle" aria-describedby="v29DialogDesc"><div class="v29-dialog-top"><span class="v29-modal-icon">${v29Icon(o.icon)}</span><button type="button" class="v29-close" aria-label="Tutup dialog">×</button></div><span class="v29-eyebrow">${escapeHTML(o.eyebrow||'INFORMASI')}</span><h2 id="v29DialogTitle">${escapeHTML(o.title)}</h2><p id="v29DialogDesc" class="v29-dialog-desc">${escapeHTML(o.message)}</p><div class="v29-dialog-body">${o.body||''}</div><p class="v29-dialog-feedback" role="status" aria-live="polite" hidden></p><div class="v29-dialog-actions">${o.cancel?`<button type="button" class="v29-btn v29-cancel">${escapeHTML(o.cancel)}</button>`:''}<button type="button" class="v29-btn v29-main v29-accept">${escapeHTML(o.accept||'Mengerti')}</button></div></section>`;document.body.append(el);const accept=el.querySelector('.v29-accept'),cancel=el.querySelector('.v29-cancel'),x=el.querySelector('.v29-close'),feedback=el.querySelector('.v29-dialog-feedback');x.onclick=()=>v29Close();if(cancel)cancel.onclick=()=>v29Close();accept.onclick=async()=>{if(!o.action){v29Close();return}if(accept.disabled)return;accept.disabled=true;x.disabled=true;if(cancel)cancel.disabled=true;try{const result=o.action();if(result&&typeof result.then==='function'){accept.textContent='Memuat materi…';feedback.hidden=false;feedback.textContent='Menyiapkan materi soal agar waktu ujian tidak terbuang.';await result}}catch(e){if(token!==v29DialogToken||!el.isConnected)return;feedback.hidden=false;feedback.classList.add('is-error');feedback.textContent='Materi belum dapat dimuat. Jika membuka index.h async function v29Preload(keys){const ids=[...new Set(keys.map(k=>V28_INDEX[k]))];if(!ids.length||ids.some(i=>!i))throw Error('Aset tidak terdaftar');let timeout;try{await Promise.race([(async()=>{const packs=await Promise.all(ids.map(v28Load));await Promise.all(keys.map(async k=>{const pack=packs[ids.indexOf(V28_INDEX[k])];const img=new Image();img.src=v28URL(pack,k);await img.decode();if(!img.naturalWidth)throw Error('Gambar tidak valid')}))})(),new Promise((_,reject)=>{timeout=setTimeout(()=>reject(Error('Batas waktu pemuatan')),30000)})]);}finally{clearTimeout(timeout)}}

/* V29 UHD: non-generative display raster, original pixels and crop metadata unchanged. */
function v29UhdDimensions(key,w,h){
 const crop=OPTION_CROPS[key];
 // Full-width questions and explanations: 3840 px wide. For tryout answer strips, the existing content viewport is 3840 px wide.
 // Training answer strips are already tight crops; their widths remain proportional to a 1801 px original content panel.
 const trainingOption=/^latihan\/p\d+q\d+-[1-5]\.webp$/.test(key);
 const target=crop?Math.ceil(3840*w/crop[2]):trainingOption?Math.round(3840*w/1801):3840;
 const width=Math.max(w,target),height=Math.max(h,Math.round(width*h/w));return [width,height];
}
function v29UhdRender(img){
 if(!img.isConnected||img.dataset.v29Uhd)return;
 const w=img.naturalWidth,h=img.naturalHeight,key=img.dataset.compact;
 if(!w||!h)return;
 const [rw,rh]=v29UhdDimensions(key,w,h);let canvas;
 try{
  canvas=document.createElement('canvas');canvas.width=rw;canvas.height=rh;
  const ctx=canvas.getContext('2d',{alpha:false});if(!ctx)throw Error('Canvas tidak tersedia');
  ctx.fillStyle='#fff';ctx.fillRect(0,0,rw,rh);ctx.imageSmoothingEnabled=true;ctx.imageSmoothingQuality='high';ctx.drawImage(img,0,0,rw,rh);
  if(ctx.isContextLost&&ctx.isContextLost())throw Error('Canvas tidak tersedia');
  if(!img.isConnected){canvas.width=0;canvas.height=0;return;}
  canvas.className=(img.className+' v29-uhd').trim();canvas.style.aspectRatio=w+'/'+h;canvas.setAttribute('role','img');canvas.setAttribute('aria-label',img.alt);canvas.dataset.uhdKey=key;canvas.dataset.uhdSize=rw+'x'+rh;
  canvas.addEventListener('contextlost',()=>{img.classList.remove('v29-uhd-source');img.removeAttribute('aria-hidden');img.dataset.v29Uhd='fallback';canvas.remove()},{once:true});
  img.after(canvas);img.classList.add('v29-uhd-source');img.setAttribute('aria-hidden','true');img.dataset.v29Uhd='ready';
 }catch(e){if(canvas){canvas.remove();canvas.width=0;canvas.height=0;}img.classList.remove('v29-uhd-source');img.removeAttribute('aria-hidden');img.dataset.v29Uhd='fallback'}
}
function v29UhdDispose(records){for(const record of records)for(const node of record.removedNodes){if(node.nodeType!==1)continue;const c=node.matches('canvas.v29-uhd')?[node]:[...node.querySelectorAll('canvas.v29-uhd')];for(const el of c)if(!el.isConnected){el.width=0;el.height=0}}}

new MutationObserver(records=>{v29UhdDispose(records);hydrateAllHD()}).observe(app,{childList:true,subtree:true});if(qaSession.getItem('patungan_skd_login')){page=state.submitted?'results':(state.startAt?'exam':'dashboard')}render();hydrateAllHD();
</script>

<script id="v31-dashboard-utilities">
(()=>{
'use strict';
const safeDate=()=>new Date().toISOString().slice(0,10);
function injectResults(){
 const actions=document.querySelector('.cat-results-page .results-v3-actions');if(!actions||document.getElementById('v30ResultTools'))return;
 const wrap=document.createElement('div');wrap.id='v30ResultTools';wrap.className='v30-results-actions';
 wrap.innerHTML='<button class="v3-outline" type="button" onclick="v30ExportCSV()">↓ Unduh rekap CSV</button><button class="v3-outline" type="button" onclick="v30PrintResult()">▤ Cetak / Simpan PDF</button>';
 actions.insertAdjacentElement('afterend',wrap);
}
function injectReviewSearch(){
 const side=document.querySelector('.review-v3-side');if(!side||document.getElementById('v30ReviewSearch'))return;
 const block=document.createElement('div');block.id='v30ReviewSearch';block.className='v30-review-search';
 block.innerHTML='<label for="v30SearchInput">Cari nomor atau materi</label><input class="v30-search" id="v30SearchInput" type="search" placeholder="Contoh: 25, nasionalisme, numerik…" autocomplete="off"><div class="v30-search-count" id="v30SearchCount" aria-live="polite"></div>';
 const list=side.querySelector('.review-list-head');if(list)list.insertAdjacentElement('beforebegin',block);else side.append(block);
 const input=block.querySelector('input');input.addEventListener('input',()=>{
  const term=input.value.trim().toLocaleLowerCase('id');let shown=0;
  side.querySelectorAll('.review-nav-grid button').forEach(btn=>{
   const n=Number(btn.textContent.trim()),q=QUESTIONS[n-1];
   const hay=[n,q?.section,q?.topic,q?.prompt,...(q?.options||[])].join(' ').toLocaleLowerCase('id');
   const match=!term||hay.includes(term);btn.hidden=!match;if(match)shown++;
  });
  const count=block.querySelector('#v30SearchCount');if(count)count.textContent=`${shown} nomor cocok · pencarian berdasarkan nomor, bagian, topik, dan teks yang tersedia`;
 });
 input.dispatchEvent(new Event('input'));
}
function downloadBlob(name,blob){const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;a.style.display='none';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500)}
window.v30ExportCSV=function(){
 if(!state.submitted){v29Dialog({icon:'info',title:'Hasil belum tersedia',message:'Selesaikan tryout terlebih dahulu sebelum mengunduh rekap nilai.',accept:'Mengerti'});return}
 const r=calculate(),rows=[['Nomor','Bagian','Materi','Jawaban Peserta','Kunci','Skor','Skor Maksimal','Status','Ditandai']];
 for(const d of r.details){const q=d.q;rows.push([q.n,q.section,topicLabel(q.topic),d.choice||'',q.answer,d.points,5,d.choice?(d.choice===q.answer?'Benar':'Belum tepat'):'Kosong',state.marked.includes(q.n)?'Ya':'Tidak'])}
 rows.push([]);rows.push(['TOTAL',r.total,'/550']);rows.push(['TWK',r.out.TWK,'/150']);rows.push(['TIU',r.out.TIU,'/175']);rows.push(['TKP',r.out.TKP,'/225']);
 const csv='\ufeff'+rows.map(row=>row.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\r\n');downloadBlob(`rekap-tryout-skd-${safeDate()}.csv`,new Blob([csv],{type:'text/csv;charset=utf-8'}));
};
window.v30PrintResult=function(){if(!state.submitted){v29Dialog({icon:'info',title:'Hasil belum tersedia',message:'Selesaikan tryout terlebih dahulu untuk mencetak hasil.',accept:'Mengerti'});return}window.print()};
let navFilter='ALL';
function renderQuestionNav(){
 document.getElementById('questionNavModal')?.remove();const el=document.createElement('div');el.className='question-nav-modal-v3';el.id='questionNavModal';
 const filters=[['ALL','Semua'],['UNANSWERED','Belum dijawab'],['MARKED','Ditandai']];
 const sections=['TWK','TIU','TKP'].map(sec=>{const all=sectionQuestions(sec),arr=all.filter(q=>navFilter==='ALL'?true:navFilter==='UNANSWERED'?!state.answers[q.n]:state.marked.includes(q.n));return `<div class="nav-section-v3"><div class="nav-section-title-v3"><b>${sec}</b><span>${arr.length}/${all.length} ditampilkan</span></div>${arr.length?`<div class="nav-grid-v3">${arr.map(q=>`<button aria-label="Soal ${q.n}" class="nav-num-v3 ${state.answers[q.n]?'answered':''} ${state.marked.includes(q.n)?'marked':''} ${current===q.n?'current':''}" onclick="goQuestion(${q.n})">${q.n}</button>`).join('')}</div>`:'<div class="v30-nav-empty">Tidak ada soal pada filter ini.</div>'}</div>`}).join('');
 el.innerHTML=`<div class="question-nav-sheet"><div class="sheet-head"><b>Daftar soal</b><button type="button" aria-label="Tutup daftar soal" onclick="document.getElementById('questionNavModal')?.remove()">✕</button></div><div class="sheet-progress">${answeredCount()} / 110 terjawab · ${state.marked.length} ditandai</div><div class="v30-nav-filters">${filters.map(([id,label])=>`<button type="button" class="v30-nav-filter ${navFilter===id?'active':''}" aria-pressed="${navFilter===id}" onclick="v30SetNavFilter('${id}')">${label}</button>`).join('')}</div>${sections}<div class="nav-v3-legend"><span><i class="legend-answered"></i> Terjawab</span><span><i class="legend-marked"></i> Ditandai</span></div></div>`;
 el.addEventListener('click',e=>{if(e.target===el)el.remove()});document.body.appendChild(el);
}
window.v30SetNavFilter=function(value){navFilter=['ALL','UNANSWERED','MARKED'].includes(value)?value:'ALL';renderQuestionNav()};
window.openQuestionNav=renderQuestionNav;
const baseResults=resultsView;resultsView=function(){baseResults();injectResults()};
const baseReview=reviewView;reviewView=function(){baseReview();injectReviewSearch()};
if(typeof page!=='undefined'&&page==='results'&&qaSession.getItem('patungan_skd_login'))resultsView();
})();
</script>
