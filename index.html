 sama. Berapa banyak keranjang anyaman yang dapat dihasilkan oleh 6 pekerja dalam waktu 5 hari?\n(1) Sebanyak 4 pekerja dapat menghasilkan 12 keranjang dalam 3 hari.\n(2) Dalam 1 hari, 4 pekerja dapat menghasilkan 4 keranjang.","options":["Pernyataan (1) SAJA cukup untuk menjawab pertanyaan, tetapi pernyataan (2) SAJA tidak cukup.","Pernyataan (2) SAJA cukup untuk menjawab pertanyaan, tetapi pernyataan (1) SAJA tidak cukup.","Kedua pernyataan BERSAMA-SAMA cukup untuk menjawab pertanyaan, tetapi masing-masing pernyataan SAJA tidak cukup.","Masing-masing pernyataan (1) dan (2) SAJA sudah cukup.","Pernyataan (1) dan pernyataan (2) tidak cukup."],"answer":"D","points":[0,0,0,5,0],"explanation":"Pernyataan (1):\n4 pekerja × 3 hari = 12 hari-orang menghasilkan 12 keranjang.\nBerarti 1 hari-orang menghasilkan: 12 ÷ 12 = 1 keranjang.\nUntuk 6 pekerja selama 5 hari: 6 × 5 × 1 = 30 keranjang.\n→ CUKUP. Pernyataan (2):\n4 pekerja menghasilkan 4 keranjang dalam 1 hari.\nBerarti 1 pekerja dalam 1 hari menghasilkan: 4 ÷ 4 = 1 keranjang.\nUntuk 6 pekerja selama 5 hari: 6 × 5 × 1 = 30 keranjang.\n→ CUKUP. Jadi, masing-masing pernyataan (1) dan (2) SAJA sudah cukup.","source":"AyoCPNS"},{"n":52,"section":"TIU","topic":"Numerik · Soal Cerita","prompt":"Sebuah mesin percetakan bekerja dengan kemampuan yang sama. Berapa jumlah lembar yang dapat dicetak oleh 3 mesin dalam waktu 6 jam? (1) Sebanyak 2 mesin dapat mencetak 600 lembar dalam 4 jam. (2) Setiap mesin dapat mencetak 75 lembar per jam.","options":["Pernyataan (1) SAJA cukup untuk menjawab pertanyaan, tetapi pernyataan (2) SAJA tidak cukup.","Pernyataan (2) SAJA cukup untuk menjawab pertanyaan, tetapi pernyataan (1) SAJA tidak cukup.","Kedua pernyataan BERSAMA-SAMA cukup untuk menjawab pertanyaan, tetapi masing-masing pernyataan SAJA tidak cukup.","Masing-masing pernyataan (1) dan (2) SAJA sudah cukup.","Pernyataan (1) dan pernyataan (2) tidak cukup."],"answer":"D","points":[0,0,0,5,0],"explanation":"Pernyataan (1):\n2 mesin × 4 jam = 8 mesin-jam menghasilkan 600 lembar.\nProduksi per mesin per jam: 600 ÷ 8 = 75 lembar.\nUntuk 3 mesin selama 6 jam: 3 × 6 × 75 = 1.350 lembar.\n→ CUKUP. Pernyataan (2):\nSetiap mesin mencetak 75 lembar per jam.\nUntuk 3 mesin selama 6 jam: 3 × 6 × 75 = 1.350 lembar.\n→ CUKUP. Jadi, masing-masing pernyataan (1) dan (2) SAJA sudah cukup.","source":"AyoCPNS"},{"n":53,"section":"TIU","topic":"Numerik · Soal Cerita","prompt":"Sebuah proyek pembangunan jembatan direncanakan selesai dalam waktu 50 hari. Setelah bekerja selama 15 hari, proyek tersebut terhenti selama 10 hari karena kendala teknis. Berapa banyak tambahan pekerja yang diperlukan agar proyek tetap selesai tepat waktu? (1) Pada awal proyek, terdapat 20 pekerja yang bekerja dengan kemampuan sama. (2) Setelah bekerja selama 15 hari, 30% dari keseluruhan pekerjaan telah diselesaikan.","options":["Pernyataan (1) SAJA cukup untuk menjawab pertanyaan, tetapi pernyataan (2) SAJA tidak cukup.","Pernyataan (2) SAJA cukup untuk menjawab pertanyaan, tetapi pernyataan (1) SAJA tidak cukup.","Kedua pernyataan BERSAMA-SAMA cukup untuk menjawab pertanyaan, tetapi masing-masing pernyataan SAJA tidak cukup.","Masing-masing pernyataan (1) dan (2) SAJA sudah cukup.","Pernyataan (1) dan pernyataan (2) tidak cukup."],"answer":"C","points":[0,0,5,0,0],"explanation":"Waktu yang sudah digunakan = 15 hari.\nWaktu terhenti = 10 hari.\nSisa waktu: 50 − 15 − 10 = 25 hari. Pernyataan (1): Diketahui 20 pekerja, tetapi persentase pekerjaan yang telah selesai belum diketahui.\n→ TIDAK CUKUP. Pernyataan (2): Diketahui 30% pekerjaan telah selesai, sehingga sisa pekerjaan 70%. Namun, jumlah pekerja awal belum diketahui sehingga kebutuhan pekerja belum dapat ditentukan.\n→ TIDAK CUKUP. Gabungan (1) dan (2):\nTotal pekerjaan dalam satuan pekerja-hari: 20 × 15 = 300 pekerja-hari.\n300 pekerja-hari = 30% pekerjaan.\nMaka total pekerjaan: 300 ÷ 30% = 1.000 pekerja-hari.\nSisa pekerjaan: 70% × 1.000 = 700 pekerja-hari.\nSisa waktu = 25 hari.\nPekerja yang dibutuhkan: 700 ÷ 25 = 28 pekerja.\nPekerja tambahan: 28 − 20 = 8 pekerja. Jadi, kedua pernyataan harus digunakan bersama-sama.","source":"AyoCPNS"},{"n":54,"section":"TIU","topic":"Numerik · Soal Cerita","prompt":"Budi menjual sebuah ponsel dan mengalami kerugian. Berapakah harga beli ponsel tersebut? (1) Ponsel tersebut dijual dengan harga Rp2.100.000. (2) Budi mengalami kerugian sebesar 30% dari harga beli.","options":["Pernyataan (1) SAJA cukup untuk menjawab pertanyaan, tetapi pernyataan (2) SAJA tidak cukup.","Pernyataan (2) SAJA cukup untuk menjawab pertanyaan, tetapi pernyataan (1) SAJA tidak cukup.","Kedua pernyataan BERSAMA-SAMA cukup untuk menjawab pertanyaan, tetapi masing-masing pernyataan SAJA tidak cukup.","Masing-masing pernyataan (1) dan (2) SAJA sudah cukup.","Pernyataan (1) dan pernyataan (2) tidak cukup."],"answer":"C","points":[0,0,5,0,0],"explanation":"Pernyataan (1):\nHarga jual = Rp2.100.000, tetapi persentase kerugian belum diketahui.\n→ TIDAK CUKUP. Pernyataan (2):\nKerugian = 30% dari harga beli, tetapi harga jual belum diketahui.\n→ TIDAK CUKUP. Gabungan (1) dan (2):\nJika rugi 30%, maka harga jual merupakan 100% − 30% = 70% dari harga beli.\nRp2.100.000 = 70% × harga beli.\nHarga beli = Rp2.100.000 ÷ 70% = Rp3.000.000. Jadi, kedua pernyataan harus digunakan bersama-sama.\nJawaban: C.","source":"AyoCPNS"},{"n":55,"section":"TIU","topic":"Numerik · Soal Cerita","prompt":"Sebuah bus berangkat dari Kota A pukul 07.00 dan sebuah mobil berangkat kemudian melalui rute yang sama. Pada pukul berapa mobil menyusul bus? (1) Bus berangkat pukul 07.00 dengan kecepatan 50 km/jam, sedangkan mobil berangkat pukul 08.00 dengan kecepatan 80 km/jam. (2) Ketika mobil mulai berangkat, bus telah berada 50 km di depan mobil.","options":["Pernyataan (1) SAJA cukup untuk menjawab pertanyaan, tetapi pernyataan (2) SAJA tidak cukup.","Pernyataan (2) SAJA cukup untuk menjawab pertanyaan, tetapi pernyataan (1) SAJA tidak cukup.","Kedua pernyataan BERSAMA-SAMA cukup untuk menjawab pertanyaan, tetapi masing-masing pernyataan SAJA tidak cukup.","Masing-masing pernyataan (1) dan (2) SAJA sudah cukup.","Pernyataan (1) dan pernyataan (2) tidak cukup."],"answer":"A","points":[5,0,0,0,0],"explanation":"Pernyataan (1):\nDiketahui bus berangkat pukul 07.00 dengan kecepatan 50 km/jam dan mobil berangkat pukul 08.00 dengan kecepatan 80 km/jam.\nSaat mobil berangkat, bus sudah memiliki jarak: 50 × 1 = 50 km.\nSelisih kecepatan: 80 − 50 = 30 km/jam.\nWaktu yang diperlukan mobil untuk menyusul: 50 ÷ 30 = 1 jam 40 menit.\nMobil berangkat pukul 08.00, sehingga menyusul pada pukul: 08.00 + 1 jam 40 menit = 09.40.\n→ CUKUP. Pernyataan (2):\nHanya diketahui bahwa ketika mobil mulai berangkat, bus berada 50 km di depan. Namun, kecepatan bus dan mobil tidak diketahui. Tanpa mengetahui selisih kecepatan kedua kendaraan, waktu yang diperlukan untuk menyusul tidak dapat ditentukan.\n→ TIDAK CUKUP. Jadi, pernyataan (1) saja cukup, tetapi pernyataan (2) saja tidak cukup.","source":"AyoCPNS"},{"n":56,"section":"TIU","topic":"Numerik · Soal Cerita","prompt":"Kota A dan Kota B berjarak 300 km. Sebuah bus berangkat dari Kota A menuju Kota B, sedangkan sebuah mobil berangkat dari Kota B menuju Kota A. Pada pukul berapa kedua kendaraan tersebut berpapasan? (1) Bus berangkat pukul 07.00 dengan kecepatan 60 km/jam, sedangkan mobil berangkat pukul 08.00 dengan kecepatan 90 km/jam. (2) Ketika mobil mulai berangkat, bus telah menempuh 60 km dari Kota A.","options":["Pernyataan (1) SAJA cukup untuk menjawab pertanyaan, tetapi pernyataan (2) SAJA tidak cukup.","Pernyataan (2) SAJA cukup untuk menjawab pertanyaan, tetapi pernyataan (1) SAJA tidak cukup.","Kedua pernyataan BERSAMA-SAMA cukup untuk menjawab pertanyaan, tetapi masing-masing pernyataan SAJA tidak cukup.","Masing-masing pernyataan (1) dan (2) SAJA sudah cukup.","Pernyataan (1) dan pernyataan (2) tidak cukup."],"answer":"A","points":[5,0,0,0,0],"explanation":"Pernyataan (1):\nSaat mobil berangkat pukul 08.00, bus telah menempuh: 60 × 1 = 60 km.\nSisa jarak: 300 − 60 = 240 km.\nKecepatan relatif: 60 + 90 = 150 km/jam.\nWaktu sampai berpapasan: 240 ÷ 150 = 1,6 jam = 1 jam 36 menit.\nJadi, kendaraan berpapasan pada: 08.00 + 1 jam 36 menit = 09.36.\n→ CUKUP. Pernyataan (2):\nDiketahui ketika mobil mulai berangkat, bus sudah berjarak 60 km dari Kota A. Namun, waktu keberangkatan dan kecepatan kedua kendaraan belum diketahui jika hanya menggunakan pernyataan (2).\n→ TIDAK CUKUP.","source":"AyoCPNS"},{"n":57,"section":"TIU","topic":"Numerik · Soal Cerita","prompt":"Tabel berikut menunjukkan nilai tiga mata pelajaran yang diuji dalam tes masuk perguruan tinggi negeri untuk enam siswa. Setiap siswa harus memenuhi nilai minimum pada setiap mata pelajaran. Jika hanya tersedia dua kuota, siapakah yang berhak lolos berdasarkan jumlah nilai tertinggi?","options":["Andi dan Beni","Citra dan Andi","Citra dan Dinda","Beni dan Eko","Andi dan Eko"],"answer":"B","points":[0,5,0,0,0],"explanation":"Langkah 1: Menentukan siswa yang memenuhi seluruh syarat. [[TABLE]] Siswa yang memenuhi ketiga nilai minimum adalah Andi, Beni, Citra, dan Eko. Langkah 2: Mengurutkan nilai total masing-masing siswa.\nCitra = 79 + 83 + 86 = 248.\nAndi = 80 + 82 + 85 = 247.\nBeni = 82 + 80 + 84 = 246.\nEko = 80 + 81 + 85 = 246. Karena hanya tersedia 2 kuota, siswa dengan nilai total tertinggi adalah Citra dan Andi.","source":"AyoCPNS","table":{"headers":["Nama","Matematika","Fisika","Bahasa Inggris"],"rows":[["Andi","80","82","85"],["Beni","82","80","84"],["Citra","79","83","86"],["Dinda","85","78","82"],["Eko","80","81","85"],["Fani","84","79","88"]]},"conditions":["Matematika: minimal 78","Fisika: minimal 80","Bahasa Inggris: minimal 82","Kuota tersedia: 2 siswa"],"explanationTable":{"headers":["Nama","Matematika","Fisika","Bahasa Inggris","Status"],"rows":[["Andi","80 ✓","82 ✓","85 ✓","Lolos syarat"],["Beni","82 ✓","80 ✓","84 ✓","Lolos syarat"],["Citra","79 ✓","83 ✓","86 ✓","Lolos syarat"],["Dinda","85 ✓","78 ✕","82 ✓","Tidak lolos"],["Eko","80 ✓","81 ✓","85 ✓","Lolos syarat"],["Fani","84 ✓","79 ✕","88 ✓","Tidak lolos"]]}},{"n":58,"section":"TIU","topic":"Numerik · Soal Cerita","prompt":"Sebuah perusahaan jasa pengiriman harus mengangkut minimal 50 ton barang dalam satu perjalanan. Perusahaan dapat menyewa beberapa jenis kendaraan berikut. Tentukan kombinasi kendaraan yang memenuhi seluruh ketentuan dengan biaya sewa paling hemat.","options":["3A + 1C","2B + 1C","1A + 2C","1B + 2C","2A + 1B + 1C"],"answer":"B","points":[0,5,0,0,0],"explanation":"A. 3A + 1C\nKapasitas = (3 × 12) + 20 = 56 ton.\nBiaya = (3 × Rp500.000) + Rp800.000 = Rp2.300.000.\n→ Memenuhi syarat, tetapi bukan yang paling hemat. B. 2B + 1C\nKapasitas = (2 × 15) + 20 = 50 ton.\nBiaya = (2 × Rp600.000) + Rp800.000 = Rp2.000.000.\nJumlah B = 2 dan jumlah C = 1, sehingga B ≤ 2C terpenuhi.\n→ Memenuhi seluruh syarat dengan biaya paling rendah. C. 1A + 2C\nKapasitas = 12 + (2 × 20) = 52 ton.\nBiaya = Rp500.000 + (2 × Rp800.000) = Rp2.100.000.\n→ Memenuhi syarat, tetapi lebih mahal daripada B. D. 1B + 2C\nKapasitas = 15 + 40 = 55 ton.\nBiaya = Rp600.000 + Rp1.600.000 = Rp2.200.000.\n→ Memenuhi syarat, tetapi lebih mahal. E. 2A + 1B + 1C\nKapasitas = 24 + 15 + 20 = 59 ton.\nBiaya = Rp1.000.000 + Rp600.000 + Rp800.000 = Rp2.400.000.\n→ Memenuhi syarat, tetapi paling mahal di antara kombinasi yang memenuhi ketentuan. Jadi, kombinasi paling hemat adalah 2 kendaraan B dan 1 kendaraan C.","source":"AyoCPNS","table":{"headers":["Jenis kendaraan","Kapasitas","Biaya sewa"],"rows":[["A","12 ton","Rp500.000"],["B","15 ton","Rp600.000"],["C","20 ton","Rp800.000"],["D","25 ton","Rp1.000.000"]]},"conditions":["Total kapasitas minimal 50 ton.","Wajib menggunakan minimal 1 kendaraan C.","Jumlah kendaraan B tidak boleh lebih dari 2 kali jumlah kendaraan C.","Pilih kombinasi dengan biaya sewa paling hemat."]},{"n":59,"section":"TIU","topic":"Figural · Ketidaksamaan","prompt":"","options":["OpsiA","OpsiB","OpsiC","OpsiD","OpsiE"],"answer":"D","points":[0,0,0,5,0],"explanation":"Perhatikan spiral pada opsi D berbeda dengan spiral pada opsi lainnya yang arahnya sesuai dengan jarum jam.","source":"AyoCPNS","diagram":"assets/diagrams/d059.jpg"},{"n":60,"section":"TIU","topic":"Figural · Ketidaksamaan","prompt":"","options":["OpsiA","OpsiB","OpsiC","OpsiD","OpsiE"],"answer":"C","points":[0,0,5,0,0],"explanation":"Jawaban: C. Opsi A, B, D, dan E memiliki bangun yang berjumlah secara berurutan yakni 2, 5, 3, 7 yang merupakan bilangan prima. Sedangkan opsi C berjumlah 4, bukan bilangan prima.","source":"AyoCPNS","diagram":"assets/diagrams/d060.jpg"},{"n":61,"section":"TIU","topic":"Figural · Serial","prompt":"","options":["OpsiA","OpsiB","OpsiC","OpsiD","OpsiE"],"answer":"D","points":[0,0,0,5,0],"explanation":"Jawaban D. Kumpulan abjad berpindah posisi berlawanan arah jarum jam. Abjad di bagian paling kanan berpindah ke bagian paling kiri.","source":"AyoCPNS","diagram":"assets/diagrams/d061.jpg"},{"n":62,"section":"TIU","topic":"Figural · Serial","prompt":"","options":["OpsiA","OpsiB","OpsiC","OpsiD","OpsiE"],"answer":"E","points":[0,0,0,0,5],"explanation":"Jawaban E. Jumlah sisi bangun bertambah 3.","source":"AyoCPNS","diagram":"assets/diagrams/d062.jpg"},{"n":63,"section":"TIU","topic":"Figural · Analogi Gambar","prompt":"","options":["OpsiA","OpsiB","OpsiC","OpsiD","OpsiE"],"answer":"A","points":[5,0,0,0,0],"explanation":"Pola gambar mengalami rotasi 90 derajat berlawanan arah jarum jam. Pola tersebut sesuai dengan gambar A.","source":"AyoCPNS","diagram":"assets/diagrams/d063.jpg"},{"n":64,"section":"TIU","topic":"Figural · Analogi Gambar","prompt":"","options":["OpsiA","OpsiB","OpsiC","OpsiD","OpsiE"],"answer":"A","points":[5,0,0,0,0],"explanation":"Pola gambar mengalami rotasi 90 derajat berlawanan arah jarum jam. Pola tersebut sesuai dengan gambar A.","source":"AyoCPNS","diagram":"assets/diagrams/d064.jpg"},{"n":65,"section":"TIU","topic":"Figural · Analogi Gambar","prompt":"","options":["OpsiA","OpsiB","OpsiC","OpsiD","OpsiE"],"answer":"C","points":[0,0,5,0,0],"explanation":"Jawaban C. Setiap bangun harus muncul sebanyak 3 kali dengan pasangan yang berbeda.","source":"AyoCPNS","diagram":"assets/diagrams/d065.jpg"},{"n":66,"section":"TKP","topic":"Profesionalisme","prompt":"Seorang penyiar radio sedang membawakan siaran langsung bersama seorang narasumber. Di tengah pembahasan, narasumber beberapa kali menyampaikan informasi yang tidak sesuai dengan data resmi yang dimiliki stasiun radio. Siaran berlangsung secara langsung dan pendengar mulai mengirimkan pertanyaan mengenai informasi tersebut. Sikap penyiar sebaiknya...","options":["Membiarkan narasumber menyelesaikan penjelasannya terlebih dahulu, kemudian memberikan klarifikasi sebelum pembahasan berlanjut.","Menyampaikan data yang benar kepada pendengar setelah meminta izin kepada narasumber untuk meluruskan informasi.","Mengarahkan narasumber melalui pertanyaan agar dapat menjelaskan kembali informasi yang disampaikan berdasarkan data yang benar.","Menghentikan pembahasan sejenak untuk memastikan kembali data yang dimiliki sebelum melanjutkan siaran.","Tetap pada alur pembahasan narasumber sambil memperbaiki arah bahasan sehingga jalannya siaran tetap lancar."],"answer":"C","points":[3,4,5,2,1],"explanation":"C (5 poin) merupakan jawaban terbaik. Penyiar mengarahkan narasumber melalui pertanyaan agar dapat menjelaskan kembali informasi berdasarkan data yang benar. Langkah ini menjaga akurasi informasi yang diterima pendengar tanpa mengambil alih peran narasumber maupun mempermalukannya di siaran langsung. Sebagai moderator, penyiar tetap menjalankan tupoksinya, yaitu mengelola jalannya diskusi sekaligus memastikan informasi yang disampaikan kepada publik tetap dapat dipertanggung jawabkan. Sikap ini mencerminkannilai Kompeten. Akuntabel, dan Harmonis. B (4 poin) menunjukkan tanggung jawab dengan menyampaikan data yang benar kepada pendengar setelah meminta izinkepada narasumber, Langkah ini tetap menjaga akurasi informasi dan menghormati narasumber. Namun, dibandingkan opsi C, penyiar menjadi lebih dominan dalam meluruskan substansi pembahasan, padahal peran utamanya adalah memfasilitasi narasumber untuk menyampaikan informasi. AA(3 poin) menunjukkan penghargaan terhadap narasumber dengan memberikan kesempatan menyelesaikan penjelasannya sebelum memberikan klarifikasi. Akan tetapi, selama penjelasan berlangsung, informasi yang keliru tetap diterima pendengar sehingga risiko kesalahpahaman menjadi lebih besar dibandingkan opsi B dan C. D (2 poin) menunjukkan kehati-hatian dengan memastikan kembali data sebelum melanjutkan siaran. Meskipun bertujuan menjaga akurasi informasi, menghentikan pembahasan dalam siaran langsung berpotensi mengganggualur program, padahal penyiar telah memiliki data resmi sebagaiacuan E (1 poin) merupakan pilihan yang paling kurang tepat. Tetap mengikuti alur pembahasan narasumber sambil berusaha mengarahkan topik memang menjaga kelancaran siaran. Namun, langkah tersebut tidak secara langsung meluruskan informasi yang telah keliru sehingga tujuan utama penyiar untuk menyampaikan informasi yang akurat kepada pendengar belum tercapai.","source":"AyoCPNS"},{"n":67,"section":"TKP","topic":"Profesionalisme","prompt":"Bima bertugas sebagai operator lift di sebuah gedung perkantoran. Saat jam sibuk, salah satu lift mengalami gangguan dan belum dinyatakan aman untuk digunakan. Beberapa pengguna yang terburu-buru mulai memprotes bahkan membentak Bima agar lift segera dioperasikan karena mereka sudah terlambat menghadiri rapat.","options":["Menjelaskan kondisi lift kepada pengguna sambil meminta mereka menggunakan akses lain yang masih tersedia.","Menghubungi teknisi agar segera mempercepat penanganan setelah menjelaskan penyebab gangguan kepada pengguna.","Mengoperasikan kembali lift setelah memastikan gangguannya tampak sudah berkurang agar pengguna tetap dapat melanjutkan aktivitasnya.","Meminta pengguna menunggu hingga pemeriksaan selesai meskipun belum dapat memastikan kapan lift dapat digunakan kembali.","Tetap tidak mengoperasikan lift sebelum dinyatakan aman digunakan sambil memberikan penjelasan sesuai informasi yang tersedia."],"answer":"E","points":[4,3,1,2,5],"explanation":"E (5 poin) merupakan jawaban terbaik. Bima tetap tidak mengoperasikan lift sebelum dinyatakan aman digunakan serta memberikan penjelasan berdasarkan informasi yang dimiliki. Keputusan ini menunjukkan kepatuhan terhadap prosedur keselamatan dan tanggung jawab profesi sebagai operator lift. Meskipun mendapat tekanan dari pengguna, keselamatan tetap menjadi prioritas utama dantidak boleh dikompromikan. Sikap tersebut mencerminkan nilai Akuntabel, Kompeten, dan Berorientasi Pelayanan AA(4 poin) menunjukkan sikap yang komunikatif dengan menjelaskan penyebab gangguan sekaligus mengarahkan pengguna memanfaatkan akses lain yang masih tersedia. Langkah ini membantu pengguna tetap dapat melanjutkan aktivitasnya tanpa mengabaikan keselamatan. Namun, dibandingkan opsi E, penekanannya lebih pada pemberian alternatif darioada penegasan terhadap keputusan profesional untuk tidak mengoperasikan lift yang belum dinyatakan aman B (3 poin) menunjukkan inisiatif mempercepat penyelesaian gangguan dengan menghubungi teknisi setelah memberikan penjelasan kepada pengguna. Langkah ini mendukung percepatan layanan. Akan tetapi, fokus utama operator dalam situasi tersebut adalah memastikan lift tidak digunakan sebelum dinyatakan aman, bukan sekadar mempercepat proses perbaikan. D (2 poin) menunjukkan kepatuhan terhadap prosedur dengan meminta pengguna menunggu hingga pemeriksaan selesai. Namun, jawaban ini kurang responsif terhadap kebutuhan pengguna karena tidak disertaiinformasi maupun alternatif yang dapat membantu mereka melanjutkan aktivitas C (1 poin) merupakan pilihan yang paling kurang tepat. Mengoperasikan lift hanya karena gangguan tampak berkurang berarti mengambil keputusan tanpa adanya kepastian bahwa lift telah dinyatakan aman. Tindakan tersebut melampaui kewenangan operator dan berpotensi membahayakan keselamatan pengguna","source":"AyoCPNS"},{"n":68,"section":"TKP","topic":"Profesionalisme","prompt":"Seorang barista menerima pesanan dari pelanggan yang sudah sering datang ke kafe tersebut. Pelanggan hanya memesan dengan mengatakan, \"Seperti biasa ya.\" Setelah minuman selesai dibuat dan disajikan, pelanggan memprotes karena menurutnya rasa minuman tersebut berbeda dari yang biasanya ia terima. Sikap barista tersebut sebaiknya...","options":["Menjelaskan bahwa minuman dibuat berdasarkan pesanan yang disampaikan pelanggan sambil menawarkan solusi yang sesuai dengan kebijakan kafe.","Meminta maaf kepada pelanggan dan langsung membuat ulang minuman sesuai yang diinginkan tanpa memberikan penjelasan.","Menanyakan kembali kebiasaan pesanan pelanggan sebelum menentukan penyelesaian yang paling tepat.","Menjelaskan bahwa setiap barista dapat memiliki cara penyajian yang sedikit berbeda sehingga rasa minuman dapat bervariasi.","Memohon maaf bahwa refund tidak dapat dilakukan kemudian menyepakati pesanan yang paling sesuai dengan kemauan pelanggan."],"answer":"E","points":[4,2,3,1,5],"explanation":"E (5 poin) merupakan jawaban terbaik. Barista menyampaikan permohonan maaf kepada pelanggan sekaligus menjelaskan bahwa refund tidak dapat dilakukan sesuai kebijakan kafe, kemudian mengklarifikasi kembali pesanan yang diinginkan sebelum menindaklanjuti keluhan tersebut. Langkah ini menunjukkan profesionalisme karena tetap berpegang pada kebijakan yang berlaku tanpa mengabaikan penyelesaian masalah pelanggan. Barista tidak serta-merta menyalahkan pelanggan maupun mengorbankan aturan kafe, tetapi mencari solusi yang tepat berdasarkan fakta pemesanan. Sikap ini mencerminkan nilai Akuntabel, Kompeten, dan Berorientasi Pelayanan. AA(4 poin) menunjukkan sikap profesional dengan menjelaskan bahwa minuman dibuat berdasarkan informasi yang diberikan pelanggan sekaligus menawarkan solusi sesuai kebijakan kate. Langkah ini menjaga komunikasi yang baik dan tetap menghormati pelanggan. Namun, dibandingkan opsi E, penyelesaian masalah belum diawali dengan klarifikasi ulang mengenai pesanan sehingga akar permasalahan belum dipastikan secara bersama. C (3 poin) menunjukkan upaya mengklarifikasi kebiasaan pesanan pelanggan sebelum menentukan penyelesaian. Langkah ini membantu menghindari kesalahpahaman lebih lanjut. Akan tetapi, opsi ini belum menunjukkan bagaimana penyelesaian dilakukan sesuai kebijakan kafe sehingga aspek profesionalismenya belum sekuat opsi A dan E B (2 poin) menunjukkan empati dengan langsung meminta maaf dan membuat ulang minuman. Meskipun dapat meningkatkan kepuasan pelanggan, tindakan tersebut berpotensi mengabaikan kebijakan usaha dan belum memastikan apakah kesalahan memang berasal dari proses pelayanan atau dari kurangjelasnya pesanan pelanggan D (1 poin) merupakan pilihan yang paling kurang tepat. Menjelaskan bahwa setiap barista memiliki cara penyajian yang berbeda memang dapat memberikan alasanatas perbedaan rasa, Namun, penjelasan tersebut tidak menyelesaikan inti permasalahan yang disampaikan pelanggan dan berpotensi menimbulkan kesan bahwa standar kualitas produk tidak konsisten.","source":"AyoCPNS"},{"n":69,"section":"TKP","topic":"Profesionalisme","prompt":"Rian bertugas sebagai petugas keamanan di sebuah objek wisata. Ia menerima laporan dari petugas loket bahwa seorang pengunjung diduga memasuki area wisata tanpa membeli tiket. Saat ditemui, pengunjung tersebut mengaku terburu-buru karena mengikuti rombongan keluarganya dan bersedia membeli tiket apabila memang belum tercatat. Sikap Rian sebaiknya...","options":["Mengarahkan pengunjung menuju loket untuk memastikan status tiketnya sebelum mengizinkannya melanjutkan aktivitas.","Meminta pengunjung tetap berada di lokasi sembari berkoordinasi dengan petugas loket mengenai status tiketnya,","Mengantar pengunjung ke loket untuk menyelesaikan administrasi apabila memang belum melakukan pembayaran,","Meminta penanggung jawab rombongan hadir agar status pengunjung dapat dipastikan sebelum mengambil tindakan.","Mengizinkan pengunjung tetap melanjutkan aktivitas karena telah bersedia membeli tiket apabila diperlukan. poin"],"answer":"A","points":[5,4,3,2,1],"explanation":"A (5 poin) merupakan jawaban terbaik. Rian mengarahkan pengunjung menuju loket untuk memastikan terlebih dahulu status tiketnya sebelum mengizinkannya melanjutkan aktivitas. Langkah ini menunjukkan sikap profesional karena mengedepankan verifikasi fakta sebelum mengambil keputusan. Rian tidak langsung menganggap pengunjung bersalah maupun langsung mempercayai pengakuannya, melainkan memastikan kebenaran informasi melalui mekanisme yang berlaku. Sikap ini mencerminkan nilai Akuntabel, Kompeten, dan Berorientasi Pelayanan. B (4 poin) menunjukkan kehati-hatian dengan meminta pengunjung tetap berada di lokasi sambil berkoordinasi dengan petugas loket mengenai status tiketnya. Langkah inijuga mengutamakan proses verifikasi sebelum mengambil tindakan. Namun, dibandingkan opsiA, penyelesaian menjadi kurang efisien karena seluruh proses bergantung pada koordinasi petugas lain, padahal pengunjung dapat langsung diarahkan ke loket untuk memastikan status tiketnya. € (3 poin) menunjukkan upaya menyelesaikan administrasi dengan mengantar pengunjung ke loket apabila memang belum melakukan pembayaran. Langkah ini tetap mengarah pada penyelesaian masalah. Akan tetapi, opsi ini secara tidak langsung mengasumsikan bahwa pengunjung memang belum membeli tiket, padahal status tersebut belum dipastikan melalui proses verifikasi. D (2 poin) menunjukkan kehati-hatian dengan melibatkan penanggungjawab rombongan sebelum mengambil tindakan. Meskipun dapat membantu memperoleh informasi tambahan, langkah tersebut belum menjadi kebutuhan utama karena verifikasi status tiket dapat dilakukan langsung melalui petugas loket tanpa melibatkan pihak lain. E (1 poin) merupakan pilihan yang paling kurang tepat. Kesediaan pengunjung untuk membeli tiket tidak dapat dijadikan dasar bahwa ia memang belum atau sudah memenuhi kewajibannya. Mengizinkan pengunjung tetap melanjutkan aktivitas tanpa melakukan verifikasi terlebih dahulu berpotensi mengabaikan prosedur yang berlaku serta membuka peluang terjadinya penyalahgunaan.","source":"AyoCPNS"},{"n":70,"section":"TKP","topic":"Profesionalisme","prompt":"Raka menerima pesanan pengantaran makanan. Setelah tiba di lokasi sesuai titik pengantaran, pelanggan justru mengaku tidak pernah memesan dan menolak menerima pesanan tersebut. Beberapa warga di sekitar mulai memperhatikan situasi, sementara pesanan sudah dibayar oleh driver terlebih dahulu sesuai metode pembayaran yang dipilih pelanggan. Sikap Raka sebaiknya...","options":["Menjelaskan kronologi kepada pelanggan dengan tegas karena hal ini merugikannya secara waktu dan finansial sambil memastikan kembali detail pesanan.","Menghubungi layanan bantuan aplikasi untuk meminta penyelesaian sesuai prosedur sambil menjelaskan kondisi kepada pelanggan.","Meminta pelanggan memeriksa kembali riwayat pesanannya sambil memintanya untuk memverifikasi informasi yang ia berikan.","Menawarkan agar pelanggan tetap menerima pesanan dan menyelesaikan pembayaran secara langsung di lokasi.","Membawa kembali pesanan tersebut untuk dirinya sendiri tanpa melakukan tindak lanjut agar situasi tidak semakin memanas."],"answer":"B","points":[1,5,4,3,2],"explanation":"B (5 poin) merupakan jawaban terbaik. Raka menghubungi layanan bantuan aplikasi untuk memperoleh penyelesaian sesuai prosedur sambil tetap menjelaskan kondisi yang terjadi kepada pelanggan. Langkah ini menunjukkan profesionalisme karena penyelesaian sengketa dilakukan melalui mekanisme resmi yang telah ditetapkan oleh platform, bukan berdasarkan emosi atau kesepakatan sepihak. Dengan demikian, hak seluruh pihak tetap terlindungi dan keputusan yang diambil memiliki dasar yang jelas. Sikap ini mencerminkan nilai Akuntabel. Kompeten. dan Berorientasi Pelayanan. (4 poin) menunjukkan upaya mengklarifikasi keadaan dengan meminta pelanggan memeriksa kembali riwayat pesanannya serta memverifikasi informasi yang disampaikan. Langkah ini dapat membantu memastikan apakah benar terjadi kesalahan pemesanan atau kekeliruan identitas. Namun, dibandingkan opsi B, penyelesaian masih bergantung pada pengakuan pelanggan dan belum melibatkan mekanisme resmi aplikasi D (3 poin) menunjukkan itikad baik untuk mencari penyelesaian secara langsung dengan menawarkan pelanggan menerima pesanan dan menyelesaikan pembayaran di lokasi. Meskipun dapat mengakhiri permasalahan dengan cepat apabila pelanggan bersedia, langkah ini berpotensi mengabaikan prosedur penyelesaianyang telah disediakanoleh platform. E (2 poin) menunjukkan upaya menghindari konftik dengan membawa kembali pesanan. Akan tetapi, tidak melakukan tindak lanjut melalui aplikasi membuat permasalahan tidak terdokumentasi dan berpotensi merugikan driver karena haknya tidak diperjuangkan sesuai mekanisme yang berlaku. AA (1 poin) merupakan pilihan yang paling kurang tepat. Menjelaskan kronologi dengan nada keras menunjukkan kurangnya pengendalian emosidan berpotensi memperkeruh situasi, meskipun Raka memang mengalami kerugian waktu maupun finansial. Profesionalisme menuntut penyelesaian masalah dilakukan secara tenang dan melalui prosedur yang berlaku.","source":"AyoCPNS"},{"n":71,"section":"TKP","topic":"Profesionalisme","prompt":"Fajar merupakan pelatih renang anak di sebuah klub olahraga. Saat sesi latihan berlangsung, salah satu anak yang biasanya aktif tiba-tiba menolak masuk ke kolam dan terus menangis, sementara orang tuanya meminta latihan tetap dilanjutkan karena anak tersebut akan mengikuti perlombaan beberapa minggu lagi. Sikap Fajar sebaiknya...","options":["Menyesuaikan intensitas latihan sambil membujuk anak dengan perlahan agar kembali mengikuti sesi secara bertahap","Meminta orang tua ikut sementara waktu mendampingi anak sambil melanjutkan latihan sesuai kemampuan anak saatitu.","Memberi waktu kepada anak untuk menenangkan diri dan membujuknya untuk melanjutkan sesi latihan.","Menjelaskan kondisi anak kepada orang tua dan menanyakan bentuk latihan yang sebaiknya dilakukan pada hari ini.","Menyesuaikan program latihan berdasarkan kondisi anak tanpa mengabaikan target latihan yang telah disusun."],"answer":"E","points":[3,4,2,1,5],"explanation":"E (5 poin) merupakan jawaban terbaik, Fajar menyesuaikan program latihan berdasarkan kondisi anak tanpa mengabaikan target latihan yang telah disusun. Langkah ini menunjukkan bahwa pelatih tetap menjalankan tanggung jawab profesionalnya dengan mempertimbangkan kondisi fisik maupun psikologis atlet, tanpa memaksakan latihan ataupun menghentikan program secara keseluruhan. Seorang pelatih profesional dituntut mampu menyesuaikan metode latihan berdasarkan kondisi atlet, bukan sekadar berfokus padatarget perlombaan. Sikap ini mencerminkan nilai Kompeten, Akuntabel, dan Berorientasi Pelayanan. B (4 poin) menunjukkan upaya melibatkan orang tua sebagai pendamping agar anak merasa lebih nyaman selama latihan berlangsung Langkah ini tetap memungkinkan latihan berjalan sesuai kemampuan anak tanpa mengabaikan kondisi emosionalnya. Namun, dibandingkan opsi E, fokusnya lebih pada keterlibatan orang tua, sedangkan penyesuaian program latihan sebagai tanggung jawab utama pelatih belum terlihat secara tegas. A (3 poin) menunjukkan kepedulian dengan mengurangi intensitas latihan sambil membujuk anak agar kembali mengikuti sesi secara bertahap. Langkah ini dapat membantu anak beradaptasi kembali dengan situasi latihan. Akan tetapi, opsiini lebih berfokus pada upaya membujuk anak daripada melakukan penyesuaian program latihan secara menyeluruh sesuai hasil penilaian pelatih C (2 poin) menunjukkan empati dengan memberikan waktu kepada anak untuk menenangkan diri sebelum kembali dibujuk mengikuti latihan. Langkah ini dapat membantu mengurangi tekanan yang dirasakan anak, Namun, tindakan tersebut belum menggambarkan bagaimana pelatihakan mengelola program latihan secara profesional setelah kondisi anak dievaluasi. D (1 poin) merupakan pilihan yang paling kurang tepat. Menjelaskan kondisi anak kepada orang tua merupakan langkah yang baik. Namun, menyerahkan penentuan bentuk latihan kepada orang tua kurang sesuai dengan peran pelatih. Menentukan metode dan bentuk latihan merupakan bagian dari kompetensi serta tanggung jawab profesional pelatih berdasarkan hasil pengamatan terhadap kondisiatlet","source":"AyoCPNS"},{"n":72,"section":"TKP","topic":"Profesionalisme","prompt":"Nabila merupakan seorang pramugari. Sesaat sebelum pesawat lepas landas, seorang penumpang VIP tetap menggunakan telepon genggam untuk melakukan panggilan meskipun telah beberapa kali diingatkan. Penumpang tersebut meminta Nabila memakluminya karena panggilan itu sangat penting dan mengaku telah sering melakukannya pada penerbangan","options":["Memberikanwaktu beberapa saat kepada penumpang untuk menyelesaikan panggilannya sebelum kembali mengingatkannya.","Meminta bantuan awak kabin lain agar penumpang lebih memahami pentingnya mematuhi ketentuan penerbangan.","Menjelaskan kondisi tersebut kepada kepala awak kabin dan memintanya untuk turun langsung menentukan langkah penanganan selanjutnya.","Meminta penumpang mematuhi prosedur tanpa memberikan pendekatan lebih lanjut.","Menjelaskan kembali alasan keselamatan penerbangan sambil meminta penumpang mengakhiri panggilannya sebelum pesawat lepas landas."],"answer":"E","points":[2,3,4,1,5],"explanation":"E (5 poin) merupakan jawaban terbaik. Nabila kembali menjelaskan alasan keselamatan penerbangan sambil meminta penumpang mengakhiri panggilannya sebelum pesawat lepas landas. Langkah ini menunjukkan bahwa ia tetap menjalankan tugasnya secara profesional dengan mengedepankan komunikasi yang baik tanpa mengabaikan ketentuan keselamatan penerbangan. Status penumpang tidak memengaruhi penerapan prosedur yang berlaku sehingga standar keselamatan tetap ditegakkan secara konsisten. Sikap ini mencerminkan nilai Akuntabel, Kompeten. dan Berorientasi Pelayanan (4 poin) menunjukkan kepatuhan terhadap rantai komando dengan melibatkan kepala awak kabin setelah menghadapi kesulitan menangani penumpang. Langkah ini sesuai dengan mekanisme penanganan apabila situasi memerlukan kewenangan yang lebih tinggi Namun, dibandingkan opsi E, Nabila seharusnya terlebih dahulu mengoptimalkan perannya untuk memberikan penjelasan langsung kepada penumpang sebelum mengeskalasi permasalahan B (3 poin) menunjukkan kemauan bekerja sama dengan awak kabin lain untuk membantu memberikan pemahaman kepada penumpang. Langkah ini dapat meningkatkan efektivitas komunikasi. Akan tetapi, melibatkan awak kabin lain belum tentu menjadilangkah yang diperlukan apabila pramugari masih dapat menjalankan tugasnya secara langsung, AA(2 poin) menunjukkan toleransi dengan memberikan waktu kepada penumpang untuk menyelesaikan panggilannya. Namun, tindakan tersebut berpotensi mengabaikan prosedur keselamatan penerbangan karena memberikan kelonggaran terhadap ketentuanyang seharusnya dipatuhi sebelum pesawat lepas landas. D (1 poin) merupakan pilihan yang paling kurang tepat. Tetap meminta penumpang mematuhi prosedurtanpa memberikan pendekatan atau langkah lanjutan pada dasarnya hanya mengulangi tindakan yang sebelumnya telah dilakukan dan tidak efektif, Profesionalisme menuntut tidak hanya konsisten terhadap aturan, tetapi juga mampu memilih pendekatan yang lebih tepat ketika instruksi awal tidak dipatuhi.","source":"AyoCPNS"},{"n":73,"section":"TKP","topic":"Profesionalisme","prompt":"Nabila merupakan seorang pramugari. Sesaat sebelum pesawat lepas landas, seorang penumpang VIP tetap menggunakan telepon genggam meskipun telah beberapa kali diingatkan. Ketika Nabila kembali mengingatkan, penumpang tersebut justru menamparnya dan tetap menolak mengakhiri panggilannya. Sikap Nabila sebaiknya...","options":["Tetap meminta penumpang mematuhi ketentuan keselamatan penerbangan sambil menahan diri agar situasi tidak semakin memanas.","Meminta awak kabin lain melanjutkan penanganan penumpang tersebut sementara ia melaporkan kejadian yang dialaminya kepada kepala awak kabin.","Menjelaskan kejadian tersebut kepada kepala awak kabin untuk memperoleh penanganan sesuai prosedur penerbangan.","Memberikan kesempatan kepada penumpang untuk menenangkan diri sebelum kembali mengingatkannya mengenai ketentuan penerbangan.","Menjelaskan kepada penumpang bahwa tindakannya tidak dapat dibenarkan sambil meminta maaf atas ketidaknyamanan yang terjadi."],"answer":"B","points":[4,5,3,2,1],"explanation":"B (5 poin) merupakan jawaban terbaik. Nabila meminta awak kabin lain melanjutkan penanganan penumpang tersebut sementara ia melaporkan kejadian yang dialaminya kepada kepala awak kabin. Langkah ini menunjukkan profesionalisme karena keselamatan dan ketertiban penerbangan tetap terjaga tanpa mengabaikan prosedur penanganan insiden Kekerasan terhadap awak kabin. Nabila tidak memaksakan diri menangani situasi seorang diri maupun terpancing emosi, tetapi menjalankan mekanisme yang sesuai dengan pembagian tugas dan rantai komando di dalam pesawat. Sikap ini mencerminkan nilai Akuntabel, Kompeten, dan Harmonis. AA(4 poin) menunjukkan pengendalian diri yang baik dengan tetap meminta penumpang mematuhi ketentuan keselamatan tanpa memperkeruh keadaan. Langkah ini mencerminkan sikap profesional dalam menghadapi provokasi. Namun, setelah terjadi kekerasan fisik, penanganan tidak cukup hanya dengan tetap mengingatkan penumpang. Situasi tersebut perlu segera ditangani melalui prosedur yang berlaku. € (3 poin) menunjukkan kepatuhan terhadap rantai komando dengan melaporkan kejadian kepada kepala awak kabin untuk memperoleh penanganan sesuai prosedur. Langkah ini sudah tepat. Akan tetapi, dibandingkan opsi B, belum ada pengaturan mengenai keberlanjutan penanganan terhadap penumpang sehingga pelayanan dan pengamanan situasi belum tergambar secara menyeluruh. D (2 poin) menunjukkan upaya meredakan emosi penumpang dengan memberinya waktu untuk menenangkan diri. Meskipun pendekatan persuasif dapat digunakan dalam kondisi tertentu, setelah terjadi tindakan kekerasan fisik, penanganan tidak lagi cukup dilakukan melalui pendekatan tersebut dan harus mengikuti prosedur keselamatan yang berlaku. E (1 poin) merupakan pilihan yang paling kurang tepat. Menanggapi kekerasan dengan memberikan balasan fisik bertentangan dengan profesionalisme, berpotensi memperburuk situasi di dalam pesawat, serta tidak sesuai dengan standar perilaku awak kabin dalam menangani penumpang.","source":"AyoCPNS"},{"n":74,"section":"TKP","topic":"Pelayanan Publik","prompt":"Sinta adalah petugas layanan pelanggan sebuah bank melalui call center. Seorang penelepon panik meminta kartu debitnya segera diblokir karena diduga hilang, tetapi tidak dapat menyebutkan data verifikasi yang diperlukan. Sikap Sinta sebaiknya...","options":["Menjelaskan pentingnya proses verifikasi dan meminta penelepon kembali mengingat data yang diperlukan sebelum pemblokiran dilakukan.","Menghubungi atasan untuk meminta persetujuan agar kartu tetap dapat diblokir meskipun verifikasi belum lengkap.","Memohon maaf tidak dapat memblokir kartu karena penelepon tidak bisa menunjukkan identitas aslinya.","Segera mengarahkan penelepon datang ke kantor cabang terdekat untuk melakukan verifikasi identitas dan pemblokiran kartu.","Mencari alternatif verifikasi identitas yang sesuai prosedur agar pemblokiran kartu dapat segera diproses."],"answer":"E","points":[4,2,1,3,5],"explanation":"E (Poin 5) Ini merupakan jawaban terbaik karena Sinta tetap berupaya membantu nasabah dengan mencari alternatif verifikasi identitas yang masih sesuai prosedur agar pemblokiran kartu dapat segera diproses. Langkah ini menjaga keamanan rekening nasabah sekaligus memberikan solusiyang cepat tanpa melanggar ketentuan perbankan. Sikap tersebut mencerminkan nilai Berorientasi Pelayanan dan Kompeten karena mampu menyelesaikan kebutuhan nasabah dengan tetap menjaga keamanan layanan A (Poin 4) Pilihan ini sudah sangat baik karena Sinta menjelaskan pentingnya proses verifikasidan membantu penelepon mengingat kembali data yang diperlukan sebelum pemblokiran dilakukan. Namun, tindakan ini masih berfokus pada satu metode verifikasi. Dibandingkan opsi E, upaya penyelesaian masalah belum seoptimal mencari alternatif verifkasi yang tetap sesuai prosedur. D (Poin 3) Pilihan ini memberikan solusi yang sesuai prosedur dengan mengarahkan penelepon datang ke kantor cabang untuk melakukan verifikasi identitas. Namun, solusi tersebut membutuhkan waktu lebih lama, padahal kondisi nasabah sedang panik karena khawatir kartunya disalahgunakan. Dibandingkan opsi £, pelayanan menjadi kurang responsif B (Poin 2) Pilihan ini menunjukkan upaya mencarijalan keluar melalui persetujuanatasan. Namun, persetujuan atasan tidak dapat menggantikan kewajiban verifikasi identitas yang menjadi bagian dari prosedur keamanan perbankan. Langkah inijuga berpotensi memperlambat penanganan tanpa memberikan solusi yang tepat. C (Poin 1) Pilihan ini berpegang pada prosedur dengan tidak memblokirkartu karenaidentitas penelepon belum dapat diverifikasi. Namun Sinta langsung menghentikan proses pelayanan tanpa mengupayakan alternatif penyelesaian yang masih sesuai prosedur. Sikap ini kurang mencerminkan nilai Berorientasi Pelayanan karena belum berusaha membantu nasabah memperoleh solusi atas permasalahanyang dihadapi.","source":"AyoCPNS"},{"n":75,"section":"TKP","topic":"Pelayanan Publik","prompt":"Pak Arif adalah seorang lurah. Beberapa warga mendatangi kantornya untuk mengeluhkan tumpukan sampah di lingkungan permukiman yang mulai menimbulkan bau tidak sedap. Di sisi lain, armada pengangkut sampah baru dapat beroperasi kembali keesokan harinya. Sikap Pak Arif sebaiknya...","options":["Menjelaskan kondisi armada kepada warga dan meminta mereka menunggu hingga pengangkutan kembali dilakukan.","Berkoordinasi dengan dinas terkait untuk mencari alternatif penanganan sambil menginformasikan perkembangan kepada warga.","Mengajak warga melakukan kerja bakti membersihkan lingkungan sambil menunggu armada pengangkut tersedia","Meminta perangkat kelurahan membantu memindahkan sampah ke lokasi penampungan sementara agar dampaknya berkurang.","Meminta warga menyampaikan keluhan melalui musyawarah lingkungan agar dapat dibahas bersama pada pertemuan berikutnya."],"answer":"B","points":[2,5,4,3,1],"explanation":"B (Poin 5) Ini merupakan jawaban terbaik karena Pak Arif tidak hanya berkoordinasi dengan dinas terkait untuk mencari alternatif penanganan, tetapi juga memberikan perkembangan informasi kepada warga. Langkah ini menunjukkan upaya aktif mencari solusi meskipunarmada pengangkut belum tersedia. Selain itu, komunikasi yang terbuka menjaga kepercayaan masyarakat dan memastikan keluhan tidak berhenti pada tahap penerimaan saja. Sikap tersebut mencerminkannilai Berorientasi Pelayanan dan Kolaboratif karena mengupayakan penyelesaian masalah melalui koordinasi yang tepat sekaligus menjaga komunikasi dengan masyarakat. C (Poin 4) Pilihan inijuga sangat baik karena melibatkan partisipasi warga untuk mengurangi dampak tumpukan sampah melalui kerja bakti Lingkungan dapat menjadi lebih bersih sambil menunggu armada pengangkut tersedia. Namun, kerja bakti belum tentu menyelesaikan persoalan apabila sampah tetap tidak dapat diangkut, sehingga efektivitasnya masih bergantung pada penanganan lanjutan dari dinas terkait. D (Poin 3) Pilihan ini menunjukkan tindakan nyata dengan meminta perangkat kelurahan memindahkan sampah ke lokasi penampungan 'sementara agar dampaknya berkurang. Namun, solusi ini hanya memindahkan titik permasalahan dan belum menyelesaikan akar persoalan Selainitu, ketersediaan lokasi penampungan sementara juga belum tentu ada, sehingga efektivitasnya masih terbatas AA (Poin 2) Pilihan ini memberikan penjelasan yang jujur mengenai kondisi armada sehingga warga memperoleh kepastian informasi. Namun, tindakan tersebut hanya bersifat informatif tanpa diikuti upaya untuk mengurangi dampak yang sedang dirasakan masyarakat. Pelayanan menjadi kurang responsif terhadap kebutuhan warga. E (Poin 1) Pilihan ini tetap membuka ruang bagi warga untuk menyampaikan aspirasi melalui musyawarah lingkungan. Namun, musyawarah tidak memberikan solusi terhadap permasalahan yang sedang terjadi danjustru menunda penanganan hingga pertemuan berikutnya. Sikap ini kurang mencerminkan nilai Berorientasi Pelayanan karena belum memberikan respons yang memadai terhadap keluhan masyarakat yang membutuhkan penanganan segera.","source":"AyoCPNS"},{"n":76,"section":"TKP","topic":"Pelayanan Publik","prompt":"Hendi adalah seorang CASN. Saat hendak mengikuti apel pagi, ia melihat seorang lansia tampak kebingungan mencari ruang pelayanan yang dituju. Di sisi lain, apel akan segera dimulai dan seluruh pegawai telah berkumpul. Sikap Hendi sebaiknya...","options":["Mengarahkan lansia tersebut secara lisan agar segera menuju ruang pelayanan yang dimaksud.","Memanggil petugas keamanan untuk membantu mengantarkan lansia tersebut ke tempat yang dituju.","Mengantarlansia tersebut ke ruang pelayanan terlebih dahulu kemudian segera bergabung mengikuti apel.","Meminta lansia menunggu di lobi kantor hingga apel selesai agar dapat diantar menuju ruang pelayanan.","Berkoordinasi dengan petugas keamanan untuk mengantarkan lansia tersebut sambil memastikan keperluannya."],"answer":"E","points":[2,4,3,1,5],"explanation":"E (Poin 5) Ini merupakan jawaban terbaik karena Hendi tidak hanya meminta bantuan petugas keamanan, tetapi juga berkoordinasi untuk memastikan keperluan lansia benar-benar dipahami dan ditindaklanjuti. Dengan demikian, kebutuhan warga tetap terpenuhi tanpa mengabaikan kewajibannya mengikuti apel. Langkah ini menunjukkan pelayanan yang responsif sekaligus memanfaatkan kerja sama dengan pihak yang tepat. Sikap tersebut mencerminkan nilai Berorientasi Pelayanan dan Kolaboratif karena memastikan masyarakat memperoleh bantuan yang dibutuhkan melalui koordinasi yang efektif. B (Poin 4) Pilihan ini sudah sangat baik karena Hendi segera memanggil petugas keamanan untuk mengantarkan lansia ke ruang pelayanan. Tindakan tersebut menunjukkan kepedulian terhadap warga sekaligus tetap menjaga kewajibannya sebagai ASN. Namun, dibandingkan opsi E, Hendi belum memastikan bahwa kebutuhan lansia telah dipahami dengan benar sebelum menyerahkan penanganannya kepada petugas keamanan. € (Poin 3) Pilihan ini menunjukkan kepedulian yang tinggi dengan mengantar langsung lansia ke ruang pelayanan. Namun, Hendi mengabaikan kewajibannya mengikuti apel yang akan segera dimulai. padahal masih tersedia alternatif bantuan melalui petugas keamanan. Pelayanan kepada warga tetap terpenuhi, tetapi kurang mempertimbangkan tanggung jawab kedinasan. A (Poin 2) Pilihan ini memberikan bantuan awal dengan mengarahkan lansia menuju ruang pelayanan yang dimaksud. Namun, hanya memberikan arahan lisan belum tentu cukup bagi seorang lansia yang tampak kebingungan, sehingga kebutuhan pelayanan belum dipastikan benar-benar terpenuhi. D (Poin 1) Pilihan ini mengutamakan penyelesaian apel terlebih dahulu dengan meminta lansia menunggu. Namun, tindakan tersebut menunda pelayanan kepada masyarakat yang sedang membutuhkan bantuan, padahal masih terdapat alternatif yang memungkinkan pelayanan tetap diberikan tanpa mengabaikan kewajiban sebagai ASN. Sikap ini kurang mencerminkan nilai Berorientasi Pelayanan karena kebutuhan masyarakat tidak segera direspons","source":"AyoCPNS"},{"n":77,"section":"TKP","topic":"Pelayanan Publik","prompt":"Hendra adalah seorang ASN yang baru di tempatkan di suatu daerah. Saat berangkat menuju kantor, seorang warga menghampirinya dan bertanya menggunakan bahasa daerah yang belum dipahami Hendra. Warga tersebut tampak terburu-buru dan terus berusaha menjelaskan maksudnya. Sikap Hendra sebaiknya...","options":["Menjelaskan dengan sopan bahwa dirinya belum memahami bahasa daerah dan meminta warga menggunakan bahasa Indonesia saja.","Mencari bantuan warga sekitar yang memahami kedua bahasa untuk membantu menyampaikan maksud pertanyaan tersebut.","Dengansopantetap mencoba menjawab pertanyaan warga seadanya meskipun belum yakin dengan maksud yang disampaikan.","Memberikan warga alamat kantornya dan meminta warga datang ke kantor pada jam pelayanan agar dapat dibantu.","Mencari aplikasi penerjemah atau sarana komunikasi yang tersedia apabila memungkinkan untuk memahami kebutuhan warga."],"answer":"E","points":[3,4,1,2,5],"explanation":"E (Poin 5) Ini merupakan jawaban terbaik karena Hendra berinisiatif memanfaatkan aplikasi penerjemah atau sarana komunikasi lain yang tersedia untuk memahami kebutuhan warga. Langkah ini menunjukkan upaya aktif memberikan pelayanan meskipun terdapat hambatan bahasa. Selain tetap menghormati warga, solusi tersebut juga meminimalkan risiko kesalahpahaman dalam memberikan informasi. Sikap ini mencerminkan nilai Berorientasi Pelayanan dan Adaptif karena memanfaatkan teknologi untuk memberikan pelayanan yang lebih efektif. B (Poin 4) Pilihan ini sudah sangat baik karena Hendra berusaha mencari bantuan warga sekitar yang memahami kedua bahasa sehingga komunikasi dapat berlangsung dengan lebih akurat. Namun, dibandingkan opsi E, Hendra masih bergantung pada bantuan orang lain. Apabila tersedia sarana komunikasi yang dapat digunakan secara langsung, Hendra sebaiknya mengoptimalkannya terlebih dahulu AA (Poin 3) Pilihan ini menunjukkan sikap jujur mengenai keterbatasan kemampuan bahasa sekaligus mengajak warga menggunakan bahasa Indonesia apabila memungkinkan. Namun, solusi tersebut bergantung pada kemampuan warga menggunakan bahasa Indonesia sehingga belum tentu menyelesaikan kebutuhan pelayanan. D (Poin 2) Pilihan ini memberikan alternatif agar warga memperoleh pelayanan di kantor pada jam pelayanan. Namun, Hendra menunda upaya membantu padahal masih terdapat kemungkinan memberikan bantuan saat itu juga. Pelayanan menjadi kurang responsif terhadap kebutuhan warga yang sedang terburu-buru € (Poin 1) Pilihan ini menunjukkan niat membantu dengan tetap mencoba menjawab pertanyaan warga. Namun, memberikan informasi berdasarkan pemahaman yang belum pasti berpotensi menimbulkan kesalahpahaman dan merugikan warga. Sikap ini kurang mencerminkan nilai Berorientasi Pelayanan karena pelayanan publik harus mengutamakan ketepatan informasi, terutama ketika terdapat hambatan komunikasi.","source":"AyoCPNS"},{"n":78,"section":"TKP","topic":"Pelayanan Publik","prompt":"Rendi adalah seorang pengemudi ojek online. Dalam perjalanan menuju tujuan, penumpangnya beberapa kali meminta mampir ke lokasi yang berbeda tanpa mengubah tujuan di aplikasi. Di sisi lain, waktu perjalanan menjadi semakin lama dan pesanan berikutnya telah menunggu untuk diambil. Sikap Rendi sebaiknya...","options":["Senantiasa mengikuti seluruh permintaan penumpang dengan sabar agar pelayanan tetap memuaskan.","Denganramah menolak seluruh permintaan tambahan dan langsung menuju tujuan yang tercantum pada aplikasi.","Mengantar penumpang ke tujuan terlebih dahulu kemudian kembali apabila penumpang masih memerlukan bantuan.","Menjelaskan bahwa perubahan tujuan sebaiknya dilakukan melalui aplikasi sebelum melanjutkan perjalanan.","Memenuhi permintaan penumpang selama lokasi tambahan masih searah dengan tujuan perjalanan."],"answer":"D","points":[2,1,3,5,4],"explanation":"D (Poin 5) Ini merupakan jawaban terbaik karena Rendi menjelaskan dengan baik bahwa perubahan tujuan atau penambahan lokasi sebaiknya dilakukan melalui aplikasi sebelum perjalanan dilanjutkan. Langkah ini tetap menghargai kebutuhan pelanggan, tetapi juga menjaga transparansi biaya, kejelasan rute, dan komitmen terhadap pesanan berikutnya. Sikap tersebut mencerminkan nilai Berorientasi Pelayanan dan Profesional karena memberikan pelayanan yang adil, jelas, dan sesuai ketentuan E (Poin 4) Pilihan ini juga sangat baik karena Rendi tetap berusaha memenuhi permintaan pelanggan selama lokasi tambahan masih searah dengan tujuan perjalanan. Namun, perubahan tujuan tanpa penyesuaian pada aplikasi tetap berpotensi menimbulkan ketidaksesuaian rute, tarif, maupun perlindungan layanan. Dibandingkan opsi D, solusiini kurang memberikan kepastian bagi kedua belah pihak. C (Poin 3) Pilihan ini menunjukkan kepedulian terhadap kebutuhan pelanggan dengan menawarkan bantuan setelah perjalanan selesai. Namun, solusi tersebut kurang efisien karena mengharuskan perjalanan dilakukan dua kali dan belum tentu sesuai dengan kebutuhan pelanggan saat itu. Pelayanan tetap diberikan, tetapi kurang efektif AA (Poin 2) Pilihan ini menunjukkan sikap sabar dan berorientasi pada kepuasan pelanggan dengan memenuhi seluruh permintaannya. Namun, mengikuti seluruh permintaan tanpa batas dapat mengganggu komitmen terhadap pesanan berikutnya dan berpotensi menimbulkan ketidaksesuaian dengan layanan yang disepakati dalam aplikasi. Pelayanan menjadi kurang proporsional. B (Poin 1) Pilihan ini tetap menjaga kepatuhan terhadap tujuan yang tercantum pada aplikasi. Namun, langsung menolak seluruh permintaan tambahan tanpa terlebih dahulu mengupayakan solusi atau memberikan penjelasan mengenai mekanisme perubahan tujuan menunjukkan pelayanan yang kurang fleksibel. Sikap ini kurang mencerminkan nilai Berorientasi Pelayanan karena belum berusaha mengakomodasi kebutuhan pelanggan secara proporsional.","source":"AyoCPNS"},{"n":79,"section":"TKP","topic":"Pelayanan Publik","prompt":"Zacky adalah seorang pramugara. Seorang penumpang baru saja memarahinya karena menganggap pelayanan di dalam pesawat kurang memuaskan. Tidak lama kemudian, penumpang yang sama meminta bantuan mengenai jadwal penerbangan lanjutan dan nomor kursi yang harus di tempatinya. Sikap Zacky sebaiknya...","options":["Tetap memberikan informasi yang dibutuhkan penumpang dengan ramah tanpa membahas kembali perselisihan","Meminta penumpang mencari informasi tersebut melalui aplikasi maskapai agar tidak terjadi kesalahpahaman kembali.","Menjelaskan bahwa penumpang sebaiknya menyampaikan keluhan terlebih dahulu kepada maskapai sebelum meminta bantuan lainnya.","Meminta rekan pramugara melayani penumpang tersebut agar pelayanan tetap berjalan dengan baik.","Menunggu penumpang berbicara dengan lebih tenang sebelum memberikan informasi yang diminta."],"answer":"A","points":[5,2,1,4,3],"explanation":"A (Poin 5) ini merupakan jawaban terbaik karena Zacky tetap memberikan informasi yang dibutuhkan penumpang dengan ramah tanpa membawa kembali perselisihan yang telah terjadi. Pelayanan tetap diberikan secara profesional, objektif, dan tidak dipengaruhi oleh sikap penumpang sebelumnya. Tindakan ini menunjukkan bahwa setiap penumpang berhak memperoleh pelayanan yang sama, terlepas dari situasi yang terjadi sebelumnya. Sikap tersebut mencerminkan nilai Berorientasi Pelayanan karena tetap memberikan pelayanan terbaik secara adil dan profesional. D (Poin 4) Pilihan ini juga sangat baik karena Zacky berupaya memastikan penumpang tetap memperoleh pelayanan melalui rekan pramugara Namun, dalam narasi tidak terdapat indikasi bahwa Zacky sudah tidak mampu memberikan pelayanan secara objektif. Oleh karenaitu, mengalihkan pelayanan kepada rekan belum menjadi pilihan yang paling tepat dibandingkan tetap melayani secara langsung E (Poin 3) Pilihan ini bertujuan menjaga komunikasi agar berlangsung lebih kondusif. Namun, menunda pemberian informasi hingga penumpang lebih tenang dapat memperlambat pelayanan yang sebenarnya masih dapat diberikan secara profesional saat itujuga. B (Poin 2) Pilihan ini memberikan alternatif kepada penumpang untuk memperoleh informasi melalui aplikasi maskapai. Namun, Zacky justru mengalihkan pelayanan yang sebenarnya dapat ia berikan secara langsung. Pelayanan menjadi kurang optimal karena tidak berupaya memenuhi kebutuhan penumpang secara aktif. C (Poin1) Pilihan ini mengaitkan pelayanan yang diminta dengan keluhan yang sebelumnya disampaikan penumpang. Padahal, penyampaian keluhan dan pemberian informasi merupakan dua layanan yang berbeda dan seharusnya tidak saling bergantung. Sikap ini kurang mencerminkan nilai Berorientasi Pelayanan karena membiarkan pengalaman konflik memengaruhi kualitas pelayanan yang seharusnya tetap diberikan secara profesional kepada setiap penumpang","source":"AyoCPNS"},{"n":80,"section":"TKP","topic":"Pelayanan Publik","prompt":"Siska adalah kasir di sebuah supermarket. Seorang pelanggan meminta membeli barang yang dipajang di etalase, tetapi barang tersebut merupakan contoh display dan tidak untuk diperjualbelikan. Sikap Siska sebaiknya...","options":["Memohon maaf dan menjelaskan bahwa barang display tidak dapat diperjualbelikan sesuai ketentuan toko.","Menjelaskan dengan ramah bahwa barang tersebut hanya untuk display dan menawarkan produk sejenis yang masih tersedia.","Sambil tersenyum mengarahkan pelanggan mengambil barang lain saja karena produk display tidak dapat dijual.","Merekomendasikan barang serupa dari brand berbeda sebagai alternatif bilamana ingin barang tersebut","Memohon maaf bahwa stok barang tidak tersedia dan menyarankan pelanggan datang kembali nanti."],"answer":"B","points":[4,5,3,2,1],"explanation":"B (Poin 5) Opsi ini merupakan jawaban terbaik karena Siska tidak hanya menjelaskan bahwa barang tersebut merupakan produk display, tetapi juga menawarkan produk sejenis yang masih tersedia. Dengan demikian, pelanggan memperoleh penjelasan yang jelas sekaligus solusi atas kebutuhannya. Tindakan ini menunjukkan pelayanan yang responsif, komunikatif, dan tetap mematuhi ketentuan toko. Sikap tersebut mencerminkan nilai Berorientasi Pelayanan karena mampu memberikan alternatif tanpa mengabaikan aturan yang berlaku AA (Poin 4) Pilihan ini sudah sangat baik karena Siska menyampaikan permohonan maaf dan memberikan penjelasan yang benar mengenai ketentuan bahwa barang display tidak diperjualbelikan. Namun, pelayanan berhenti pada tahap penjelasan tanpa diikuti upaya membantu pelanggan memperoleh alternatif yang sesuai. Dibandingkan opsi B, penyelesaian kebutuhan pelanggan belum optimal. C (Poin 3) Pilihan ini menunjukkan sikap yang ramah dengan mengarahkan pelanggan memilih barang lain. Namun, penjelasan mengenai alasan mengapa barang display tidak dapat dijual kurang disampaikan secara jelas. Akibatnya, pelanggan mungkin belum memahami dasar kebijakan toko. Pelayanan tetap diberikan, tetapi kualitas komunikasinya masih di bawah opsi A dan B D (Poin 2) Pilihan ini menunjukkan inisiatif dengan merekomendasikan produk dari merek lain. Namun, Siska belum menjelaskan bahwa barang yang diminta merupakan produk display yang memang tidak diperjualbelikan. Alternatif yang diberikan menjadi kurang tepat karena pelanggan belum memperoleh penjelasan mengenai akar permasalahannya E (Poin 1) Pilihan ini menunjukkan empati melalui permohonan maaf dan menyarankan pelanggan datang kembali. Namun, informasi yang diberikan tidak sesuai dengan kondisi sebenarnya karena masalahnya bukan stok yang habis, melainkan barang tersebut memang merupakan produk display yang tidak diperjualbelikan. Memberikan informasi yang tidak akurat berpotensi menimbulkan kesalahpahaman dan kurang mencerminkan nilai Berorientasi Pelayanan, yang mengutamakan kejelasan dan ketepatan informasi kepada pelanggan.","source":"AyoCPNS"},{"n":81,"section":"TKP","topic":"Pelayanan Publik","prompt":"Raka sedang dalam perjalanan menuju kantor. Di tengah perjalanan, ia melihat seekor kucing yang masih hidup terlindas di tengah jalan sehingga kendaraan di belakang mulai menghindar secara mendadak. Di sisi lain, waktu masuk kerja tinggal beberapa menit. Sikap Raka sebaiknya...","options":["Melanjutkan perjalanan dengan hati-hati dan berharap pengguna jalan lainnya membantu mengamankan situasi.","Segera menghubungi komunitas penyelamat hewan atau pihak terkait agar penanganan dapat segera dilakukan.","Meminta bantuan warga sekitar untuk memindahkan kucing tersebut ke tempat yang lebih aman.","Berhenti di tempat yang aman dan mengamankan kondisi sekitar agar tidak membahayakan pengguna jalan lain.","Berhenti di tempat yang aman lalu mengupayakan bantuan yang paling memungkinkan bagi hewan tersebut."],"answer":"D","points":[1,2,3,5,4],"explanation":"D (Poin 5) Ini merupakan jawaban terbaik karena Raka terlebih dahulu berhenti di tempat yang aman dan mengupayakan agar kondisi di sekitar tidak membahayakan pengguna jalan lain. Dalam situasi ini, risiko utama bukan hanya keselamatan hewan, tetapi juga potensi kecelakaan beruntun akibat pengendara yang menghindar secara mendadak. Tindakan tersebut menunjukkan kemampuan menetapkan prioritas secara tepat dengan mengutamakan keselamatan publik. Sikap ini mencerminkan nilai Berorientasi Pelayanan karena berupaya melindungi masyarakat dari risiko yang lebih besar E (Poin 4) Pilihan ini menunjukkan kepedulian dengan berhenti ditempat yang aman dan mengupayakan bantuan bagi hewan tersebut. Namun, opsi ini belum secara eksplisit menunjukkan upaya mengamankan kondisi lalu lintas yang menjadi sumber bahaya bagi pengguna jalan. Dibandingkan opsi D, prioritas terhadap keselamatan masyarakat belum tergambar secara jelas. C (Poin 3) Pilihan ini menunjukkan inisiatif dengan melibatkan warga sekitar untuk membantu memindahkan kucing ke tempat yang lebih aman. Namun, sebelum melakukan pemindahan, kondisi lalu lintas yang berpotensi membahayakan pengguna jalan seharusnya lebih dahulu diperhatikan. Langkah ini baik, tetapiurutan prioritasnya masih kurang tepat B (Poin 2) Pilihan ini menunjukkan kepedulian dengan segera menghubungi komunitas penyelamat hewan atau pihak terkait. Namun, tindakan tersebut belum mengatasi risiko yang sedang berlangsung di lokasi kejadian sehingga manfaatnya tidak dapat dirasakan secara langsung oleh pengguna jalan maupun hewan yang terluka. AA (Poin) Pilihan ini mempertimbangkan kepentingan pribadi dengan tetap melanjutkan perjalanan sambil berharap ada pengguna jalan lain yang membantu, Namun, Raka tidak melakukan upaya apa pun untuk mengurangi risiko yang sedang terjadi di lokasi. Sikap ini kurang mencerminkan nilai Berorientasi Pelayanan karena mengabaikan kesempatan untuk mencegah potensi bahaya yang dapat menimpa masyarakat d","source":"AyoCPNS"},{"n":82,"section":"TKP","topic":"Jejaring Kerja","prompt":"Raka mendengar dari beberapa rekan bahwa salah seorang anggota tim sering memberikan penilaian negatif tentang dirinya ketika ia tidak berada di tempat. Namun, setiap bekerja bersama, rekan tersebut tetap bersikap ramah dan kooperatif. Di sisi lain, mereka sedang menangani proyek yang membutuhkan kerja sama yang baik. Sikap Raka sebaiknya...","options":["Tetap bersikap profesional kepada rekan tersebut tanpa mempermasalahkan informasi yang belum dapat dipastikan ke","Mengurangi pembahasan di luar pekerjaan dengan rekan tersebut agar tidak memunculkan kesalahpahaman baru.","Memusatkan perhatian pada penyelesaian proyek sambil menjaga komunikasi kerja tetap berjalan dengan baik.","Mengamati pola interaksi rekan tersebut selama bekerja untuk memastikan ke diterimanya.","Tetap membangun komunikasi kerja yang baik sambil mencari kesempatan mengklarifikasi informasi tersebut secara langsung apabila situasinya telah tepat."],"answer":"E","points":[2,1,3,4,5],"explanation":"E (5 poin) Ini merupakan pilihan terbaik karena Raka tetap menjaga komunikasi dan hubungan kerja yang profesional sambil memilih waktu yang tepat untuk mengklarifikasi informasi tersebut secara langsung kepada rekan yang bersangkutan. Pendekatan ini menghindarkan Raka daripengambilan kesimpulan berdasarkan gosip sekaligus memberikan kesempatan kepadarekan tersebut untuk menjelaskan situasiyang sebenarnya. Langkah tersebut mencerminkannilai Harmonis melalui komunikasi yang saling menghargai serta Kolaboratif dengan menjaga hubungan kerja tetap baik demi kelancaran penyelesaian proyek. D (4 poin) Opsi ini sudah baik karena Raka tidak langsung mempercayai informasi yang diterimanya, melainkan berusaha memastikan kebenarannya melalui pengamatan terhadap interaksi selama bekerja. Sikap tersebut menunjukkan kehati-hatian sebelum mengambil kesimpulan. Namun, langkah ini belum memberikan ruang untuk menyelesaikan kesalahpahaman secara langsung apabila informasi tersebut ternyata benar. C (3 poin) Opsi ini cukup tepat karena Raka tetap memprioritaskan penyelesaian proyek dan menjaga komunikasi kerja agar kolaborasi tim tidak terganggu. Pendekatan tersebut menunjukkan profesionalisme dalam bekerja. Akan tetapi, persoalan yang berpotensi memengaruhi hubungan kerja dibiarkan tanpa upaya untuk memperoleh kejelasan sehingga berisiko terus berlarut AA(2 Poin) Opsi ini menunjukkan sikap profesional dengan tidak mudah terpengaruh oleh informasi yang belum dapat dipastikan kebenarannya. Namun, hanya mengabaikan informasi tersebut membuat potensi kesalahpahaman atau hubungan kerja yang kurang sehat tidak memperoleh penyelesaian apabila informasi tersebut benar adanya. B (1 poin) Opsiini kurang tepat karena memilih membatasi interaksi di luar pekerjaan justru berpotensi memperlebarjarak dalam hubungan kerja. Meskipun bertujuan menghindari kesalahpahaman baru, pendekatan tersebut tidak menyelesaikan akar permasalahan dan dapat mengurangi kualitas kolaborasi dalam tim.","source":"AyoCPNS"},{"n":83,"section":"TKP","topic":"Jejaring Kerja","prompt":"Adiem pernah menjadi rekan satu tim yang cukup akrab dengan Rizky. Setelah promosi jabatan, Rizky menjadi kepala divisi tempat Adiem bekerja. Dalam beberapa kesempatan, Rizky masih sesekali meminta masukan Adiem sebagaimana sebelum promosi, sehingga sebagian rekan mulai menganggap Adiem memperoleh kedekatan khusus. Sikap Adiem sebaiknya...","options":["Tetap memberikan masukan apabila diminta, namun memastikan pembahasannya dilakukan dalam forum kerja yang dapat diketahui pihak terkait.","Mengarahkan setiap pembahasan yang berkaitan dengan pekerjaan agar melibatkan anggota tim lain sehingga prosesnya lebih terbuka.","Menyesuaikan intensitas komunikasi dengan Rizky agar tidak berbeda dengan komunikasi rekan kerja lainnya.","Menghindari memberikan masukan secara langsung kepada Rizky dan memilih menyampaikannya melalui forum rapat.","Tetap menjalankan pola komunikasi yang sudah terbangun karena hubungan baik tidak perlu dipengaruhi penilaian rekan kerja."],"answer":"B","points":[4,5,3,1,2],"explanation":"B (5 poin) Ini merupakan pilihan terbaik karena Adiem tidak hanya menjaga hubungan profesional dengan kepala divisi, tetapi juga membangun proses komunikasi yang lebih terbuka dengan melibatkan anggota tim lain dalam pembahasan pekerjaan. Langkah ini mampu mengurangi persepsi adanya kedekatan khusus, meningkatkan transparansi, serta memperkuat kepercayaan dan kolaborasi di dalam tim. Pendekatan tersebut mencerminkan nilai Kolaboratif melalui pelibatan seluruh anggota tim dan Harmonis dengan menjaga hubungan kerja yangadil sertasaling menghargai AA(4 Poin) Opsi ini sudah baik karena Adiem tetap memberikan masukan sesuai kebutuhan pekerjaan sekaligus memastikan pembahasannya dilakukan dalam forum yang diketahui pihak terkait. Cara ini meningkatkan transparansi dan meminimalkan kesalahpahaman. Namun, langkah tersebut masih bersifat reaktif pada setiap permintaan masukan dan belum secara aktif mendorong keterlibatan anggota tim lainnya. C (3 poin) Opsi ini cukup tepat karena Adiem berupaya menjaga persepsi profesional dengan menyesuaikan intensitas komunikasi agar tidak menimbulkan kesan memperoleh perlakuan khusus. Akan tetapi, fokusnya lebih kepada menjaga citra pribadi daripada membangun mekanisme komunikasi tim yang lebih terbuka dan kolaboratif. E (2 poin) Opsi ini menunjukkan bahwa hubungan baik tidak perlu berubah hanya karena adanya persepsi dari rekan kerja. Meskipun mencerminkan kepercayaan diri dan konsistensi dalam menjalin hubungan profesional, pilihan ini kurang memperhatikan dampak persepsi tersebut terhadap kekompakan dan kepercayaan dalam tim sehingga berpotensi memunculkan prasangka yang terus berkembang. D (1 poin) Opsi ini kurang tepat karena menghindari pemberian masukan secara langsung justru dapat menghambat komunikasi yang dibutuhkan dalam pekerjaan. Meskipun bertujuan menghindari anggapan adanya kedekatan khusus, pendekatan ini terlalu membatasi interaksi profesional yang sebenarnya masih diperlukan dan kurang mendukung efektivitas koordinasi di lingkungan kerja.","source":"AyoCPNS"},{"n":84,"section":"TKP","topic":"Jejaring Kerja","prompt":"Naya bekerja sebagai staf HR di sebuah perusahaan. Seorang karyawan baru beberapa kali menimbulkan kesalahpahaman saat bekerja dengan tim lain karena belum memahami pola komunikasi yang berlaku. Meskipun belum ada pelanggaran disiplin, beberapa unit mulai menyampaikan keluhan kepada HR. Berdasarkan situasi tersebut, tindakan yang paling tepat dilakukan Naya adalah ...","options":["Menggali penyebab kesalahpahaman bersama pihak terkait sebelum menentukan bentuk tindak lanjut.","Memberikan pembinaan kepada karyawan baru mengenai pola komunikasi yang diharapkan perusahaan.","Mendampingi atasan langsung dalam membantu proses penyesuaian karyawan baru di unit kerjanya.","Menggunakan temuan tersebut untuk memperkuat materi orientasi bagi karyawan baru berikutnya.","Memantau perkembangan penyesuaian karyawan baru sambil menilai kebutuhan tindak lanjut berikutnya."],"answer":"A","points":[5,3,4,1,2],"explanation":"A (5 poin) Ini merupakan pilihan terbaik karena Naya terlebih dahulu berupaya memahami akar penyebab kesalahpahaman dengan melibatkan pihak-pihak yang terkait sebelum menentukan bentuk tindak lanjut. Pendekatan ini membuat solusi yang diambil lebih tepat sasaran, menghindari penilaian sepihak, serta menjaga hubungan kerja antartim tetap kondusif. Langkah tersebut mencerminkan nilai Kolaboratif melalui pelibatan berbagai pihak dalam memperoleh informasi yang utuh serta Harmonis dengan mengedepankan penyelesaian yang objektif C (4 poin) Opsi ini sudah baik karena Naya memperkuat peranatasan langsung dalam membantu proses adaptasi karyawan baru di unit kerjanya. Pendekatan ini sesuai dengan jalur pembinaan di lingkungan organisasi dan mendorong penyesuaian berlangsung secara berkelanjutan. Namun, langkah ini dilakukan sebelum penyebab utama kesalahpahaman dipastikan sehingga pembinaan berpotensi kurang tepat sasaran B (3 poin) Opsi ini cukup tepat karena pembinaan mengenai pola komunikasi perusahaan dapat membantu karyawan baru menyesuaikan diri dengan budaya kerja yang berlaku. Akan tetapi, pembinaan langsung tanpa memahami penyebab persoalan terlebih dahulu berisiko mengabaikan faktor lain yang mungkin berasal dari lingkungan kerja atau pola komunikasi antartim E (2 poin) Opsi ini menunjukkan kehati-hatian dengan memantau proses penyesuaian sebelum menentukan tindak lanjut lanjutan. Meskipun bermanfaat untuk melihat perkembangan kondisi. pendekatan ini cenderung menunda penyelesaian masalah yang telah menimbulkan keluhan dari beberapa unit sehingga kebutuhan penanganan awal belum terpenuhi secara optimal D (1 poin) Opsi ini memiliki nilai positif karena memanfaatkan pengalaman tersebut sebagai bahan evaluasi untuk memperbaiki proses orientasi karyawan baru di masa mendatang. Namun, fokusnya lebih mengarah pada perbaikan sistem jangka panjang, sementara persoalan yang sedang terjadi pada karyawan baru dan hubungan kerja antartim belum memperoleh penanganan secara langsung.","source":"AyoCPNS"},{"n":85,"section":"TKP","topic":"Jejaring Kerja","prompt":"Dalam pelaksanaan pelayanan administrasi, unit kerja Juki beberapa kali berkoordinasi dengan unit lain untuk memastikan dokumen masyarakat dapat diproses tepat waktu. Pada suatu kesempatan, seorang pegawai dari unit lain menyampaikan bahwa beberapa dokumen mengalami keterlambatan karena informasi yang diterima dari unit Juki belum lengkap. Pegawai tersebut menyampaikan hal itu secara informal dan berharap persoalan tersebut dapat diselesaikan tanpa menimbulkan kesan bahwa salah satu unit memiliki kinerja yang kurang baik. Menanggapisituasi tersebut, sikap Juki sebaiknya...","options":["Menjelaskan bahwa masukan tersebut akan dijadikan bahan perbaikan sambil memastikan penyebab keterlambatan terlebih dahulu.","Mengajak perwakilan kedua unit menyamakan alur komunikasi agar kendala serupa tidak kembali terjadi.","Menyampaikan kepada rekan satu unit mengenai keluhan tersebut agar respons terhadap unit lain lebih diperhatikan.","Menyarankan pegawai tersebut menyampaikan masukan secara langsung kepada penanggung jawab di unit terkait.","Mencatat masukan tersebut sebagai bahan evaluasi dan berjanji akan membahasnya lebih lanjut kepada pihak tim."],"answer":"A","points":[5,4,3,2,1],"explanation":"A (5 poin) Ini merupakan pilihan terbaik karena Juki menerima masukan secara terbuka sekaligus memastikan penyebab keterlambatan sebelum menentukan langkah perbaikan. Pendekatan ini menjaga kepercayaan dari unit lain, menghindari kesimpulan yang terburu-buru, serta memastikan tindak lanjut dilakukan berdasarkan kondisi yang sebenarnya. Langkah tersebut mencerminkan nilai Kolaboratif melalui pengelolaan masukan secara objektif dan Harmonis dengan tetap menjaga hubungan kerja antar dua unit. B (4 poin) Opsi ini sudah baik karena berupaya membangun kesamaan pemahaman mengenai alur komunikasi agar kendala serupa tidak kembali terjadi. Pendekatan ini berorientasi pada kolaborasi dan perbaikan hubungan kerja. Namun, langkah tersebut dilakukan sebelum penyebab keterlambatan dipastikan sehingga solusi yang dibangun berpotensi belum menyentuh akarpermasalahan. C (3 poin) Opsi ini cukup tepat karena Juki menyampaikan masukan kepada rekan satu unit sebagai pengingat agar respons terhadap unit lain lebih diperhatikan. Langkah ini dapat meningkatkan kepedulian internal. Akan tetapi, penyampaian tersebut belum didahului klarifikasi mengenai penyebab keterlambatan sehingga masih berpotensi menimbulkan persepsi yang kurang tepat di dalam unit D (2 poin) Opsi ini menunjukkan upaya mengarahkan penyampaian masukan kepada pihak yang memiliki tanggung jawab langsung terhadap persoalan tersebut. Meskipun dapat membantu penyelesaian melalui jalur yang tepat, Juki menjadi kurang berperan dalam menindaklanjuti masukan yang telah disampaikan kepadanya sehingga peluang membangun hubungan kerja yang baik menjadi kurang optimal. E (1 poin) Opsiini memiliki nilai positif karena Juki tetap mendokumentasikan masukan sebagai bahan evaluasi tim. Namun, hanya berjanjiakan membahasnya pada kesempatan berikutnya belum memberikan respons awal yang memadai terhadap keluhan yang telah diterima Pendekatan tersebut juga belum menunjukkan upaya memahami penyebab persoalan maupun menjaga komunikasi dengan unit yang menyampaikan masukan. d","source":"AyoCPNS"},{"n":86,"section":"TKP","topic":"Jejaring Kerja","prompt":"Raka ditunjuk sebagai ketua tim proyek yang baru dibentuk. Anggota tim berasal dari beberapa unit berbeda dan sebagian besar belum pernah bekerja bersama, sementara target penyelesaian proyek relatif singkat. Langkah pertama yang sebaiknya dilakukan Raka adalah...","options":["Menyamakan tujuan serta ekspektasi kerja seluruh anggota tim terlebih dahulu.","Mengenali kompetensi setiap anggota sebagai dasar pembagian tanggung jawab tim.","Menyepakati mekanisme koordinasi dan komunikasi sebelum pekerjaan mulai berjalan.","Menetapkan pembagian tugas awal sesuai kebutuhan penyelesaian proyek bersama","Membangun kedekatan antaranggota sebelum memulai pelaksanaan pekerjaan proyek."],"answer":"C","points":[4,3,5,2,1],"explanation":"C (5 poin) ini merupakan pilihan terbaik karena tim terdiri atas anggota dari berbagai unit yang belum pernah bekerja bersama. Menyepakati mekanisme koordinasi dan komunikasi sejak awal akan menjadi landasan bagi seluruh proses kerja, mencegah miskomunikasi, memperjelas alur penyampaian informasi, serta mendukung kolaborasi yang efektif selama proyek berlangsung. Langkah ini mencerminkan nilai Kolaboratif melalui penguatan pola kerja bersama sebelum pelaksanaan tugas dimulai. AA(4 Poin) Opsi ini sudah baik karena menyamakan tujuan dan ekspektasi kerja membantu seluruh anggota memiliki arah yang sama dalam menjalankan proyek. Langkah tersebut dapat meminimalkan perbedaan persepsi mengenai hasil yang ingin dicapai. Namun, tanpa kesepakatan mengenai mekanisme koordinasi, pelaksanaan tujuan tersebut masih berpotensi menghadapi kendala komunikasi antaranggota B (3 poin) Opsi ini cukup tepat karena mengenali kompetensi setiap anggota akan memudahkan pembagian tanggung jawab sesuai kemampuan masing-masing. Langkah tersebut mendukung efektivitas kerja tim. Akan tetapi, pengenalan kompetensi belum menjadi kebutuhan paling mendesak sebelum pola koordinasi antaranggota disepakati D (2 poin) Opsi ini memiliki tujuan yang baik karena pekerjaan dapat segera dimulai melalui pembagian tugas yangjelas. Namun, menetapkan pembagian tugas sebelum adanya kesepakatan mengenai cara berkoordinasi dan berkomunikasi berisiko menimbulkan hambatan dalam pelaksanaan proyek, terutama karena anggota berasal dari unit yang berbeda E (1 poin) Opsiini bernilai positif karena hubungan yang baik antaranggota dapat mendukung suasana kerja yang lebihnyaman. Akan tetapi, pada tahap awal pembentukan tim dengan target penyelesaian yang singkat, membangun kedekatan belum menjadi prioritas utama dibandingkan menyiapkan mekanisme kerja yang memungkinkan kolaborasi berjalan secara efektif","source":"AyoCPNS"},{"n":87,"section":"TKP","topic":"Jejaring Kerja","prompt":"Jamal baru tiga minggu bergabung dalam sebuah tim proyek. Ia menyadari sebagian besar anggota lebih sering berdiskusi dengan rekan yang sudah lama dikenal sehingga komunikasi antaranggota belum berjalan merata. Sikap Jamal sebaiknya...","options":["Membangun komunikasi dengan anggota dari berbagai kelompok kerja secara bertahap.","Menyesuaikan diri sambil memahami pola komunikasi yang berkembang dalam tim.","Melibatkan anggota yang berbeda ketika berdiskusi maupun menyelesaikan pekerjaan bersama.","Menjalin hubungan kerja tanpa membedakan kedekatan dengan setiap anggota tim.","Berpartisipasi aktif dalam setiap diskusi bersama anggota dari berbagai kelompok."],"answer":"C","points":[4,1,5,3,2],"explanation":"C (5 poin) Ini merupakan pilihan terbaik karena Jamal secara aktif melibatkan anggota yang berbeda dalam setiap diskusi maupun pelaksanaan pekerjaan sesuai kapasitasnya sebagai anggota tim. Langkah ini membantu memperluas interaksi antarkelompok, mengurangi kecenderungan terbentuknya kelompok-kelompok kecil, serta memperkuat kolaborasi tanpa melampaui kewenangannya. Pendekatan tersebut mencerminkan nilai Kolaboratif melalui keterlibatan lintas anggota serta Harmonis dengan membangun hubungan kerja yang inklusif. AA(4 Poin) Opsi ini sudah baik karena Jamal mulai membangun Komunikasi dengan anggota dari berbagai kelompok secara bertahap. Langkah tersebut menunjukkan inisiatif untuk memperluas jejaring kerja dan mempererat hubungan antarrekan. Namun, pendekatan ini masih berfokus pada membangunrelasi, belum secara langsung mendorong kolaborasi dalam pelaksanaan pekerjaan D (3 poin) Opsi ini cukup tepat karena Jamal berupaya menjalin hubungan kerja secara adil tanpa membedakan tingkat kedekatan dengan anggota lain. Sikap tersebut dapat menciptakan suasana kerja yang lebih nyaman dan saling menghargai. Akan tetapi, tindakan ini masih bersifat pasif dan belum secara nyata memperluas interaksi kerja lintas kelompok. E (2 poin) Opsi ini menunjukkan sikap aktif dengan berpartisipasi dalam berbagai diskusi bersama anggota dari kelompok yang berbeda. Meskipun dapat memperluas interaksi, peran Jamal masih sebatas mengikuti forum yang sudah ada sehingga dampaknya terhadap pemerataan komunikasi antaranggota relatif lebih terbatas dibandingkan melibatkan anggota yang berbeda dalam aktivitas kerja B (1 poin) Opsiini memiliki nilai positif karena menunjukkan kemauan untuk beradaptasi dengan lingkungan kerja yang baru. Namun, hanya menyesuaikan diri dengan pola komunikasi yang telah berkembang belum membantu mengatasi kondi
