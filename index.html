<script>
const QUESTIONS = [{"n":1,"section":"TWK","topic":"Bahasa Indonesia","prompt":"(1) Pancasila sebagai dasar negara memiliki kedudukan yang sangat fundamental dalam kehidupan berbangsa dan bernegara. (2) Nilai-nilai Pancasila harus tercermin dalam setiap produk hukum yang dibuat oleh lembaga legislatif. (3) Mahkamah Konstitusi berwenang menguji undang-undang terhadap UUD 1945. (4) Penyimpangan terhadap nilai Pancasila dalam kebijakan publik dapat mengancam persatuan dan kesatuan bangsa. (5) Oleh karena itu, setiap warga negara wajib memahami dan mengamalkan Pancasila dalam kehidupan sehari-hari. Kalimat yang tidak koheren ditunjukkan oleh kalimat nomor ...","options":["Kalimat 1","Kalimat 2","Kalimat 3","Kalimat 4","Kalimat 5"],"answer":"C","points":[0,0,5,0,0],"explanation":"• A. Kalimat 1 adalah gagasan utama tentang kedudukan Pancasila.\n• B. Kalimat 2 relevan, membahas Pancasila dalam produk hukum.\n• C. Kalimat 3 membahas kewenangan MK yang tidak berkaitan langsung dengan tema pengamalan Pancasila.\n• D. Kalimat 4 mendukung tema dengan menyebut dampak penyimpangan Pancasila.\n• E. Kalimat 5 merupakan simpulan yang koheren dengan gagasan utama.","source":"AyoCPNS"},{"n":2,"section":"TWK","topic":"Bahasa Indonesia","prompt":"Teknologi digital kini banyak dimanfaatkan dalam dunia pendidikan untuk mendukung proses pembelajaran. Guru dapat menggunakan berbagai media digital untuk menyampaikan materi, sementara siswa dapat mengakses sumber belajar secara lebih mudah dan luas. Pembelajaran juga dapat dilakukan secara daring ketika kondisi tidak memungkinkan kegiatan tatap muka. Namun, penggunaan teknologi tetap perlu disertai kemampuan memilih informasi yang tepat dan menggunakannya secara bijak. Dengan demikian, pemanfaatan teknologi digital memberikan kemudahan sekaligus tantangan dalam proses pembelajaran. Gagasan utama paragraf tersebut adalah ...","options":["Guru memanfaatkan media digital untuk menyampaikan materi pembelajaran.","Siswa dapat mengakses berbagai sumber belajar melalui teknologi digital.","Pembelajaran daring menjadi salah satu manfaat teknologi dalam pendidikan.","Penggunaan teknologi digital memberikan kemudahan sekaligus tantangan dalam pembelajaran.","Penggunaan teknologi perlu disertai kemampuan memilih informasi secara bijak."],"answer":"D","points":[0,0,0,5,0],"explanation":"D. Paling tepat karena merangkum seluruh isi paragraf, yaitu manfaat dan tantangan penggunaan teknologi digital dalam pembelajaran. A. Hanya membahas peran guru dalam penggunaan teknologi. B. Hanya membahas kemudahan siswa mengakses sumber belajar. C. Hanya membahas salah satu bentuk pemanfaatan teknologi. E. Hanya membahas salah satu tantangan penggunaan teknologi.","source":"AyoCPNS"},{"n":3,"section":"TWK","topic":"Bahasa Indonesia","prompt":"Dalam laporan keuangan global, disebutkan adanya peningkatan moneterisasi pada sektor digital yang berdampak pada perubahan pola investasi. Penulisan baku dari kata “moneterisasi\" adalah ...","options":["Monetisasi","Moneterisasi","Monetarisme","Moneterum","Monetisasi"],"answer":"A","points":[5,0,0,0,0],"explanation":"• “moneterisasi” adalah bentuk tidak baku.\n• A benar → monetisasi (proses mengubah sesuatu menjadi sumber pendapatan).\n• B salah → bentuk serapan tidak tepat.\n• C salah → paham ekonomi (monetarisme), beda makna.\n• D salah → tidak ada di KBBI.\n• E salah → penambahan huruf.","source":"AyoCPNS"},{"n":4,"section":"TWK","topic":"Bahasa Indonesia","prompt":"(1) Pemerintah terus mendorong optimalisasi pelayanan publik melalui pemanfaatan teknologi digital. (2) Setiap pegawai dituntut memiliki kompetensi yang sesuai dengan bidang tugasnya. (3) Proses pelayanan harus dilakukan secara transparan agar masyarakat memperoleh informasi yang jelas. (4) Evaluasi dilakukan secara berkala untuk mengidentifikasi berbagai kendala yang muncul dalam pelaksanaan program. (5) Langkah tersebut diharapkan dapat meningkatkan kwalitas pelayanan kepada masyarakat. Manakah kata bercetak tebal yang TIDAK BAKU pada paragraf tersebut?","options":["Optimalisasi (kalimat 1)","Pegawai (kalimat 2)","Transparan (kalimat 3)","Berkala (kalimat 4)","Kwalitas (kalimat 5)"],"answer":"E","points":[0,0,0,0,5],"explanation":"A. Optimalisasi → BENAR. Kata optimalisasi merupakan bentuk baku yang berarti proses atau tindakan mengoptimalkan sesuatu. B. Pegawai → BENAR. Kata pegawai merupakan bentuk baku untuk menyebut orang yang bekerja pada suatu lembaga atau instansi. C. Transparan → BENAR. Kata transparan merupakan bentuk baku yang berarti terbuka dan mudah diketahui oleh pihak yang berkepentingan. D. Berkala → BENAR. Kata berkala merupakan bentuk baku yang berarti dilakukan secara teratur pada waktu tertentu. E. Kwalitas → SALAH. Bentuk kwalitas tidak baku. Bentuk yang tepat adalah kualitas, yang berarti mutu atau tingkat baik buruknya sesuatu.","source":"AyoCPNS"},{"n":5,"section":"TWK","topic":"Bahasa Indonesia","prompt":"Perubahan iklim global semakin terasa dalam beberapa tahun terakhir. Suhu bumi meningkat, pola cuaca menjadi tidak menentu, dan bencana alam seperti banjir serta kekeringan terjadi lebih sering. Aktivitas manusia seperti pembakaran bahan bakar fosil, deforestasi, dan industri yang menghasilkan emisi karbon tinggi menjadi penyebab utama kondisi ini. Berbagai negara di dunia telah berupaya menekan dampaknya melalui kebijakan pengurangan emisi dan pengembangan energi terbarukan. Namun, keberhasilan upaya tersebut sangat bergantung pada kesadaran dan kerja sama semua pihak, termasuk masyarakat. Gagasan pokok paragraf tersebut adalah...","options":["Bencana alam yang sering terjadi akibat perubahan iklim","Aktivitas manusia penyebab perubahan iklim","Dampak perubahan iklim global terhadap bumi","Perubahan iklim global dan upaya penanganannya","Penggunaan energi terbarukan di berbagai negara"],"answer":"D","points":[0,0,0,5,0],"explanation":"• A salah: hanya fokus pada dampak (bencana), tidak mencakup penyebab dan upaya.\n• B salah: hanya membahas penyebab, terlalu sempit.\n• C salah: hanya membahas dampak perubahan iklim, belum mencakup solusi.\n• D benar: mencakup inti keseluruhan paragraf: masalah perubahan iklim + upaya penanganan.\n• E salah: hanya salah satu contoh solusi, terlalu spesifik.","source":"AyoCPNS"},{"n":6,"section":"TWK","topic":"Bahasa Indonesia","prompt":"(1) Pemerintah terus meningkatkan kualitas pendidikan melalui penyediaan sarana belajar yang memadai di berbagai daerah. (2) Program tersebut juga mencakup pemberian pelatihan kepada guru agar mampu menerapkan metode pembelajaran yang sesuai dengan kebutuhan peserta didik. (3) Sekolah didorong untuk menciptakan lingkungan belajar yang nyaman, penyediaan fasilitas pendukung, dan meningkatkan kompetensi tenaga pendidik. (4) Selain itu, evaluasi pembelajaran dilakukan secara berkala untuk mengetahui perkembangan kemampuan siswa. (5) Upaya tersebut diharapkan dapat menciptakan sistem pendidikan yang merata dan berkualitas bagi seluruh masyarakat. Kalimat tidak efektif pada paragraf tersebut ditunjukkan oleh nomor...","options":["1","2","3","4","5"],"answer":"C","points":[0,0,5,0,0],"explanation":"A. (1) — BENAR. Struktur kalimat jelas dan hubungan antargagasannya logis. B. (2) — BENAR. Unsur kalimat tersusun secara jelas dan mudah dipahami. C. (3) — SALAH. Tidak terdapat kesejajaran bentuk dalam rincian, yaitu menciptakan (verba), penyediaan (nomina), dan meningkatkan (verba). Seharusnya menggunakan bentuk verba yang sejajar. Perbaikan: “Sekolah didorong untuk menciptakan lingkungan belajar yang nyaman, menyediakan fasilitas pendukung, dan meningkatkan kompetensi tenaga pendidik.” D. (4) — BENAR. Kalimat memiliki struktur yang efektif dan informasi yang disampaikan jelas. E. (5) — BENAR. Kalimat tersusun dengan baik dan tidak memiliki masalah struktur.","source":"AyoCPNS"},{"n":7,"section":"TWK","topic":"Pilar Negara","prompt":"Selama satu periode keanggotaan, MPR tidak pernah menyelenggarakan sidang karena dianggap tidak terdapat agenda ketatanegaraan yang mendesak. Penilaian yang paling tepat terhadap kondisi tersebut adalah...","options":["Tidak sesuai dengan konstitusi karena MPR wajib bersidang sedikitnya satu kali dalam satu masa keanggotaan.","Sesuai dengan konstitusi karena dengan kondisi tersebut, seluruh anggota MPR menyepakati penundaan sidang.","Sesuai dengan konstitusi karena sidang MPR hanya dilaksanakan apabila terdapat agenda ketatanegaraan.","Tidak sesuai dengan konstitusi karena MPR wajib bersidang setiap tahun selama masa keanggotaannya.","Tidak sesuai dengan konstitusi karena MPR wajib bersidang sedikitnya dua kali dalam satu masa keanggotaan."],"answer":"A","points":[5,0,0,0,0],"explanation":"Opsi A adalah jawaban terbaik. Hal ini karena Pasal 2 ayat (2) UUD NRI Tahun 1945 mengatur bahwa MPR bersidang sedikitnya satu kali dalam lima tahun di ibu kota negara. Ketentuan tersebut menunjukkan bahwa penyelenggaraan sidang MPR merupakan kewajiban konstitusional yang harus dipenuhi, bukan bergantung pada ada atau tidaknya agenda ketatanegaraan yang dianggap mendesak. Oleh karena itu, tidak diselenggarakannya sidang selama satu masa keanggotaan bertentangan dengan amanat konstitusi. Opsi B kurang tepat karena kesepakatan seluruh anggota MPR tidak dapat mengesampingkan kewajiban yang telah ditentukan oleh UUD NRI Tahun 1945. Opsi C juga tidak tepat karena konstitusi tidak mensyaratkan adanya agenda tertentu sebagai dasar penyelenggaraan sidang MPR. Opsi D memiliki tujuan untuk meningkatkan intensitas persidangan, tetapi konstitusi tidak mewajibkan MPR bersidang setiap tahun. Sementara itu, Opsi E juga bertentangan dengan ketentuan konstitusi karena UUD NRI Tahun 1945 hanya mengatur kewajiban sidang sedikitnya satu kali dalam satu periode lima tahunan, bukan sedikitnya dua kali. Oleh karena itu, Opsi A paling sesuai karena secara tepat menggambarkan kewajiban konstitusional MPR dalam menyelenggarakan sidang selama masa keanggotaannya.","source":"AyoCPNS"},{"n":8,"section":"TWK","topic":"Pilar Negara","prompt":"Dalam situasi tertentu, muncul usulan agar pemerintah dapat mengambil tindakan di luar ketentuan peraturan perundang-undangan apabila dinilai mampu memberikan manfaat yang lebih besar bagi masyarakat. Pertimbangan yang paling tepat adalah...","options":["Kemanfaatan masyarakat dapat menjadi dasar utama pengambilan kebijakan pemerintah.","Kepentingan umum dapat didahulukan sepanjang tidak menimbulkan keresahan baru.","Efektivitas penyelenggaraan pemerintahan perlu menjadi prioritas dalam setiap keadaan.","Fleksibilitas kebijakan diperlukan agar pemerintah dapat merespons perkembangan masyarakat.","Setiap tindakan pemerintah harus memiliki landasan hukum sebagai bagian supremasi hukum."],"answer":"E","points":[0,0,0,0,5],"explanation":"Opsi E adalah jawaban terbaik. Hal ini karena Pasal 1 ayat (3) UUD NRI Tahun 1945 menegaskan bahwa Indonesia adalah negara hukum, sehingga seluruh tindakan pemerintah harus didasarkan pada hukum yang berlaku dan tidak boleh semata-mata didasarkan pada pertimbangan manfaat, efektivitas, atau kepentingan tertentu. Prinsip ini bertujuan mencegah penyelenggara negara menggunakan kewenangannya secara sewenang-wenang serta menjamin adanya kepastian hukum bagi setiap warga negara. Opsi A tetap memiliki dasar pemikiran yang benar karena setiap kebijakan memang harus memberikan manfaat bagi masyarakat, tetapi kemanfaatan tidak dapat dijadikan dasar utama apabila mengesampingkan hukum. Opsi B juga logis karena kepentingan umum merupakan tujuan penyelenggaraan pemerintahan, namun pelaksanaannya tetap harus berada dalam koridor hukum. Opsi C menekankan pentingnya efektivitas pemerintahan, tetapi efektivitas tidak boleh dicapai dengan mengabaikan prinsip legalitas. Sementara itu, Opsi D memberikan ruang bagi pemerintah untuk beradaptasi terhadap perkembangan masyarakat, namun fleksibilitas kebijakan tetap dibatasi oleh ketentuan peraturan perundang-undangan. Oleh karena itu, Opsi E paling sesuai dengan semangat UUD NRI Tahun 1945 karena menempatkan hukum sebagai landasan utama setiap tindakan pemerintah, bukan sekadar sebagai pelengkap dalam penyelenggaraan pemerintahan.","source":"AyoCPNS"},{"n":9,"section":"TWK","topic":"Pilar Negara","prompt":"Perubahan iklim global meningkatkan frekuensi bencana alam, mengganggu produksi pangan, serta mengancam kawasan pesisir di berbagai wilayah Indonesia. Menghadapi kondisi tersebut, langkah yang paling strategis untuk memperkuat ketahanan NKRI adalah...","options":["Membangun tata kelola pembangunan yang mampu mengintegrasikan penguatan ketahanan pangan, energi, lingkungan, dan kesiapsiagaan bencana secara berkelanjutan.","Memastikan setiap kebijakan pembangunan nasional mempertimbangkan potensi risiko perubahan iklim terhadap kepentingan masyarakat.","Memperkuat kapasitas pemerintah pusat dan daerah dalam mengantisipasi dampak perubahan iklim melalui koordinasi lintas sektor.","Mengembangkan sistem mitigasi dan adaptasi berbasis ilmu pengetahuan serta teknologi untuk mengurangi dampak perubahan iklim.","Meningkatkan kolaborasi dengan berbagai negara dalam mempercepat penanganan perubahan iklim dan pengembangan teknologi ramah lingkungan."],"answer":"A","points":[5,0,0,0,0],"explanation":"Opsi A adalah jawaban terbaik. Hal ini karena perubahan iklim merupakan ancaman nonmiliter yang berdampak pada banyak sektor sekaligus, seperti pangan, energi, lingkungan, kesehatan, hingga kebencanaan. Oleh karena itu, penguatan ketahanan NKRI tidak cukup dilakukan melalui kebijakan sektoral, tetapi memerlukan tata kelola pembangunan yang mampu mengintegrasikan berbagai sektor strategis agar negara memiliki kapasitas menghadapi dampak perubahan iklim secara menyeluruh dan berkelanjutan. Opsi B masih logis karena memasukkan pertimbangan risiko perubahan iklim ke dalam setiap kebijakan pembangunan merupakan langkah penting, tetapi lebih berfokus pada tahap perencanaan kebijakan. Opsi C juga tepat karena penguatan kapasitas pemerintah dan koordinasi lintas sektor akan meningkatkan efektivitas penanganan di lapangan, namun masih merupakan bagian dari pelaksanaan strategi yang lebih besar. Opsi D relevan karena pemanfaatan ilmu pengetahuan dan teknologi berperan dalam meningkatkan kemampuan adaptasi dan mitigasi, tetapi hanya menjadi salah satu instrumen untuk mencapai ketahanan nasional. Opsi E juga bernilai strategis karena kerja sama internasional dapat mempercepat pertukaran teknologi dan pengalaman, namun keberhasilannya tetap bergantung pada kesiapan tata kelola nasional. Dengan demikian, membangun keterpaduan kebijakan pembangunan lintas sektor merupakan langkah paling mendasar karena menjadi fondasi bagi seluruh upaya negara dalam menjaga ketahanan NKRI menghadapi perubahan iklim.","source":"AyoCPNS"},{"n":10,"section":"TWK","topic":"Pilar Negara","prompt":"Sebuah instansi pemerintah menemukan adanya upaya pihak asing memperoleh akses terhadap data dan informasi strategis melalui kerja sama yang tampak legal. Meskipun belum ditemukan kebocoran data, aktivitas tersebut dinilai berpotensi mengganggu kepentingan nasional. Langkah yang paling strategis untuk menjaga keutuhan NKRI adalah...","options":["Memperkuat sistem pengamanan informasi melalui sinergi antar lembaga dalam melindungi aset strategis negara.","Meningkatkan pengawasan terhadap seluruh bentuk kerja sama dengan pihak asing yang melibatkan instansi pemerintah.","Menyempurnakan mekanisme pengelolaan data strategis agar lebih adaptif terhadap perkembangan teknologi.","Mengembangkan kapasitas aparatur negara dalam mengenali potensi ancaman terhadap keamanan informasi.","Memperluas kerja sama internasional dalam penanggulangan kejahatan lintas negara yang berkaitan dengan keamanan siber."],"answer":"A","points":[5,0,0,0,0],"explanation":"Opsi A adalah jawaban terbaik. Hal ini karena ancaman spionase terhadap negara tidak cukup dihadapi dengan pengawasan atau peningkatan kemampuan individu semata, tetapi memerlukan sistem pengamanan informasi yang terintegrasi antarlembaga untuk melindungi aset dan data strategis negara. Dalam konsep NKRI, menjaga kedaulatan di era modern tidak hanya dilakukan melalui pertahanan militer, tetapi juga melalui perlindungan informasi strategis sebagai bagian dari ketahanan nasional terhadap ancaman nonmiliter. Opsi B masih logis karena pengawasan terhadap kerja sama dengan pihak asing dapat mengurangi peluang terjadinya penyalahgunaan akses, tetapi sifatnya lebih preventif pada aktivitas tertentu dan belum membangun sistem perlindungan yang menyeluruh. Opsi C juga tepat karena mekanisme pengelolaan data yang adaptif akan meningkatkan keamanan informasi, namun lebih berfokus pada aspek teknis pengelolaan data. Opsi D penting karena aparatur yang memahami pola ancaman akan lebih siap melakukan deteksi dini, tetapi peningkatan kapasitas sumber daya manusia merupakan salah satu unsur pendukung dalam sistem keamanan informasi. Opsi E juga bernilai strategis karena kerja sama internasional dapat memperkuat penanganan kejahatan lintas negara, tetapi perlindungan terhadap kepentingan strategis tetap harus bertumpu pada kemampuan sistem keamanan nasional.","source":"AyoCPNS"},{"n":11,"section":"TWK","topic":"Pilar Negara","prompt":"Perhatikan sikap berikut! (W) Nadia menyisihkan waktu setiap akhir pekan untuk mendampingi anak-anak penyandang disabilitas belajar membaca. (2) Raka tetap memperlakukan setiap peserta seleksi secara setara tanpa membedakan suku, agama, maupun latar belakang keluarganya. (3) Dimas mengutamakan penggunaan produk dalam negeri sebagai bentuk dukungan terhadap perekonomian nasional. (4) Sinta tetap melaksanakan keputusan rapat organisasi meskipun usulannya tidak menjadi pilihan bersama. (5) Arga mengajak warga bergotong royong membersihkan lingkungan agar fasilitas umum tetap nyaman digunakan. Sikap yang mencerminkan pengamalan Sila Rantai Emas adalah...","options":["(1) dan (2)","(1) dan (3)","(2) dan (4)","(3) dan (5)","(4) dan (5)"],"answer":"A","points":[5,0,0,0,0],"explanation":"Opsi A adalah jawaban terbaik. Hal ini karena pernyataan (1) dan (2) sama-sama mencerminkan pengamalan Sila Kedua Pancasila, yaitu menjunjung tinggi nilai kemanusiaan melalui kepedulian terhadap sesama serta memperlakukan setiap orang secara setara tanpa membedakan latar belakangnya. Mendampingi anak-anak penyandang disabilitas menunjukkan sikap gemar melakukan kegiatan kemanusiaan, sedangkan memberikan perlakuan yang sama kepada seluruh peserta seleksi mencerminkan pengakuan terhadap persamaan derajat, hak, dan kewajiban setiap manusia. Pernyataan (3) merupakan bentuk kecintaan terhadap bangsa melalui penggunaan produk dalam negeri yang lebih tepat dikaitkan dengan Sila Ketiga. Pernyataan (4) menunjukkan sikap menghormati hasil musyawarah yang merupakan pengamalan Sila Keempat, sedangkan pernyataan (5) lebih mencerminkan semangat gotong royong dalam menjaga kepentingan bersama yang berkaitan dengan Sila Kelima.","source":"AyoCPNS"},{"n":12,"section":"TWK","topic":"Pilar Negara","prompt":"Pemerintah daerah berencana membangun jalur khusus pesepeda dengan mengurangi sebagian area parkir di pusat kota. Kebijakan tersebut mendapat dukungan karena dinilai mendorong transportasi ramah lingkungan, tetapi sebagian pelaku usaha menolak karena khawatir mengurangi kenyamanan pelanggan. Dalam mempertimbangkan kebijakan tersebut, prinsip yang paling mencerminkan pengamalan nilai Pancasila adalah...","options":["Menetapkan kebijakan yang memberikan manfaat paling besar bagi pembangunan daerah dalam jangka panjang.","Menyeimbangkan kepentingan seluruh pihak tanpa mengurangi hak setiap warga untuk memperoleh perlakuanyang adil.","Mengutamakan kepentingan kelompok yang terdampak secara langsung agar kebijakan tidak menimbulkan penolakan.","Memastikan setiap kebijakan tetap memberikan ruang bagi terpenuhinya hak masyarakat tanpa mengabaikan kepentingan umum.","Menyesuaikan pelaksanaan kebijakan berdasarkan perkembangan aspirasi masyarakat selama proses penerapannya."],"answer":"D","points":[0,0,0,5,0],"explanation":"Opsi D adalah jawaban terbaik. Hal ini karena situasi dalam soal menguji pengamalan Sila Kelima Pancasila, khususnya butir menghormati hak orang lain. Dalam menetapkan suatu kebijakan publik, pemerintah tidak hanya mempertimbangkan kepentingan kelompok tertentu, tetapi juga harus memastikan bahwa hak setiap warga tetap terlindungi tanpa mengesampingkan kepentingan umum. Penyediaan jalur khusus pesepeda maupun pengurangan area parkir sama-sama berkaitan dengan pemenuhan hak masyarakat dalam memanfaatkan ruang publik secara adil. Oleh karena itu, kebijakan yang paling tepat adalah kebijakan yang tetap memberikan ruang bagi terpenuhinya hak seluruh pihak dengan mempertimbangkan kepentingan bersama. Opsi A merupakan pertimbangan yang benar karena berorientasi pada manfaat pembangunan jangka panjang, namun lebih menitikberatkan pada tujuan pembangunan daripada perlindungan hak setiap warga yang menjadi inti persoalan. Opsi B juga bernilai positif karena berupaya menyeimbangkan kepentingan seluruh pihak sekaligus menjamin perlakuan yang adil, tetapi fokus utamanya lebih mengarah pada keseimbangan kepentingan, sedangkan nilai yang diuji adalah penghormatan terhadap hak setiap pihak dalam memanfaatkan fasilitas publik. Opsi C menunjukkan kepedulian terhadap kelompok yang terdampak langsung oleh kebijakan, namun mengutamakan kepentingan satu kelompok berpotensi mengurangi hak kelompok lain yang juga menggunakan ruang publik. Opsi E mencerminkan sikap adaptif dengan mempertimbangkan perkembangan aspirasi masyarakat selama pelaksanaan kebijakan, tetapi lebih berorientasi pada penyesuaian implementasi daripada memastikan sejak awal bahwa kebijakan tersebut tetap menghormati hak seluruh warga secara proporsional.","source":"AyoCPNS"},{"n":13,"section":"TWK","topic":"Bela Negara","prompt":"Perhatikan poin berikut: (1) Meningkatkan kompetensi keamanan siber. (2) Menggunakan aplikasi berstandar keamanan internasional. (3) Menyusun laporan kinerja tahunan yang ditetapkan negara. (4) Melaksanakan segala kode etik aparatur sipil. (5) Menjaga kerahasiaan data strategis negara.","options":["1 dan 5","2 dan 4","1 dan 3","3 dan 5","4 dan 3"],"answer":"A","points":[5,0,0,0,0],"explanation":"Opsi A (1 dan 5) adalah jawaban terbaik. Hal ini karena kedua poin tersebut paling mencerminkan nilai Kemampuan Awal Bela Negara dalam konteks pelaksanaan tugas ASN. Poin (1) menunjukkan upaya meningkatkan kesiapan dan kemampuan menghadapi ancaman nonmiliter yang semakin berkembang di era digital, sedangkan poin (5) menunjukkan kesadaran untuk melindungi informasi strategis yang berkaitan dengan kepentingan negara. Kedua tindakan tersebut tidak hanya mendukung pelaksanaan pekerjaan, tetapi juga berkontribusi terhadap ketahanan nasional. Adapun poin (2) menggunakan aplikasi berstandar keamanan internasional lebih merupakan pilihan teknis untuk mendukung efektivitas pekerjaan. Sementara itu, poin (3) menyusun laporan kinerja tahunan dan poin (4) melaksanakan kode etik aparatur sipil merupakan kewajiban profesional yang mencerminkan tanggung jawab, disiplin, dan integritas ASN. Meskipun seluruh poin merupakan tindakan positif, hanya poin (1) dan (5) yang secara langsung menunjukkan kesiapan menghadapi ancaman serta perlindungan terhadap kepentingan negara yang menjadi inti dari nilai Bela Negara.","source":"AyoCPNS"},{"n":14,"section":"TWK","topic":"Bela Negara","prompt":"Seorang ASN menginisiasi kerja sama antara pemerintah daerah, pelaku usaha, dan masyarakat untuk memperluas pemasaran produk unggulan daerah. Program tersebut mampu meningkatkan daya saing produk lokal sekaligus membuka lapangan kerja baru bagi masyarakat. Tujuan paling utama dari tindakan ASN tersebut adalah...","options":["Meningkatkan kemandirian ekonomi masyarakat melalui pengembangan potensi daerah.","Memperkuat daya saing produk lokal agar mampu bersaing di pasar yang lebih luas.","Mendukung pertumbuhan ekonomi daerah melalui kolaborasi berbagai pemangku kepentingan.","Memperkuat ketahanan bangsa melalui peningkatan kemandirian ekonomi nasional.","Mendorong partisipasi masyarakat dalam mendukung program pembangunan pemerintah."],"answer":"D","points":[0,0,0,5,0],"explanation":"Opsi D adalah jawaban terbaik. Hal ini karena tindakan ASN tersebut tidak hanya bertujuan meningkatkan perekonomian daerah, tetapi juga memperkuat ketahanan bangsa melalui terwujudnya kemandirian ekonomi nasional. Dalam perspektif Bela Negara, upaya memperkuat daya saing produk lokal, membuka lapangan kerja, dan memberdayakan potensi daerah merupakan implementasi nilai Cinta Tanah Air, yang pada akhirnya bermuara pada terciptanya ketahanan nasional di bidang ekonomi. Adapun opsi A berfokus pada peningkatan kemandirian ekonomi masyarakat sebagai dampak langsung program. Opsi B hanya menitikberatkan pada peningkatan daya saing produk lokal, sedangkan opsi C lebih menyoroti kolaborasi sebagai strategi pembangunan daerah. Sementara itu, opsi E menggambarkan partisipasi masyarakat sebagai faktor pendukung keberhasilan program. Meskipun seluruh opsi merupakan tujuan yang relevan, hanya opsi D yang paling mencerminkan tujuan fundamental Bela Negara, yaitu memperkuat ketahanan bangsa melalui penguatan kemampuan nasional di bidang ekonomi.","source":"AyoCPNS"},{"n":15,"section":"TWK","topic":"Bela Negara","prompt":"Seorang apoteker tidak hanya menyerahkan obat sesuai resep, tetapi juga memastikan setiap pasien memahami cara penggunaan obat, kemungkinan efek samping, serta pentingnya menggunakan obat secara tepat tanpa membedakan latar belakang sosial maupun kemampuan ekonomi pasien. Tujuan paling utama dari tindakan apoteker tersebut adalah...","options":["Mewujudkan pelayanan kesehatan yang menghargai harkat dan martabat setiap manusia.","Mendukung terciptanya pelayanan kefarmasian yang adil bagi seluruh lapisan masyarakat.","Memperkuat perlindungan masyarakat melalui penggunaan obat yang aman dan bertanggung jawab.","Menumbuhkan kesadaran masyarakat untuk menggunakan obat sesuai kebutuhan medis.","Meningkatkan kualitas pelayanan kesehatan melalui edukasi kefarmasian yang berkelanjutan."],"answer":"A","points":[5,0,0,0,0],"explanation":"Opsi A adalah jawaban terbaik. Hal ini karena tindakan apoteker tersebut menunjukkan penghormatan terhadap harkat dan martabat setiap pasien melalui pemberian pelayanan dan edukasi yang setara, sehingga setiap orang memperoleh kesempatan yang sama untuk menggunakan obat secara aman dan tepat. Dalam perspektif Bela Negara, sikap tersebut merupakan implementasi nilai Setia kepada Pancasila sebagai Ideologi Negara, khususnya pengamalan nilai kemanusiaan yang adil dan beradab dalam menjalankan profesi. Adapun opsi B lebih menitikberatkan pada terciptanya keadilan dalam pelayanan kefarmasian sebagai dampak dari tindakan tersebut. Opsi C berfokus pada perlindungan masyarakat melalui penggunaan obat yang aman dan bertanggung jawab, sedangkan opsi D menekankan peningkatan kesadaran masyarakat dalam menggunakan obat sesuai kebutuhan medis. Sementara itu, opsi E lebih mengarah pada peningkatan kualitas pelayanan kesehatan melalui edukasi yang berkelanjutan. Meskipun seluruh opsi merupakan tujuan yang relevan, hanya opsi A yang paling mencerminkan nilai dasar yang melandasi tindakan apoteker tersebut, yaitu penghormatan terhadap nilai kemanusiaan sebagai bagian dari pengamalan ideologi negara dalam kehidupan sehari-hari.","source":"AyoCPNS"},{"n":16,"section":"TWK","topic":"Bela Negara","prompt":"Perhatikan poin berikut: (1) Mengembangkan koleksi referensi yang menampilkan sejarah, budaya, dan potensi daerah sesuai kebutuhan masyarakat. (2) Menyusun dan merapikan daftar usulan pengadaan koleksi berdasarkan hasil inventarisasi perpustakaan. (3) Memfasilitasi masyarakat menelusuri dan membandingkan berbagai sumber informasi sebelum mengambil suatu kesimpulan. (4) Membangun kolaborasi dengan sekolah dan komunitas untuk memperluas budaya literasi di lingkungan sekitar. (5) Menata dan membagikan kembali koleksi perpustakaan agar memudahkan proses pencarian bahan pustaka.","options":["(1) dan (2)","(3) dan (5)","(1) dan (4)","(2) dan (4)","(3) dan (4)"],"answer":"E","points":[0,0,0,0,5],"explanation":"Opsi E adalah jawaban terbaik. Hal ini karena poin (3) dan (4) secara langsung menunjukkan peran pustakawan dalam membangun masyarakat yang cakap informasi dan memiliki budaya literasi yang kuat. Memfasilitasi masyarakat untuk menelusuri serta membandingkan berbagai sumber informasi merupakan bentuk penguatan kemampuan berpikir kritis dalam menghadapi hoaks dan disinformasi, sedangkan membangun kolaborasi dengan sekolah dan komunitas memperluas budaya literasi sebagai fondasi terbentuknya warga negara yang berpengetahuan dan bertanggung jawab. Dalam perspektif Bela Negara, kedua tindakan tersebut merupakan implementasi nilai Kemampuan Awal Bela Negara dan Sadar Berbangsa dan Bernegara, karena berkontribusi membangun kualitas sumber daya manusia yang mampu menghadapi tantangan kehidupan berbangsa. Adapun poin (1) lebih berorientasi pada pengembangan koleksi perpustakaan sesuai kebutuhan masyarakat sebagai bagian dari pengelolaan layanan informasi. Poin (2) menyusun usulan pengadaan koleksi merupakan kegiatan administratif dalam pengelolaan perpustakaan, sedangkan poin (5) menata dan membagikan kembali koleksi berkaitan dengan peningkatan kemudahan akses layanan perpustakaan. Meskipun seluruh poin merupakan praktik yang baik dalam menjalankan profesi pustakawan, hanya poin (3) dan (4) yang secara langsung berorientasi pada penguatan karakter dan kapasitas masyarakat sebagai implementasi nilai Bela Negara.","source":"AyoCPNS"},{"n":17,"section":"TWK","topic":"Bela Negara","prompt":"Maraknya kebocoran data pribadi di berbagai layanan digital meningkatkan risiko penyalahgunaan identitas, penipuan, hingga kejahatan siber yang dapat merugikan masyarakat. Dalam menghadapi kondisi tersebut, sikap yang paling","options":["Membiasakan memverifikasi keamanan aplikasi, tautan, dan permintaan akses data sebelum memberikan informasi pribadi secara digital.","Mendorong penyelenggara layanan digital menerapkan sistem perlindungan data yang lebih baik bagi pengguna","Mengajak masyarakat mendukung kerja sama berbagai pihak dalam memperkuat penanganan kejahatan siber.","Meluangkan waktu untuk mendampingi masyarakat mengenali pentingnya menjaga keamanan data pribadi saat beraktivitas di ruang digital.","Menjaga kepercayaan masyarakat terhadap pemanfaatan teknologi digital dengan menggunakan layanan elektronik secara bertanggung jawab."],"answer":"A","points":[5,0,0,0,0],"explanation":"Opsi A adalah jawaban terbaik. Hal ini karena Kemampuan Awal Bela Negara menekankan kesiapan setiap warga negara dalam mengenali, mengantisipasi, dan menghadapi berbagai bentuk ancaman, termasuk ancaman nonmiliter di ruang digital. Membiasakan memverifikasi keamanan aplikasi, tautan, dan permintaan akses data sebelum memberikan informasi pribadi merupakan tindakan nyata yang menunjukkan kemampuan individu dalam melindungi diri dari penyalahgunaan data serta berbagai bentuk kejahatan siber. Adapun opsi B merupakan langkah yang penting, namun lebih berorientasi pada tanggung jawab penyelenggara layanan digital dalam membangun sistem perlindungan data, bukan kemampuan dasar yang harus dimiliki setiap warga negara. Opsi C menekankan kerja sama berbagai pihak dalam penanganan kejahatan siber yang lebih mencerminkan nilai Sadar Berbangsa dan Bernegara melalui sinergi untuk menjaga kepentingan bersama. Sementara itu, opsi D menunjukkan kesediaan meluangkan waktu untuk mendampingi masyarakat sehingga lebih tepat menggambarkan nilai Rela Berkorban untuk Bangsa dan Negara. Adapun opsi E berfokus pada upaya menjaga kepercayaan terhadap pemanfaatan teknologi digital melalui penggunaan layanan elektronik secara bertanggung jawab, namun belum secara langsung menunjukkan kemampuan individu dalam mengenali dan menghadapi ancaman digital. Meskipun seluruh pilihan merupakan langkah positif dalam menciptakan ekosistem digital yang aman, hanya opsi A yang paling tepat karena menitikberatkan pada kesiapan dan kemampuan individu menghadapi ancaman siber sebagai implementasi Kemampuan Awal Bela Negara.","source":"AyoCPNS"},{"n":18,"section":"TWK","topic":"Bela Negara","prompt":"Pemerintah mengembangkan program Koperasi Desa/Kelurahan Merah Putih (Kopdes/Kel) sebagai salah satu upaya memperkuat perekonomian masyarakat di tingkat desa. Meskipun efektivitas program tersebut masih menjadi perdebatan di tengah masyarakat, pemerintah tetap perlu memastikan pelaksanaannya memberikan manfaat yang nyata. Sikap pemerintah yang paling mencerminkan nilai Cinta Tanah Air adalah...","options":["Memastikan setiap pelaksanaan program memberikan manfaat yang seimbang bagi seluruh lapisan masyarakat.","Mendorong pengelolaan koperasi yang adaptif terhadap perkembangan kebutuhan ekonomi masyarakat desa.","Mengarahkan pengembangan koperasi agar bertumpu pada potensi unggulan daerah sebagai penggerak kemajuan bangsa.","Membuka ruang kolaborasi antara pemerintah, masyarakat, dan pelaku usaha dalam penyempurnaan pelaksanaan program.","Menyiapkan pendampingan berkelanjutan bagi pengelola koperasi agar tata kelola program berjalan lebih optimal."],"answer":"C","points":[0,0,5,0,0],"explanation":"Opsi C adalah jawaban terbaik. Hal ini karena nilai Cinta Tanah Air tidak hanya diwujudkan melalui rasa bangga terhadap Indonesia, tetapi juga melalui komitmen memanfaatkan potensi yang dimiliki bangsa sebagai kekuatan utama dalam pembangunan. Mengarahkan pengembangan koperasi agar bertumpu pada potensi unggulan daerah menunjukkan upaya mengoptimalkan sumber daya dalam negeri untuk mendorong kemajuan bangsa secara berkelanjutan. Adapun opsi A lebih menekankan pemerataan manfaat program sehingga lebih mencerminkan nilai Setia kepada Pancasila sebagai Ideologi Negara, khususnya keadilan sosial. Opsi B berfokus pada kemampuan koperasi beradaptasi terhadap perkembangan kebutuhan masyarakat yang lebih tepat menggambarkan Kemampuan Awal Bela Negara. Sementara itu, opsi D menitikberatkan pada sinergi antarpemangku kepentingan yang lebih mencerminkan nilai Sadar Berbangsa dan Bernegara, sedangkan opsi E berorientasi pada peningkatan kapasitas pengelola koperasi sebagai aspek penguatan sumber daya manusia. Meskipun seluruh pilihan merupakan langkah yang baik dalam mendukung keberhasilan program, hanya opsi C yang paling tepat karena menempatkan pemanfaatan potensi daerah sebagai kekuatan untuk memajukan bangsa, sehingga paling mencerminkan implementasi nilai Cinta Tanah Air.","source":"AyoCPNS"},{"n":19,"section":"TWK","topic":"Integritas","prompt":"Perhatikan sikap berikut: 1. Seorang pegawai pelayanan publik tetap mengikuti seluruh tahapan administrasi meskipun terdapat permintaan percepatan proses dari pihak tertentu. 2. Kepala bidang tetap membuka hasil evaluasi program kepada masyarakat meskipun laporan tersebut berpotensi memunculkan kritik terhadap instansinya. 3. Seorang kepala laboratorium tetap menyelesaikan laporan penggunaan anggaran penelitian meskipun masa pelaksanaan proyek telah berakhir dan sebagian tim sudah tidak lagi terlibat aktif. 4. ASN tetap menggunakan kendaraan operasional lama selama masih layak digunakan untuk kegiatan dinas sehari-","options":["1 dan 2","1 dan 4","2 dan 3","3 dan 5","4 dan 5"],"answer":"D","points":[0,0,0,5,0],"explanation":"Opsi D adalah jawaban terbaik. Poin 3 paling dominan mencerminkan nilai tanggung jawab karena kepala laboratorium tetap menyelesaikan laporan penggunaan anggaran penelitian meskipun proyek telah berakhir dan sebagian tim sudah tidak lagi terlibat aktif. Poin 5 juga menunjukkan tanggung jawab sebab ketua panitia memastikan seluruh fasilitas yang dipinjam dikembalikan dengan baik setelah kegiatan selesai dilaksanakan. Fokus utama kedua poin tersebut terletak pada penyelesaian kewajiban dan amanah yang melekat pada tugasnya hingga tuntas. Poin 1 lebih dekat dengan nilai disiplin karena menekankan kepatuhan terhadap tahapan administrasi. Poin 2 dominan pada nilai jujur sebab berkaitan dengan keterbukaan hasil evaluasi kepada masyarakat meskipun berpotensi memunculkan kritik terhadap instansi. Sedangkan poin 4 lebih mencerminkan nilai sederhana karena berkaitan dengan penggunaan fasilitas secara proporsional dan tidak berlebihan.","source":"AyoCPNS"},{"n":20,"section":"TWK","topic":"Integritas","prompt":"Mohammad Hatta diketahui pernah mengurungkan niat membeli sepatu merek Bally yang diinginkannya karena merasa kebutuhan tersebut belum layak dipenuhi dalam kondisi yang ada saat itu. Sikap tersebut menunjukkan bahwa integritas seorang tokoh bangsa tercermin dari...","options":["Kemampuan menjaga keseimbangan antara kebutuhan pribadi dan tanggung jawab sebagai pejabat negara.","Pandangan bahwa kedudukan dalam pemerintahan tidak seharusnya digunakan untuk memenuhi keinginan di luar kebutuhan yang wajar.","Kesediaan membatasi pemenuhan kepentingan pribadi meskipun memiliki kesempatan dan kedudukan yang dapat mempermudahnya.","Keteguhan mempertahankan pola hidup yang tetap dekat dengan kondisi masyarakat pada masa perjuangan bangsa.","Keinginan menunjukkan bahwa perjuangan dan jabatan negara tidak identik dengan kemewahan maupun fasilitas pribadi."],"answer":"C","points":[0,0,5,0,0],"explanation":"Opsi C adalah jawaban terbaik. Sikap Mohammad Hatta paling dominan mencerminkan nilai sederhana karena fokus utamanya terletak pada kesediaan membatasi pemenuhan keinginan pribadi meskipun ia memiliki kedudukan yang dapat mempermudahnya memperoleh barang tersebut. Dalam konteks ini, inti moralnya bukan sekadar tidak membeli sepatu, melainkan kemampuan menahan diri agar jabatan dan kedudukan tidak menjadi alasan untuk memenuhi kepentingan pribadi secara berlebihan. Opsi A lebih dekat dengan tanggung jawab dalam menempatkan kebutuhan pribadi dan tugas negara secara seimbang. Opsi B terlihat sangat dekat karena berkaitan dengan penggunaan kedudukan negara, namun orientasinya lebih mengarah pada etika jabatan. Opsi D lebih menonjolkan kedekatan hidup dengan masyarakat. Sedangkan opsi E lebih berorientasi pada pandangan moral mengenai jabatan negara dan kemewahan pribadi secara umum.","source":"AyoCPNS"},{"n":21,"section":"TWK","topic":"Integritas","prompt":"Seorang petugas laboratorium sekolah tetap menunda penggunaan alat praktikum baru karena proses pengecekan keamanan dan administrasi belum sepenuhnya selesai meskipun beberapa guru meminta alat tersebut segera digunakan agar kegiatan belajar tidak tertunda. Dalam kondisi tersebut, sikap petugas laboratorium paling mencerminkan...","options":["Kesediaan menjaga keselamatan dan kenyamanan seluruh pengguna laboratorium sebelum alat digunakan dalam kegiatan belajar.","Keteguhan mempertahankan keputusan kerja berdasarkan prosedur yang diyakini benar meskipun mendapat dorongan dari pihak lain.","Kesungguhan memastikan seluruh proses pemeriksaan alat dilakukan secara rinci agar tidak menimbulkan kendala dalam penggunaan.","Kesadaran menjaga tanggung jawab pengelolaan fasilitas sekolah agar penggunaan alat tetap dapat dipertanggung jawabkan.","Konsistensi menjalankan tahapan penggunaan fasilitas sesuai ketentuan meskipun terdapat tuntutan untuk mempercepat pelaksanaan kegiatan."],"answer":"E","points":[0,0,0,0,5],"explanation":"Opsi E adalah jawaban terbaik. Fokus utama dalam narasi soal terletak pada konsistensi petugas laboratorium menjalankan tahapan penggunaan alat sesuai ketentuan meskipun terdapat tuntutan untuk mempercepat kegiatan belajar. Hal tersebut paling dominan mencerminkan orientasi disiplin terhadap prosedur kerja. Opsi A lebih dekat dengan nilai peduli karena berorientasi pada keselamatan dan kenyamanan pengguna laboratorium. Opsi B mencerminkan nilai mandiri sebab menekankan keteguhan mengambil keputusan berdasarkan pertimbangan sendiri. Opsi C lebih mengarah pada kerja keras karena berfokus pada kesungguhan melakukan pemeriksaan secara rinci. Sedangkan opsi D lebih mencerminkan tanggung jawab dalam pengelolaan fasilitas sekolah.","source":"AyoCPNS"},{"n":22,"section":"TWK","topic":"Integritas","prompt":"Setelah kembali dari masa pembuangan, Ki Hajar Dewantara tidak memilih menjauh dari persoalan bangsanya. Ia justru menempuh jalur pendidikan sebagai sarana untuk mempersiapkan generasi yang mampu menentukan masa depannya sendiri. Jika semangat tersebut diterapkan pada masa kini, tindakan yang paling tepat adalah...","options":["Mengembangkan berbagai pendekatan baru agar proses pembelajaran mampu menyesuaikan kebutuhan zaman.","Mengupayakan lingkungan yang memberikan kesempatan berkembang bagi setiap individu tanpa membedakan latar belakangnya.","Mendorong masyarakat untuk terus meningkatkan kapasitas dirinya agar mampu menghadapi perubahan yang terjadi.","Menggunakan kemampuan yang dimiliki untuk membantu masyarakat memperoleh akses yang lebih baik terhadap pendidikan.","Tetap mengambil bagian dalam menyelesaikan persoalan bersama melalui peran yang dimiliki meskipun terdapat berbagai keterbatasan."],"answer":"E","points":[0,0,0,0,5],"explanation":"Opsi E adalah jawaban terbaik. Hal ini karena Ki Hajar Dewantara tidak berhenti berkontribusi bagi bangsa meskipun menghadapi berbagai pembatasan pada masa kolonial. Ia memilih jalur pendidikan sebagai bentuk pengabdian yang dapat terus dilakukan sesuai peran dan kemampuan yang dimilikinya. Sikap tersebut mencerminkan nilai tanggung jawab, yaitu kesediaan untuk tetap menjalankan peran dan memberikan kontribusi terhadap tujuan yang diyakini penting meskipun menghadapi berbagai keterbatasan. Opsi A lebih dekat dengan nilai kerja keras karena menekankan upaya pengembangan dan penyempurnaan. Opsi B mencerminkan nilai adil melalui pemberian kesempatan yang setara. Opsi C lebih menggambarkan mandiri karena berfokus pada peningkatan kapasitas diri. Sementara itu, opsi D lebih dekat dengan nilai peduli karena menekankan bantuan terhadap kebutuhan masyarakat. Seluruh opsi bernilai positif, namun opsi E paling sesuai dengan keteladanan Ki Hajar Dewantara yang tetap mengambil peran dalam memajukan bangsa melalui jalan pendidikan.","source":"AyoCPNS"},{"n":23,"section":"TWK","topic":"Integritas","prompt":"Raden Saleh dikenal sebagai salah satu pelukis Indonesia yang memperoleh pengakuan internasional pada masanya. Kemampuan tersebut tidak diperoleh secara instan, melainkan melalui proses belajar, latihan, dan pengembangan keterampilan yang dilakukan secara berkelanjutan selama bertahun-tahun. Jika semangat tersebut diterapkan pada masa kini, tindakan yang paling tepat adalah...","options":["Mengarahkan kemampuan yang dimiliki agar dapat memberikan kontribusi yang bermanfaat bagi lingkungan sekitar.","Mengembangkan kemampuan secara konsisten melalui proses belajar dan latihan agar kualitas hasil yang dicapai terus meningkat.","Memanfaatkan berbagai pengalaman sebagai sarana untuk memperkaya wawasan dan meningkatkan kualitas diri.","Tetap menjalankan proses pengembangan diri meskipun hasil yang diharapkan belum terlihat dalam waktu dekat.","Menggunakan sumber daya yang dimiliki secara proporsional agar tujuan yang ingin dicapai dapat terlaksana dengan baik."],"answer":"B","points":[0,5,0,0,0],"explanation":"Opsi B adalah jawaban terbaik. Hal ini karena keberhasilan Raden Saleh tidak lahir dari bakat semata, melainkan dari proses belajar dan latihan yang dilakukan secara terus-menerus untuk meningkatkan kualitas karyanya. Semangat tersebut menunjukkan kesungguhan dalam mengembangkan kemampuan hingga mencapai hasil yang optimal. Dalam konteks integritas, sikap ini paling mencerminkan nilai kerja keras, yaitu melakukan usaha secara berkelanjutan dan tidak mudah berhenti sebelum mencapai kualitas yang diharapkan. Opsi A lebih dekat dengan nilai peduli karena menekankan kontribusi yang diberikan kepada lingkungan. Opsi C menggambarkan nilai mandiri melalui upaya memperkaya kemampuan dan wawasan berdasarkan pengalaman yang dimiliki. Opsi D lebih dekat dengan nilai tanggung jawab karena menekankan komitmen untuk tetap menjalankan proses yang telah menjadi bagian dari perannya meskipun hasilnya belum segera terlihat. Sementara itu, opsi E mencerminkan nilai sederhana karena menekankan penggunaan sumber daya secara proporsional dan tidak berlebihan. Seluruh opsi bernilai positif, namun opsi B paling sesuai dengan keteladanan Raden Saleh yang mencapai keberhasilannya melalui proses belajar dan latihan yang panjang serta berkesinambungan.","source":"AyoCPNS"},{"n":24,"section":"TWK","topic":"Integritas","prompt":"Kongres Pemuda II mempertemukan berbagai organisasi kepemudaan yang berasal dari latar belakang daerah, budaya, dan kepentingan yang berbeda. Meskipun demikian, para peserta kongres mampu mencapai kesepahaman mengenai arah perjuangan yang akan ditempuh bersama tanpa menempatkan identitas kelompok tertentu sebagai yang paling utama. Jika semangat tersebut diterapkan pada masa kini, tindakan yang paling tepat adalah...","options":["Mendorong setiap kelompok untuk tetap mempertahankan identitasnya sambil membangun kesepahaman dalam tujuan bersama.","Mengupayakan agar berbagai pandangan yang berbeda dapat dipertimbangkan dalam proses pengambilan keputusan bersama.","Mengembangkan berbagai kegiatan dan aktivitas komunal yang dapat mempererat hubungan antarkelompok dalam kehidupan sehari-hari.","Menjaga dan mempertahankan komitmen seluruh pihak terhadap kesepakatan yang telah ditetapkan bersama.","Memberikan ruang dan kesempatan yang sama kepada setiap kelompok untuk menyampaikan pandangan dalam menentukan keputusan bersama."],"answer":"E","points":[0,0,0,0,5],"explanation":"Opsi E adalah jawaban terbaik. Hal ini karena keberhasilan Kongres Pemuda II tidak hanya terletak pada tercapainya kesepakatan bersama, tetapi juga pada kesediaan para pemuda dari berbagai organisasi untuk menempatkan seluruh peserta pada kedudukan yang setara dalam proses perjuangan. Perbedaan daerah, budaya, dan latar belakang tidak dijadikan alasan untuk memberikan hak yang lebih besar kepada kelompok tertentu. Dalam konteks integritas, sikap tersebut paling mencerminkan nilai adil, yaitu memberikan kesempatan dan perlakuan yang sama kepada setiap pihak tanpa membedakan identitas yang dimiliki. Opsi A lebih dekat dengan nilai peduli karena menekankan penghargaan terhadap keberagaman sekaligus menjaga kebersamaan. Opsi B mencerminkan nilai adil, tetapi masih berfokus pada pertimbangan terhadap berbagai pandangan dalam proses pengambilan keputusan, bukan pada kesetaraan kesempatan bagi setiap kelompok untuk berpartisipasi. Opsi C lebih dekat dengan nilai peduli karena menekankan upaya mempererat hubungan antarkelompok. Sementara itu, opsi D mencerminkan nilai tanggung jawab melalui komitmen untuk menjaga dan melaksanakan kesepakatan yang telah ditetapkan bersama.","source":"AyoCPNS"},{"n":25,"section":"TWK","topic":"Nasionalisme","prompt":"Perhatikan dampak berikut ini:\na. Menurunnya kecenderungan masyarakat memilah informasi faktual akibat ketergantungan pada media pemerintah.\nb. Meningkatnya minat generasi muda dalam mempelajari sejarah perjuangan bangsa.\nc. Munculnya tuntutan agar daerah lebih mandiri dalam menentukan arah pembangunannya.\nd. Bertambahnya rasa memiliki terhadap kebijakan negara karena mewakili kepentingan rakyat.\ne. Menurunnya kepercayaan publik terhadap forum diskusi politik dan kebangsaan.\nDampak yang paling menunjukkan melemahnya nasionalisme terdapat pada huruf...","options":["c dan e","a dan c","b dan e","b dan d","a dan e"],"answer":"E","points":[0,0,0,0,5],"explanation":"Opsi E adalah jawaban terbaik. Hal ini karena nasionalisme berkaitan dengan keterikatan terhadap identitas bangsa, kepercayaan pada kehidupan kebangsaan, dan partisipasi dalam menjaga persatuan negara. Poin a menunjukkan melemahnya kesadaran masyarakat dalam menyaring informasi faktual yang dapat memicu disinformasi dan polarisasi sosial, sedangkan poin e mencerminkan menurunnya kepercayaan publik terhadap ruang diskusi politik dan kebangsaan sebagai sarana menjaga kehidupan demokrasi dan persatuan bangsa. Poin b dan d justru menunjukkan penguatan nasionalisme karena berkaitan dengan meningkatnya kesadaran sejarah dan rasa memiliki terhadap negara. Sementara poin c belum tentu melemahkan nasionalisme karena tuntutan kemandirian daerah masih dapat berjalan dalam kerangka NKRI.","source":"AyoCPNS"},{"n":26,"section":"TWK","topic":"Nasionalisme","prompt":"Budaya cancel culture di media sosial semakin berkembang seiring banyaknya youtuber dan streamer yang melakukan siaran secara provokatif, kemudian memicu penghakiman massal dari masyarakat digital tanpa proses klarifikasi yang utuh.","options":["Meningkatnya konflik sosial di ruang digital akibat perbedaan pandangan antarkelompok masyarakat.","Berkembangnya budaya menghakimi yang melemahkan nilai persatuan dan kedewasaan demokrasi masyarakat.","Menurunnya kualitas kebebasan berekspresi masyarakat karena perasaan takut mendapatkan tekanan publik.","Munculnya polarisasi sosial akibat masyarakat lebih mudah terpengaruh opini digital yang viral.","Berkurangnya kepercayaan masyarakat terhadap ruang publik digital sebagai sarana membangun kehidupan kebangsaan."],"answer":"B","points":[0,5,0,0,0],"explanation":"Opsi B adalah jawaban terbaik. Hal ini karena nasionalisme Pancasila tidak hanya berbicara mengenai cinta tanah air, tetapi juga bagaimana masyarakat menjaga persatuan, menghormati sesama warga negara, dan menyelesaikan perbedaan secara dewasa dalam kehidupan demokrasi. Budaya cancel culture yang berkembang tanpa proses klarifikasi yang memadai mendorong masyarakat untuk lebih mudah menghakimi, menyerang, bahkan memusuhi pihak lain hanya berdasarkan opini yang viral di media sosial. Jika hal ini terus terjadi, maka masyarakat akan semakin terbiasa menyelesaikan perbedaan dengan tekanan massa, bukan dengan dialog dan sikap saling menghormati. Kondisi tersebut berbahaya karena dapat melemahkan rasa persatuan dan kedewasaan demokrasi yang menjadi bagian penting dalam nasionalisme Indonesia. Opsi A, C, D, dan E memang merupakan dampak yang logis dari budaya cancel culture, tetapi lebih merupakan efek turunan dari masalah utamanya, yaitu melemahnya nilai persatuan dan harmoni sosial dalam kehidupan berbangsa.","source":"AyoCPNS"},{"n":27,"section":"TWK","topic":"Nasionalisme","prompt":"Maraknya praktik judi online di kalangan masyarakat mulai berdampak pada meningkatnya masalah ekonomi, kriminalitas digital, hingga menurunnya produktivitas generasi muda. Dalam perspektif nasionalisme, tindakan yang paling tepat dilakukan masyarakat untuk menghadapi kondisi tersebut adalah...","options":["Menghindari lingkungan digital dan beralih pada kegiatan tradisional sebagai langkah antisipasi promosi praktik perjudian online secara terbuka.","Mengingatkan keluarga dan lingkungan sekitar mengenai dampak judi online terhadap masa depan generasi muda dan kehidupan sosial masyarakat.","Memperketat pengawasan aktivitas ekonomi digital masyarakat sekitar secara masif guna mengurangi praktik judi online.","Mengikuti kampanye digital anti-judi online yang diselenggarakan oleh lembaga dan komunitas sosial masyarakat.","Membatasi penggunaan media sosial sebagai langkah utama mengurangi penyebaran perjudian online di masyarakat."],"answer":"B","points":[0,5,0,0,0],"explanation":"Opsi B adalah jawaban terbaik. Hal ini karena nasionalisme tidak hanya diwujudkan melalui simbol kebangsaan, tetapi juga melalui kepedulian masyarakat dalam menjaga kualitas generasi dan kehidupan sosial bangsa. Mengingatkan keluarga dan lingkungan sekitar mengenai dampak judi online menunjukkan adanya rasa tanggung jawab sosial untuk melindungi masyarakat dari perilaku yang dapat merusak produktivitas, masa depan generasi muda, dan stabilitas kehidupan bersama. Opsi A dan E lebih bersifat pembatasan individual yang belum tentu menyelesaikan akar masalah. Sementara opsi C cenderung berlebihan karena pengawasan aktivitas ekonomi masyarakat bukan sepenuhnya peran warga negara. Adapun opsi D memang positif sebagai bentuk partisipasi sosial, tetapi masih bersifat mengikuti gerakan yang sudah ada, bukan keterlibatan langsung dalam menjaga lingkungan sosial masyarakat.","source":"AyoCPNS"},{"n":28,"section":"TWK","topic":"Nasionalisme","prompt":"Pada masa pergerakan nasional, berbagai organisasi lahir dengan latar belakang yang berbeda. Meskipun demikian, organisasi-organisasi tersebut mampu mendorong tumbuhnya nasionalisme yang semakin kuat. Faktor yang paling menentukan kondisi tersebut adalah...","options":["Berkembangnya kesadaran untuk memperjuangkan kepentingan masyarakat melalui organisasi modern.","Meningkatnya kemampuan masyarakat dalam menyampaikan aspirasi secara kolektif dan terarah.","Tumbuhnya pemahaman bahwa berbagai kelompok memiliki tujuan perjuangan yang saling berkaitan.","Menguatnya pandangan bahwa kemajuan bangsa memerlukan kerja sama lintas latar belakang masyarakat.","Terbentuknya kesadaran bahwa perbedaan identitas tidak menghalangi lahirnya cita-cita kebangsaan yang sama."],"answer":"E","points":[0,0,0,0,5],"explanation":"A. Benar sebagai bagian dari perkembangan pergerakan, tetapi belum menekankan persatuan antarkelompok.\nB. Menunjukkan perkembangan partisipasi masyarakat, tetapi belum menjadi faktor utama tumbuhnya nasionalisme.\nC. Menunjukkan kesadaran akan tujuan bersama, tetapi belum secara tegas menyoroti keberagaman identitas.\nD. Menekankan pentingnya kerja sama, tetapi belum menjelaskan kesadaran kebangsaan secara mendalam.\nE. Paling tepat karena menunjukkan bahwa perbedaan latar belakang dapat disatukan oleh cita-cita kebangsaan yang sama.","source":"AyoCPNS"},{"n":29,"section":"TWK","topic":"Nasionalisme","prompt":"Budi Utomo sering dianggap sebagai pelopor Kebangkitan Nasional karena memperkenalkan pola perjuangan yang berbeda dibandingkan dengan perlawanan-perlawanan","options":["Memperkuat kemampuan masyarakat dalam mengoptimalkan potensi bangsa untuk menjawab tantangan masa depan.","Membangun ekosistem yang mendorong masyarakat terus beradaptasi terhadap perubahan lingkungan strategis.","Meningkatkan kualitas kapasitas nasional agar mampu menghasilkan kemajuan yang berkelanjutan.","Mengembangkan berbagai instrumen pembangunan yang memperluas kesempatan masyarakat untuk berkembang.","Menciptakan fondasi kemajuan bangsa melalui penguatan kualitas manusia sebagai penggerak utama pembangunan."],"answer":"E","points":[0,0,0,0,5],"explanation":"Opsi E adalah jawaban terbaik. Hal ini karena Budi Utomo memperjuangkan kemajuan bangsa melalui peningkatan kualitas manusia, sehingga penguatan kualitas manusia sebagai penggerak utama pembangunan paling mencerminkan nilai perjuangannya. Bagi Budi Utomo, kemajuan bangsa tidak berawal dari kekayaan sumber daya, kekuatan ekonomi, ataupun pembangunan fisik, melainkan dari manusia yang memiliki pengetahuan, kemampuan, dan kapasitas untuk memajukan bangsanya. Opsi A kurang tepat karena berfokus pada optimalisasi potensi bangsa yang merupakan hasil dari kualitas manusia yang baik. Opsi B kurang tepat karena kemampuan beradaptasi terhadap perubahan merupakan konsekuensi dari kapasitas manusia yang telah berkembang. Opsi C kurang tepat karena peningkatan kapasitas nasional masih terlalu luas dan tidak secara langsung menempatkan manusia sebagai fondasi utama kemajuan. Opsi D kurang tepat karena perluasan kesempatan berkembang merupakan instrumen pembangunan, sedangkan yang menjadi akar pemikiran Budi Utomo adalah pembangunan kualitas manusianya terlebih dahulu. Oleh karena itu, penguatan kualitas manusia sebagai fondasi kemajuan bangsa merupakan implementasi yang paling sesuai dengan semangat perjuangan Budi Utomo.","source":"AyoCPNS"},{"n":30,"section":"TWK","topic":"Nasionalisme","prompt":"Pada masa kolonial, Tiga Serangkai melalui Indische Partij mengkritik sistem yang membedakan masyarakat berdasarkan ras dan status sosial. Gagasan tersebut kemudian menjadi salah satu fondasi penting dalam perkembangan nasionalisme Indonesia. Jika semangat perjuangan tersebut diterapkan dalam kehidupan berbangsa saat ini, sikap yang paling sesuai adalah...","options":["Mengutamakan kepentingan nasional dibanding kepentingan kelompok yang dapat mempersempit persatuan bangsa.","Memperkuat kerja sama antarkelompok masyarakat untuk menjaga stabilitas sosial dalam kehidupan berbangsa.","Mengembangkan ruang dialog yang memungkinkan setiap kelompok menyampaikan aspirasinya secara setara.","Mendorong keterlibatan masyarakat dalam berbagai kegiatan yang memperkuat semangat kebangsaan.","Mewujudkan Indonesia yang bersatu dengan meminimalkan perbedaan pandangan dan identitas di masyarakat."],"answer":"A","points":[5,0,0,0,0],"explanation":"Opsi A adalah jawaban terbaik. Hal ini karena semangat utama yang diperjuangkan Tiga Serangkai melalui Indische Partij adalah menghapus sekat-sekat rasial dan sosial yang dibangun kolonialisme serta menumbuhkan kesadaran bahwa kepentingan bangsa harus ditempatkan di atas kepentingan golongan, ras, maupun kelompok tertentu. Nasionalisme yang mereka perjuangkan bukan sekadar hidup berdampingan, tetapi membangun loyalitas bersama kepada bangsa Indonesia. Opsi B kurang tepat karena kerja sama antarkelompok merupakan sarana untuk memperkuat persatuan, bukan nilai inti yang diperjuangkan. Opsi C kurang tepat karena dialog yang setara merupakan mekanisme untuk mengelola keberagaman, bukan tujuan utama dari gagasan Indische Partij. Opsi D kurang tepat karena keterlibatan dalam kegiatan kebangsaan merupakan bentuk implementasi nasionalisme yang lahir setelah terbentuknya kesadaran kebangsaan. Opsi E kurang tepat karena mengandung asumsi bahwa persatuan dapat dicapai dengan meminimalkan perbedaan pandangan dan identitas, padahal Indische Partij justru memperjuangkan nasionalisme yang inklusif dengan menyatukan berbagai identitas dalam satu cita-cita kebangsaan tanpa menghilangkan keberagaman yang ada.","source":"AyoCPNS"},{"n":31,"section":"TIU","topic":"Verbal · Analogi","prompt":"Hubungan objek pada kalimat “Seorang kurator memilih lukisan, menyusun tema, dan menempatkan karya untuk membangun alur pameran yang menarik” setara dengan ...","options":["Seorang editor membaca naskah, memperbaiki bahasa, dan menyusun paragraf untuk menghasilkan tulisan yang runtut.","Seorang fotografer membawa kamera, memilih lensa, dan mengambil gambar untuk menghasilkan dokumentasi.","Seorang arsitek membuat denah, memilih bahan, dan membangun gedung untuk menyediakan tempat tinggal.","Seorang peneliti mengumpulkan data, menggunakan komputer, dan menulis laporan untuk menyampaikan hasil penelitian.","Seorang guru memilih buku, memberikan tugas, dan menilai siswa untuk meningkatkan hasil belajar."],"answer":"A","points":[5,0,0,0,0],"explanation":"Hubungan objek: menyeleksi bahan → menata unsur → menghasilkan susunan yang koheren. • A. Naskah diseleksi, bahasa diperbaiki, paragraf ditata agar tulisan runtut.\n• B. Kamera dan lensa merupakan alat, bukan unsur yang disusun menjadi satu kesatuan.\n• C. Denah dan bahan merupakan bagian proses pembangunan, bukan penyusunan alur.\n• D. Komputer merupakan alat bantu, sedangkan data dan laporan berbeda fungsi.\n• E. Buku, tugas, dan penilaian merupakan sarana pembelajaran, bukan unsur yang ditata menjadi alur.","source":"AyoCPNS"},{"n":32,"section":"TIU","topic":"Verbal · Analogi","prompt":"REGULASI : MASYARAKAT : KEPATUHAN - INSENTIF : PEKERJA : ...","options":["Upah","Motivasi","Produktivitas","Penghargaan","Kesejahteraan"],"answer":"C","points":[0,0,5,0,0],"explanation":"A. Upah merupakan bentuk kompensasi. B. Motivasi merupakan dorongan psikologis. C. Insentif mendorong pekerja meningkatkan produktivitas. D. Penghargaan dapat menjadi bentuk insentif. E. Kesejahteraan merupakan dampak lebih luas. Pola: instrumen → sasaran → respons yang diharapkan.","source":"AyoCPNS"},{"n":33,"section":"TIU","topic":"Verbal · Analogi","prompt":"Kalimat yang berpola sama dengan “Keberhasilan program itu menjadi harapan masyarakat.\" adalah ...","options":["Pemerintah menetapkan program tersebut sebagai prioritas.","Keputusan itu dianggap sebagai langkah strategis.","Masyarakat mengikuti program tersebut dengan antusias.","Panitia menyampaikan hasil kegiatan kepada peserta.","Perubahan kebijakan itu berlangsung secara bertahap."],"answer":"B","points":[0,5,0,0,0],"explanation":"Subjek: Keberhasilan program itu.\nPredikat: menjadi.\nPelengkap: harapan masyarakat.\nPola kalimat tersebut adalah S–P–Pel, sama dengan “Keputusan itu dianggap sebagai langkah strategis.” A. ✕ S–P–O–Pel → Pemerintah – menetapkan – program tersebut – sebagai prioritas.\nB. ✓ S–P–Pel → Keputusan itu – dianggap – sebagai langkah strategis.\nC. ✕ S–P–O–K → Masyarakat – mengikuti – program tersebut – dengan antusias.\nD. ✕ S–P–O–Pel → Panitia – menyampaikan – hasil kegiatan – kepada peserta.\nE. ✕ S–P–K → Perubahan kebijakan itu – berlangsung – secara bertahap.","source":"AyoCPNS"},{"n":34,"section":"TIU","topic":"Verbal · Penalaran","prompt":"Argumen I: Penerapan sistem reservasi daring dapat mengurangi kepadatan antrean pada layanan administrasi rumah sakit. Argumen 2: Pengurangan antrean melalui sistem reservasi daring membutuhkan pembagian jadwal kedatangan pasien yang sesuai dengan kapasitas pelayanan setiap waktu. Fakta di lapangan: Beberapa rumah sakit yang telah menerapkan reservasi daring tetap mengalami penumpukan pasien pada jam tertentu karena sebagian besar pasien memilih jadwal kedatangan yang sama, sementarajumlah petugas pada jam tersebut terbatas.","options":["Memperkuat argumen 1","Memperkuat argumen 2","Memperlemah argumen 1","Memperlemah argumen 2","Tidak relevan dengan argumen 1 atau 2"],"answer":"B","points":[0,5,0,0,0],"explanation":"Argumen 2 menyatakan bahwa pengurangan antrean membutuhkan pembagian jadwal sesuai kapasitas pelayanan. A salah, karena fakta tidak menunjukkan bahwa reservasi daring secara umum berhasil mengurangi antrean.\nB benar, karena penumpukan terjadi akibat jadwal kedatangan terkonsentrasi pada waktu tertentu sementara kapasitas petugas terbatas. Hal ini mendukung pentingnya pengaturan jadwal sesuai kapasitas.\nC salah, karena fakta tidak membuktikan bahwa reservasi daring tidak dapat mengurangi antrean.\nD salah, karena fakta justru mendukung perlunya pembagian jadwal yang sesuai kapasitas.\nE salah, karena fakta berkaitan langsung dengan kedua argumen.","source":"AyoCPNS"},{"n":35,"section":"TIU","topic":"Verbal · Penalaran","prompt":"Tidak ada teknologi yang mengabaikan keamanan data yang disetujui oleh komite etika digital. Semua inovasi yang disetujui oleh komite etika digital adalah produk yang menjunjung tinggi privasi pengguna. Beberapa produk yang menjunjung tinggi privasi pengguna adalah aplikasi yang populer di kalangan milenial. Kesimpulan yang paling tepat adalah...","options":["Semua aplikasi yang populer di kalangan milenial adalah teknologi yang tidak mengabaikan keamanan data.","Beberapa teknologi yang tidak mengabaikan keamanan data adalah aplikasi yang populer di kalangan milenial.","Tidak ada aplikasi yang populer di kalangan milenial yang mengabaikan keamanan data.","Semua produk yang menjunjung tinggi privasi pengguna adalah teknologi yang tidak mengabaikan keamanan data.","Beberapa inovasi yang disetujui oleh komite etika digital adalah aplikasi yang populer di kalangan milenial."],"answer":"B","points":[0,5,0,0,0],"explanation":"A. ✕ Tidak semua aplikasi populer memiliki hubungan dengan teknologi yang dimaksud.\nB. ✓ Ada produk privasi tinggi yang merupakan aplikasi populer; inovasi yang disetujui termasuk teknologi aman.\nC. ✕ Tidak dapat disimpulkan semua aplikasi populer mengabaikan keamanan data.\nD. ✕ Tidak semua produk privasi tinggi merupakan teknologi yang disetujui komite.\nE. ✕ Tidak ada informasi bahwa aplikasi populer tersebut merupakan inovasi yang disetujui komite.","source":"AyoCPNS"},{"n":36,"section":"TIU","topic":"Verbal · Penalaran","prompt":"Jika suatu daerah memiliki tata kelola pemerintahan yang transparan, maka kepercayaan masyarakat terhadap pemerintah meningkat. Jika kepercayaan masyarakat terhadap pemerintah meningkat, maka partisipasi masyarakat dalam program pembangunan bertambah. Kesimpulan yang sah adalah ...","options":["Jika partisipasi masyarakat dalam pembangunan bertambah, maka tata kelola pemerintahan transparan.","Jika tata kelola pemerintahan tidak transparan, maka partisipasi masyarakat berkurang.","Tata kelola pemerintahan yang transparan menyebabkan meningkatnya partisipasi masyarakat dalam pembangunan.","Semua daerah dengan partisipasi masyarakat tinggi memiliki tata kelola pemerintahan yang transparan.","Kepercayaan masyarakat meningkat hanya karena tata kelola pemerintahan transparan."],"answer":"C","points":[0,0,5,0,0],"explanation":"Misalkan:\np = tata kelola pemerintahan transparan.\nq = kepercayaan masyarakat meningkat.\nr = partisipasi masyarakat bertambah. Premis 1: p → q.\nPremis 2: q → r. Dengan menggunakan Silogisme, diperoleh: p → r.\nJadi, tata kelola pemerintahan yang transparan menyebabkan meningkatnya partisipasi masyarakat dalam pembangunan.","source":"AyoCPNS"},{"n":37,"section":"TIU","topic":"Verbal · Penalaran","prompt":"Dalam pengelolaan program pelatihan pegawai, semua pegawai yang memperoleh sertifikat kompetensi telah menyelesaikan ujian akhir. Sebagian pegawai yang menyelesaikan ujian akhir memperoleh rekomendasi untuk mengikuti program lanjutan. Kesimpulan: 1. Sebagian pegawai yang memperoleh sertifikat kompetensi mendapat rekomendasi mengikuti program lanjutan. 2. Semua pegawai yang mendapat rekomendasi mengikuti program lanjutan telah menyelesaikan ujian akhir.","options":["Hanya kesimpulan (1) yang tepat.","Hanya kesimpulan (2) yang tepat.","Kesimpulan (1) dan (2) tidak relevan.","Kesimpulan (1) dan (2) tepat.","Kesimpulan (1) dan (2) tidak tepat."],"answer":"E","points":[0,0,0,0,5],"explanation":"Premis pertama:\nSemua pegawai yang memperoleh sertifikat kompetensi → telah menyelesaikan ujian akhir. Premis kedua:\nSebagian pegawai yang menyelesaikan ujian akhir → memperoleh rekomendasi program lanjutan. Kesimpulan (1): “Sebagian pegawai yang memperoleh sertifikat kompetensi mendapat rekomendasi.”\n→ Tidak tepat. Pegawai yang memperoleh sertifikat memang pasti telah menyelesaikan ujian akhir, tetapi premis kedua hanya menyatakan sebagian pegawai yang menyelesaikan ujian akhir memperoleh rekomendasi. Belum tentu pegawai yang memperoleh sertifikat termasuk dalam sebagian kelompok tersebut. Kesimpulan (2): “Semua pegawai yang mendapat rekomendasi telah menyelesaikan ujian akhir.”\n→ Tidak tepat. Premis kedua hanya menyatakan sebagian pegawai yang menyelesaikan ujian akhir memperoleh rekomendasi. Pernyataan ini tidak dapat dibalik menjadi semua penerima rekomendasi telah menyelesaikan ujian akhir. Jadi, kesimpulan (1) dan (2) sama-sama tidak dapat dipastikan benar.","source":"AyoCPNS"},{"n":38,"section":"TIU","topic":"Verbal · Logika Analitik","prompt":"Sebuah pemerintah daerah menyatakan bahwa pembangunan pusat parkir terpadu di sekitar stasiun akan mengurangi kemacetan karena kendaraan pribadi dapat ditinggalkan di area parkir sebelum masyarakat melanjutkan perjalanan menggunakan transportasi umum. Manakah pernyataan berikut yang MEMPERLEMAH pernyataan tersebut?","options":["Sebagian pengguna transportasi umum lebih memilih berjalan kaki dari stasiun menuju tempat kerja.","Tarif parkir di pusat parkir terpadu lebih murah daripada tarif parkir di pusat kota. Nas","Sebagian besar pengguna kendaraan pribadi yang menuju pusat kota berasal dari kawasan yang tidak 37 memiliki akses langsung ke stasiun.","Pemerintah menyediakan jalur pejalan kaki yang menghubungkan pusat parkir dengan stasiun.","Kapasitas pusat parkir terpadu lebih besar daripada kapasitas beberapa tempat parkir di sekitar stasiun."],"answer":"C","points":[0,0,5,0,0],"explanation":"Pernyataan utama mengasumsikan bahwa pembangunan parkir terpadu akan membuat pengguna kendaraan pribadi beralih ke transportasi umum. A tidak memperlemah, karena justru menunjukkan kemudahan melanjutkan perjalanan setelah menggunakan transportasi umum.\nB tidak memperlemah, karena tarif yang lebih murah dapat menarik pengguna kendaraan.\nC memperlemah, karena jika sebagian besar pengguna kendaraan berasal dari wilayah yang tidak memiliki akses langsung ke stasiun, mereka tetap membutuhkan kendaraan untuk mencapai pusat kota sehingga pengaruh parkir terpadu terhadap kemacetan menjadi terbatas.\nD tidak memperlemah, karena memperkuat kemudahan perpindahan dari parkir ke stasiun.\nE tidak memperlemah, karena kapasitas lebih besar justru mendukung penggunaan fasilitas tersebut.","source":"AyoCPNS"},{"n":39,"section":"TIU","topic":"Verbal · Logika Analitik","prompt":"Sebuah kelompok pecinta alam yang terdiri atas Raka, Bima, Citra, Deni, dan Elsa akan melakukan pendakian. Mereka berbaris satu lajur sebelum memulai perjalanan. Ketua kelompok berada paling depan dan tidak membawa perlengkapan. Bima membawa peta, sedangkan Citra berada di tengah barisan. Raka berada paling belakang dan tepat di belakang anggota yang membawa tenda. Anggota yang membawa tenda berada tepat di depan anggota yang membawa logistik. Elsa tidak berada di posisi paling depan. Siapakah yang menjadi ketua kelompok?","options":["Raka","Bima","Citra","Deni","Elsa"],"answer":"D","points":[0,0,0,5,0],"explanation":"• Raka berada paling belakang → posisi 5.\n• Citra berada di tengah → posisi 3.\n• Pembawa tenda tepat di depan pembawa logistik.\n• Raka tepat di belakang pembawa tenda → pembawa tenda berada di posisi 4.\n• Karena pembawa logistik berada tepat di belakang pembawa tenda → Raka menjadi pembawa logistik.\n• Bima membawa peta → bukan ketua.\n• Elsa tidak boleh berada di posisi pertama. Dengan demikian, yang dapat menempati posisi pertama dan tidak membawa perlengkapan adalah Deni.","source":"AyoCPNS"},{"n":40,"section":"TIU","topic":"Verbal · Logika Analitik","prompt":"Kepala Dinas Pendidikan melakukan kunjungan ke tujuh sekolah, di antaranya sekolah P, Q, R, S, T, U, dan V. Rute kunjungan tersebut akan lebih efektif jika mengikuti ketentuan berikut: • Sekolah P adalah sekolah kelima yang dikunjungi. • Sekolah U harus segera dikunjungi begitu selesai mengunjungi sekolah P. • Mengunjungi sekolah T sebelum sekolah U akan memerlukan waktu yang lebih banyak. • Sekolah S harus dikunjungi setelah sekolah Q dan sebelum sekolah V. Urutan rute kunjungan yang mengikuti ketentuan tersebut adalah ....","options":["R – Q – S – V – P – U – T","R – Q – S – V – P – T – U","Q – S – V – U – P – R – T","Q – S – T – U – P – V – R","S – Q – V – R – P – U – T"],"answer":"A","points":[5,0,0,0,0],"explanation":"A. R – Q – S – V – P – U – T ✓\n• P ke-5.\n• U langsung setelah P.\n• T setelah U.\n• Q – S – V. B. R – Q – S – V – P – T – U ✕\n• U tidak langsung setelah P. C. Q – S – V – U – P – R – T ✕\n• U tidak langsung setelah P. D. Q – S – T – U – P – V – R ✕\n• U tidak langsung setelah P. E. S – Q – V – R – P – U – T ✕\n• S tidak berada setelah Q.","source":"AyoCPNS"},{"n":41,"section":"TIU","topic":"Verbal · Logika Analitik","prompt":"Seorang pemilik toko membeli novel, komik, majalah, buku tulis, pulpen, pensil, dan penghapus untuk mengisi persediaan tokonya. Jumlah buku tulis yang dibeli lebih banyak daripada jumlah barang lainnya. Jumlah novel yang dibeli lebih sedikit daripada komik, tetapi lebih banyak daripada majalah. Jumlah pulpen lebih banyak daripada pensil, sedangkan jumlah pensil lebih banyak daripada penghapus. Jumlah majalah lebih banyak daripada penghapus, tetapi lebih sedikit daripada pensil. Pernyataan berikut yang pasti benar adalah ...","options":["Jumlah komik lebih banyak daripada pulpen.","Jumlah novel lebih banyak daripada pensil.","Jumlah pulpen lebih banyak daripada majalah.","Jumlah pensil lebih banyak daripada novel.","Jumlah penghapus lebih banyak daripada majalah."],"answer":"C","points":[0,0,5,0,0],"explanation":"Urutan jumlah barang yang dapat diketahui:\nBuku tulis > Komik > Novel > Majalah > Penghapus.\nPulpen > Pensil > Penghapus.\nMajalah > Penghapus dan Majalah < Pensil. A. Salah. Tidak dapat dipastikan apakah jumlah komik lebih banyak daripada pulpen karena posisi komik dan pulpen tidak dapat dibandingkan secara langsung.\nB. Salah. Jumlah novel dan pensil tidak memiliki hubungan pasti. Novel bisa lebih banyak atau lebih sedikit daripada pensil.\nC. Benar. Pulpen > Pensil > Majalah, sehingga jumlah pulpen pasti lebih banyak daripada majalah.\nD. Salah. Jumlah pensil dan novel tidak dapat dibandingkan secara pasti berdasarkan informasi yang diberikan.\nE. Salah. Diketahui justru majalah > penghapus, sehingga penghapus tidak lebih banyak daripada majalah.","source":"AyoCPNS"},{"n":42,"section":"TIU","topic":"Numerik · Hitung Cepat","prompt":"Hasil yang mendekati dari 738 × 42 ÷ 19 adalah ....","options":["1.500","1.550","1.600","1.650","1.700"],"answer":"D","points":[0,0,0,5,0],"explanation":"738 ≈ 740 740 ÷ 19 ≈ 39 39 × 42 = 1.638 Jadi, hasil yang mendekati adalah 1.650 (D).","source":"AyoCPNS"},{"n":43,"section":"TIU","topic":"Numerik · Hitung Cepat","prompt":"Hasil yang mendekati dari 1.183 × 42 ÷ 19 adalah ....","options":["2.450","2.500","2.550","2.600","2.650"],"answer":"D","points":[0,0,0,5,0],"explanation":"1.183 ≈ 1.180 1.180 ÷ 19 ≈ 62 62 × 42 = 2.604 Hasil yang paling dekat dengan 2.604 adalah 2.600.","source":"AyoCPNS"},{"n":44,"section":"TIU","topic":"Numerik · Hitung Cepat","prompt":"Carilah pasangan pembagian yang memiliki nilai sama!","options":["1.248 ÷ 24 dan 1.575 ÷ 30","1.365 ÷ 35 dan 1.440 ÷ 36","1.536 ÷ 32 dan 1.680 ÷ 35","1.728 ÷ 36 dan 1.890 ÷ 40","1.890 ÷ 42 dan 2.016 ÷ 44"],"answer":"C","points":[0,0,5,0,0],"explanation":"A. 1.248 : 1.575 → tidak sama dengan 24 : 30.\n→ Tidak sama. B. 1.365 : 1.440 → tidak sama dengan 35 : 36.\n→ Tidak sama. C. 1.536 : 1.680 → ÷48 = 32 : 35.\n32 : 35 → 32 : 35.\n→ Sama. D. 1.728 : 1.890 → ÷54 = 32 : 35.\n36 : 40 → ÷4 = 9 : 10.\n→ Tidak sama. E. 1.890 : 2.016 → ÷126 = 15 : 16.\n42 : 44 → ÷2 = 21 : 22.\n→ Tidak sama.","source":"AyoCPNS"},{"n":45,"section":"TIU","topic":"Numerik · Hitung Cepat","prompt":"Sebuah percetakan membandingkan beberapa kombinasi jumlah buku dan jumlah halaman setiap buku. Kombinasi yang menghasilkan jumlah halaman keseluruhan sama adalah ....","options":["84 × 425 sama dengan 105 × 340","96 × 375 sama dengan 125 × 290","108 × 352 sama dengan 132 × 286","117 × 342 sama dengan 153 × 260","126 × 315 sama dengan 135 × 290"],"answer":"A","points":[5,0,0,0,0],"explanation":"Gunakan perbandingan: a × b = c × d → a : c = d : b. A. 84 : 105 = 340 : 425.\n84 : 105 = 4 : 5 dan 340 : 425 = 4 : 5.\n→ Sama. B. 96 : 125 tidak sama dengan 290 : 375.\n→ Tidak sama. C. 108 : 132 = 9 : 11, sedangkan 286 : 352 = 13 : 16.\n→ Tidak sama. D. 117 : 153 = 13 : 17, sedangkan 260 : 342 = 130 : 171.\n→ Tidak sama. E. 126 : 135 = 14 : 15, sedangkan 290 : 315 = 58 : 63.\n→ Tidak sama.","source":"AyoCPNS"},{"n":46,"section":"TIU","topic":"Numerik · Deret","prompt":"Perhatikan tabel berikut! Nilai ? adalah ....","options":["255","273","281","271","275"],"answer":"D","points":[0,0,0,5,0],"explanation":"Pola setiap kolom: ×3 − 2. 11 × 3 − 2 = 31\n31 × 3 − 2 = 91\n91 × 3 − 2 = 271","source":"AyoCPNS","table":{"headers":[],"rows":[["5","7","9","11"],["13","19","25","31"],["37","55","73","91"],["109","163","217","?"]]}},{"n":47,"section":"TIU","topic":"Numerik · Deret","prompt":"Perhatikan tabel berikut! Nilai ? adalah ....","options":["101","111","124","131","141"],"answer":"C","points":[0,0,5,0,0],"explanation":"Pola setiap kolom: ×2 + 4. Kolom terakhir:\n12 × 2 + 4 = 28\n28 × 2 + 4 = 60\n60 × 2 + 4 = 124","source":"AyoCPNS","table":{"headers":[],"rows":[["6","8","10","12"],["16","20","24","28"],["36","44","52","60"],["76","92","108","?"]]}},{"n":48,"section":"TIU","topic":"Numerik · Deret","prompt":"Perhatikan tabel berikut! Nilai ? adalah ....","options":["321","364","325","368","362"],"answer":"C","points":[0,0,5,0,0],"explanation":"Pola setiap kolom: ×3 − 2. Kolom terakhir:\n13 × 3 − 2 = 37\n37 × 3 − 2 = 109\n109 × 3 − 2 = 325","source":"AyoCPNS","table":{"headers":[],"rows":[["7","9","11","13"],["19","25","31","37"],["55","73","91","109"],["163","217","271","?"]]}},{"n":49,"section":"TIU","topic":"Numerik · Deret","prompt":"Perhatikan tabel berikut! Nilai ? adalah ....","options":["369","377","373","375","379"],"answer":"B","points":[0,5,0,0,0],"explanation":"Pola setiap kolom: ×3 + 2. Kolom terakhir:\n13 × 3 + 2 = 41\n41 × 3 + 2 = 125\n125 × 3 + 2 = 377","source":"AyoCPNS","table":{"headers":[],"rows":[["4","7","10","13"],["14","23","32","41"],["44","71","98","125"],["134","215","296","?"]]}},{"n":50,"section":"TIU","topic":"Numerik · Perbandingan","prompt":"Sebuah mesin cetak otomatis bekerja dengan kecepatan tetap. Berapa jumlah halaman dokumen yang dapat dicetak dalam 20 menit?\n(1) Mesin tersebut dapat menghasilkan 600 halaman dalam 12 menit.\n(2) Mesin tersebut mencetak dengan kecepatan 50 halaman per menit.","options":["Pernyataan (1) SAJA cukup untuk menjawab pertanyaan, tetapi pernyataan (2) SAJA tidak cukup.","Pernyataan (2) SAJA cukup untuk menjawab pertanyaan, tetapi pernyataan (1) SAJA tidak cukup.","Kedua pernyataan BERSAMA-SAMA cukup untuk menjawab pertanyaan, tetapi masing-masing pernyataan SAJA tidak cukup.","Masing-masing pernyataan (1) dan (2) SAJA sudah cukup.","Pernyataan (1) dan pernyataan (2) tidak cukup."],"answer":"D","points":[0,0,0,5,0],"explanation":"Gunakan hubungan:\nJumlah halaman = kecepatan × waktu. Pernyataan (1):\n600 halaman dalam 12 menit.\nKecepatan: 600 ÷ 12 = 50 halaman/menit.\nDalam 20 menit: 50 × 20 = 1.000 halaman.\n→ CUKUP. Pernyataan (2):\nKecepatan = 50 halaman/menit.\nWaktu = 20 menit.\nJumlah halaman: 50 × 20 = 1.000 halaman.\n→ CUKUP. Jadi, masing-masing pernyataan (1) dan (2) SAJA sudah cukup.","source":"AyoCPNS"},{"n":51,"section":"TIU","topic":"Numerik · Perbandingan","prompt":"Sejumlah pekerja membuat keranjang anyaman dengan kemampuan kerja yang
