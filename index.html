<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1677ff">
  <meta name="description" content="Bonus Bimbel SKD Batch 5 — Tryout dan Latihan Soal SKD">
  <title>Patungan Bimbel SKD — Bonus Batch 5</title>
  <link rel="icon" href="assets/logo.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="authScreen" class="auth-screen">
    <div class="auth-card">
      <div class="brand-mark">
        <img src="assets/logo.png" alt="Patungan Bimbel SKD">
      </div>
      <div class="eyebrow">BONUS BIMBEL SKD BATCH 5</div>
      <h1>Siap latihan menuju CPNS 2027?</h1>
      <p class="muted">Masukkan password akses bonus untuk membuka Tryout dan Latihan Soal SKD.</p>
      <form id="loginForm" class="login-form">
        <label for="password">Password akses</label>
        <div class="password-wrap">
          <input id="password" type="password" autocomplete="off" placeholder="Masukkan password" required>
          <button type="button" id="togglePassword" class="icon-btn" aria-label="Tampilkan password">◉</button>
        </div>
        <button class="primary-btn full" type="submit">Masuk ke Bonus SKD <span>→</span></button>
        <div id="loginError" class="error-text" role="alert"></div>
      </form>
      <div class="auth-note">Akses bonus • Patungan Bimbel SKD</div>
    </div>
  </div>

  <div id="app" class="app hidden">
    <aside class="sidebar">
      <div class="sidebar-brand">
        <img src="assets/logo.png" alt="Patungan Bimbel SKD">
        <div>
          <strong>Patungan</strong>
          <span>Bimbel SKD</span>
        </div>
      </div>

      <nav class="nav">
        <button class="nav-item active" data-route="dashboard"><span class="nav-icon">⌂</span> Dashboard</button>
        <button class="nav-item" data-route="tryout"><span class="nav-icon">▣</span> Tryout</button>
        <button class="nav-item" data-route="latihan"><span class="nav-icon">✎</span> Latihan Soal</button>
        <button class="nav-item" data-route="hasil"><span class="nav-icon">◔</span> Hasil & Pembahasan</button>
      </nav>

      <div class="sidebar-bottom">
        <div class="mini-card">
          <span class="mini-label">BONUS AKSES</span>
          <strong>Batch 5</strong>
          <small>Tryout + latihan soal</small>
        </div>
        <button id="logoutBtn" class="nav-item danger"><span class="nav-icon">↪</span> Keluar</button>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div>
          <div id="topEyebrow" class="top-eyebrow">BONUS BIMBEL SKD BATCH 5</div>
          <h2 id="pageTitle">Dashboard Belajar</h2>
        </div>
        <div id="topActions" class="top-actions"></div>
      </header>

      <div id="content" class="content"></div>
    </main>
  </div>

  <div id="modalRoot"></div>
  <div id="toastRoot"></div>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
